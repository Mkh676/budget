                    <span className="money-edit">
                      <input type="number" aria-label={t("Montant épargné (manuel)")} value={curManualSavings} autoFocus={curManualSavings === 0}
                        onChange={(e) => updateSavings(selectedMonth, parseFloat(e.target.value) || 0)} />
                      <button className="icon-btn" aria-label={t("Retirer")} onClick={() => { updateSavings(selectedMonth, 0); setManualSavingsOpen((o) => ({ ...o, [selectedMonth]: false })); }}>✕</button>
                    </span>
                  </div>
                )}
              </div>
              {!showManualSavings && (
                <button className="add-line" onClick={() => setManualSavingsOpen((o) => ({ ...o, [selectedMonth]: true }))}>{t("+ Ajouter un montant manuel")}</button>
              )}
              {savedPct !== null && curSavings > 0 && <span className="money-note">{t("{pct} % des revenus mis de côté", { pct: savedPct })}</span>}
            </div>
          </div>
        );
      })()}

      <div className="panel">
        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }} onClick={() => setShowRecurringFees((v) => !v)}>
          <span>{t("Charges récurrentes (prélèvements prévus) — {n}", { n: recurringFees.length })}</span>
          <span style={{ fontSize: 12, color: "var(--gold)" }}>{t(showRecurringFees ? "Masquer ▲" : "Voir / modifier ▼")}</span>
        </div>
        {showRecurringFees && (
          <React.Fragment>
            {recurringFees.map((f) => {
              const status = feeStatus(f);
              const catName = categories.find((c) => c.id === f.categoryId)?.name;
              const statusIcon =
                status === "confirmed" ? <span title={t("Confirmé — transaction trouvée dans « {cat} » ce mois-ci", { cat: catName })} style={{ color: "var(--green)" }}>✓</span> :
                status === "overdue" ? <span title={t("Le jour est passé mais aucune transaction trouvée dans cette catégorie — pas encore importée, ou en retard")} style={{ color: "var(--red)" }}>⚠</span> :
                status === "upcoming" ? <span title={t("Pas encore dû ce mois-ci")} style={{ color: "var(--gold)" }}>⏳</span> :
                <span title={t("Pas encore de transaction correspondante ce mois-ci")} style={{ color: "var(--ink-soft)" }}>·</span>;
              return (
                <div className="row" key={f.id} style={{ gridTemplateColumns: "1fr 90px 140px 110px 32px" }}>
                  <input type="text" value={f.label} onChange={(e) => updateRecurringFee(f.id, "label", e.target.value)} />
                  <input type="number" value={f.amount} onChange={(e) => updateRecurringFee(f.id, "amount", parseFloat(e.target.value) || 0)} />
                  <select value={f.categoryId} onChange={(e) => updateRecurringFee(f.id, "categoryId", e.target.value)} style={{ fontFamily: "var(--font-mono)", fontSize: 12, padding: 4, border: "1px solid var(--rule)", borderRadius: 3, background: "#fff" }}>
                    <option value="">{t("— Catégorie —")}</option>
                    {categories.map((c) => (<option key={c.id} value={c.id}>{c.name}</option>))}
                  </select>
                  <div style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 12, color: "var(--ink-soft)" }}>
                    {t("le")}
                    <input
                      type="number" min="1" max="31"
                      style={{ width: 40, fontFamily: "var(--font-mono)", fontSize: 12, border: "1px solid var(--rule)", borderRadius: 3, padding: 4, textAlign: "center" }}
                      value={f.dayOfMonth}
                      onChange={(e) => updateRecurringFee(f.id, "dayOfMonth", Math.min(31, Math.max(1, parseInt(e.target.value) || 1)))}
                    />
                    {statusIcon}
                  </div>
                  <button className="icon-btn" onClick={() => removeRecurringFee(f.id)}>✕</button>
                </div>
              );
            })}
            <button className="add-line" onClick={addRecurringFee}>{t("+ Ajouter une charge récurrente")}</button>
            {recurringFees.length > 0 && (
              <div className="import-hint" style={{ padding: "8px 16px 12px" }}>
                <strong style={{ color: "var(--green)" }}>{fmt(confirmedTotal)}</strong> {t("confirmée(s) par une vraie transaction ({n})", { n: confirmedFees.length })} · <strong style={{ color: "var(--gold)" }}>{fmt(outstandingTotal)}</strong> {t("pas encore vue(s) ({n}).", { n: outstandingFees.length })} {t("Dès qu'une transaction apparaît dans la catégorie liée (import ou saisie manuelle), la charge passe automatiquement en « confirmé ».")}
              </div>
            )}
          </React.Fragment>
        )}
      </div>

      <div className="panel tx-panel" id="tx-panel">
        <div className="panel-title tx-head" onClick={() => setShowTransactions((v) => !v)}>
          <span>{t("Transactions")}</span>
          <span className="tx-head-side">{t("{n} ce mois", { n: monthTransactions(selectedMonth).length })} · <span className="tx-toggle">{t(showTransactions ? "Masquer ▲" : "Voir ▼")}</span></span>
        </div>
        {showTransactions && (
          <div className="tx-body">
            {(() => {
              const everything = monthTransactions(selectedMonth);
              // Search: keyword in the label (accents/case ignored), or an amount / amount range.
              const amountTest = parseAmountQuery(txQuery);
              const words = normText(txQuery).split(" ").filter(Boolean);
              const matchesSearch = (tx) => {
                if (!txQuery.trim()) return true;
                if (amountTest && amountTest(Math.abs(Number(tx.amount) || 0))) return true;
                const label = normText(tx.label);
                return words.length > 0 && words.every((w) => label.includes(w));
              };
              const catOf = (tx) => categories.find((c) => c.id === tx.categoryId);
              const catName = (tx) => catOf(tx)?.name || "";
              const toCheck = (tx) => !!catOf(tx) && (tx.categorySource === "keyword" || tx.categorySource === "internal");
              const matchesCategory = (tx) =>
                !txCatFilter ? true :
                txCatFilter === "__none__" ? !catOf(tx) :
                txCatFilter === "__check__" ? toCheck(tx) :
                txCatFilter === "__rec__" ? !!tx.recurring :
                tx.categoryId === txCatFilter;
              const day = (tx) => { const d = dateToDayNumber(tx.date); return d === null ? -Infinity : d; };
              const sorters = {
                date_desc: (a, b) => day(b) - day(a),
                date_asc: (a, b) => day(a) - day(b),
                amount_desc: (a, b) => (Number(b.amount) || 0) - (Number(a.amount) || 0),
                amount_asc: (a, b) => (Number(a.amount) || 0) - (Number(b.amount) || 0),
                category: (a, b) => (catName(a) || "￿").localeCompare(catName(b) || "￿", LANG) || day(b) - day(a),
                label: (a, b) => (a.label || "").localeCompare(b.label || "", LANG),
              };
              const sortKey = txSort === "default" ? "date_desc" : txSort;
              const all = everything.filter((tx) => matchesSearch(tx) && matchesCategory(tx));
              all.sort(sorters[sortKey]);
              const filtering = !!(txQuery.trim() || txCatFilter);
              const filteredTotal = all.reduce((s, tx) => s + (Number(tx.amount) || 0), 0);
              const counts = {
                check: everything.filter(toCheck).length,
                none: everything.filter((tx) => !catOf(tx)).length,
                rec: everything.filter((tx) => tx.recurring).length,
              };
              const LIMIT = 30;
              const limited = !filtering && !txShowAll && all.length > LIMIT;
              const shown = limited ? all.slice(0, LIMIT) : all;
              // Grouped by day when sorted by date; transactions without a date come first.
              const byDate = sortKey === "date_desc" || sortKey === "date_asc";
              const groups = [];
              if (byDate) {
                const undated = shown.filter((tx) => day(tx) === -Infinity);
                if (undated.length) groups.push({ key: "none", title: t("Sans date"), items: undated });
                shown.forEach((tx) => {
                  const d = day(tx);
                  if (d === -Infinity) return;
                  const last = groups[groups.length - 1];
                  if (last && last.key === d) last.items.push(tx);
                  else groups.push({ key: d, title: dayTitle(d), items: [tx] });
                });
              } else groups.push({ key: "all", title: null, items: shown });

              const renderRow = (tx) => {
                const open = openTx === tx.id;
                const cat = catOf(tx);
                const amount = Number(tx.amount) || 0;
                return (
                  <div key={tx.id} className={"tx-item" + (open ? " open" : "")}>
                    <button type="button" className="tx-line" title={tx.label} onClick={() => setOpenTx(open ? null : tx.id)}>
                      <span className="tx-name">
                        {tx.recurring && <span className="tx-rec" title={t("Récurrente")}>🔁</span>}
                        {prettyTxLabel(tx.label) || <em>{t("Sans libellé")}</em>}
                      </span>
                      <span
                        className={"tx-chip" + (!cat ? " none" : toCheck(tx) ? " check" : "")}
                        style={cat && !toCheck(tx) ? chipColors(cat.id) : undefined}
                        title={cat ? t(CATEGORY_SOURCE_LABELS[tx.categorySource] || "") : t("Aucune catégorie")}
                      >
                        {cat ? cat.name : t("Sans catégorie")}{toCheck(tx) ? " ?" : ""}
                      </span>
                      <span className={"tx-amt" + (amount < 0 ? " in" : "")}>{amount < 0 ? "+" : amount > 0 ? "−" : ""}{fmtCents(Math.abs(amount))}</span>
                    </button>
                    {open && (
                      <div className="tx-edit">
                        <label className="tx-field tx-f-date">
                          <span>{t("Date")}</span>
                          <input type="text" value={tx.date} placeholder="2026-09-30" onChange={(e) => updateTransactionField(selectedMonth, tx.id, "date", e.target.value)} />
                        </label>
                        <label className="tx-field tx-f-label">
                          <span>{t("Libellé")}</span>
                          <input type="text" value={tx.label} placeholder={t("libellé")} onChange={(e) => updateTransactionField(selectedMonth, tx.id, "label", e.target.value)} />
                        </label>
                        <label className="tx-field tx-f-amount">
                          <span>{t("Montant")}</span>
                          <input type="number" value={tx.amount} title={t("Positif = dépense, négatif = argent reçu")} onChange={(e) => updateTransactionField(selectedMonth, tx.id, "amount", parseFloat(e.target.value) || 0)} />
                        </label>
                        <label className="tx-field tx-f-cat">
                          <span>{t("Catégorie")}</span>
                          <select value={tx.categoryId} onChange={(e) => updateTransactionCategory(selectedMonth, tx.id, e.target.value)}>
                            <option value="">{t("— Non catégorisé —")}</option>
                            {categories.map((c) => (<option key={c.id} value={c.id}>{c.name}</option>))}
                            <option value="__new__">{t("+ Nouvelle catégorie…")}</option>
                          </select>
                        </label>
                        <div className="tx-edit-actions">
                          {toCheck(tx) && (
                            <button type="button" className="tx-btn confirm" title={t("La catégorie sera retenue pour ce marchand")} onClick={() => updateTransactionCategory(selectedMonth, tx.id, tx.categoryId)}>
                              {t("✓ Confirmer « {cat} »", { cat: cat.name })}
                            </button>
                          )}
                          <button type="button" className={"tx-btn" + (tx.recurring ? " on" : "")} onClick={() => toggleRecurring(selectedMonth, tx.id)}
                            title={t("Simple repère pour retrouver les dépenses qui reviennent chaque mois (filtre « Récurrentes »)")}>
                            🔁 {t(tx.recurring ? "Récurrente" : "Marquer récurrente")}
                          </button>
                          <button type="button" className="tx-btn danger" onClick={() => { removeTransaction(selectedMonth, tx.id); setOpenTx(null); }}>{t("✕ Supprimer")}</button>
                          <button type="button" className="tx-btn" onClick={() => setOpenTx(null)}>{t("Fermer")}</button>
                        </div>
                        <div className="tx-edit-hint">
                          {cat && CATEGORY_SOURCE_LABELS[tx.categorySource] ? t(CATEGORY_SOURCE_LABELS[tx.categorySource]) + " · " : ""}
                          {t("Montant positif = dépense, négatif = argent reçu.")}
                        </div>
                      </div>
                    )}
                    {suggestsRecurringFee(tx) && (
                      <div className="tx-note">
                        {t("Prélèvement — pas encore dans vos charges récurrentes.")}{" "}
                        <button className="btn-link" style={{ marginTop: 0, fontSize: 12 }} onClick={() => createFeeFromTransaction(selectedMonth, tx)}>
                          {t("+ Ajouter comme charge récurrente")}
                        </button>
                      </div>
                    )}
                    {txErrors[tx.id] && <div className="tx-note" style={{ color: "var(--red)" }}>{txErrors[tx.id]}</div>}
                  </div>
                );
              };

              const chip = (value, label, n) => (
                <button type="button" className={"tx-filter" + (txCatFilter === value ? " active" : "") + (value === "__none__" && n > 0 ? " warn" : "")}
                  onClick={() => setTxCatFilter(txCatFilter === value ? "" : value)}>
                  {label}{n !== undefined ? ` · ${n}` : ""}
                </button>
              );
              const isCatFilter = categories.some((c) => c.id === txCatFilter);
              return (
                <React.Fragment>
                  <input
                    type="search"
                    className="tx-search"
                    aria-label={t("Rechercher une transaction")}
                    placeholder={t("Rechercher : mot-clé, 42, 42,10, >100, 50-100…")}
                    title={t("Mot-clé dans le libellé, ou montant : 42 (42,00 à 42,99), 42,10 (exact), >100, <20, 50-100")}
                    value={txQuery}
                    onChange={(e) => setTxQuery(e.target.value)}
                  />
                  <div className="tx-filters">
                    {chip("", t("Toutes"))}
                    {counts.check > 0 && chip("__check__", t("À vérifier"), counts.check)}
                    {chip("__none__", t("Sans catégorie"), counts.none)}
                    {counts.rec > 0 && chip("__rec__", t("Récurrentes"), counts.rec)}
                    <select className={"tx-select" + (isCatFilter ? " active" : "")} aria-label={t("Filtrer par catégorie")} value={isCatFilter ? txCatFilter : ""} onChange={(e) => setTxCatFilter(e.target.value)}>
                      <option value="">{t("Catégorie…")}</option>
                      {categories.map((c) => (<option key={c.id} value={c.id}>{c.name}</option>))}
                    </select>
                    <select className="tx-select" aria-label={t("Trier")} value={txSort} onChange={(e) => setTxSort(e.target.value)}>
                      <option value="default">{t("Tri : date (récent)")}</option>
                      <option value="date_asc">{t("Date (ancien)")}</option>
                      <option value="amount_desc">{t("Montant (plus grand)")}</option>
                      <option value="amount_asc">{t("Montant (plus petit)")}</option>
                      <option value="category">{t("Catégorie (A→Z)")}</option>
                      <option value="label">{t("Libellé (A→Z)")}</option>
                    </select>
                    {(filtering || txSort !== "default") && (
                      <button className="btn-link" style={{ marginTop: 0 }} onClick={() => { setTxQuery(""); setTxCatFilter(""); setTxSort("default"); }}>{t("Réinitialiser")}</button>
                    )}
                  </div>
                  {filtering && all.length > 0 && (
                    <div className="tx-result">{t("{n} transaction(s) sur {total} · total {amt}", { n: all.length, total: everything.length, amt: fmt(filteredTotal) })}</div>
                  )}
                  {everything.length === 0 ? (
                    <div className="import-hint" style={{ padding: "16px 0" }}>{t("Aucune dépense enregistrée ce mois-ci pour l'instant.")}</div>
                  ) : all.length === 0 ? (
                    <div className="import-hint" style={{ padding: "16px 0" }}>{t("Aucune transaction ne correspond.")}</div>
                  ) : (
                    groups.map((g) => (
                      <div key={g.key} className="tx-group">
                        {g.title && <div className="tx-day">{g.title}</div>}
                        {g.items.map(renderRow)}
                      </div>
                    ))
                  )}
                  {limited && (
                    <button type="button" className="tx-more" onClick={() => setTxShowAll(true)}>{t("Voir les {n} transactions", { n: all.length })}</button>
                  )}
                </React.Fragment>
              );
            })()}
            <button className="add-line" onClick={() => addManualTransaction(selectedMonth)}>{t("+ Ajouter une dépense")}</button>
          </div>
        )}
      </div>

      <div className="panel">
        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }} onClick={() => setShowImportFiles((v) => !v)}>
          <span>{t("Relevés importés pour {m} ({n})", { m: curMonthLabel, n: monthImportFiles.length })}</span>
          <span style={{ fontSize: 12, color: "var(--gold)" }}>{t(showImportFiles ? "Masquer ▲" : "Voir ▼")}</span>
        </div>
        {showImportFiles && (
          monthImportFiles.length === 0 ? (
            <div className="import-hint" style={{ padding: 16 }}>{t("Aucun relevé importé pour ce mois. Chaque fichier importé est conservé ici et peut être re-téléchargé.")}</div>
          ) : (
            monthImportFiles.map((f) => (
              <div key={f.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 16px", borderBottom: "1px solid var(--rule)", fontSize: 12, flexWrap: "wrap" }}>
                <span style={{ flex: "1 1 200px", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={f.file_name}>{f.file_name}</span>
                <span style={{ color: "var(--ink-soft)" }}>
                  {new Date(f.created_at).toLocaleString(LOCALE(), { dateStyle: "short", timeStyle: "short" })}
                  {" · "}{t("{n} importée(s)", { n: f.imported_count })}{f.skipped_count > 0 ? t(", {n} déjà présente(s)", { n: f.skipped_count }) : ""}
                </span>
                <button className="reset-btn" onClick={() => downloadImportFile(f)}>{t("↓ Télécharger")}</button>
                <button className="icon-btn" title={t("Supprimer ce fichier de l'archive")} onClick={() => deleteImportFile(f)}>✕</button>
              </div>
            ))
          )
        )}
      </div>


      <div className="charts">
        <div className="chart-box">
          <p className="chart-title">{t("Dépenses par mois (hors épargne)")}</p>
          <MonthlySpendChart data={spendData} budget={monthBudgetTotal} selectedName={curMonthLabel}
            onPick={(id) => { setSelectedMonth(id); window.scrollTo({ top: 0, behavior: "smooth" }); }} />
          <p className="chart-hint">{t("Cliquez sur un mois pour l'ouvrir.")}</p>
          {overMonths.length > 0 && (
            <div className="om-list">
              <div className="om-title">{t("Mois au-dessus du budget")}</div>
              {overMonths.map((d) => (
                <div key={d.id} className="om-row">
                  <button type="button" className="om-month" onClick={() => { setSelectedMonth(d.id); window.scrollTo({ top: 0, behavior: "smooth" }); }}>{d.name}</button>
                  <span className="om-over">+{fmt(Math.round(d.overrun))}</span>
                  <span className="om-causes">
                    {d.causes.slice(0, 3).map((c) => (
                      <span key={c.id} className="om-cause">{c.name} <strong>+{fmt(Math.round(c.excess))}</strong>{c.noBudget ? t(" (sans budget)") : ""}</span>
                    ))}
                    {d.causes.length > 3 && <span className="om-cause more">+{d.causes.length - 3}</span>}
                  </span>
                </div>
              ))}
            </div>
          )}
          {budgetSuggestions.length > 0 && (
            <div className="sugg-list">
              <div className="om-title">{t("Suggestions")}</div>
              {budgetSuggestions.map((sg) => (
                <div key={sg.key + sg.kind} className={"sugg " + sg.kind}>
                  <span className="sugg-text">{sg.text}</span>
                  {sg.catId && sg.value !== undefined && (
                    <button type="button" className="sugg-btn" onClick={() => updateCategoryBudget(sg.catId, sg.value)}>
                      {sg.kind === "nobudget" ? t("Ajouter un budget de {amt}", { amt: fmt(sg.value) }) : t("Mettre le budget à {amt}", { amt: fmt(sg.value) })}
                    </button>
                  )}
                </div>
              ))}
              <p className="chart-hint">{t("Basé sur les mois terminés. Chaque bouton modifie le budget — « Annuler » en haut permet de revenir en arrière.")}</p>
            </div>
          )}
        </div>
      </div>
      </React.Fragment>)}
    </div>
  );
}


// ---------- Workspace: household budget, each member's personal budget, and the Total ----------
// Every member of the household can open the shared budget and every member's
// personal budget. A member's personal budget is created the first time they open the site.
function Workspace({ household, session, onLogout, onRename, lang, onLang }) {
  const me = session.user.id;
  const [members, setMembers] = useState(null); // [{ userId, name }], me first
  const spaceKey = "budget:space:" + household.id;
  const [space, setSpaceState] = useState(() => { try { return localStorage.getItem(spaceKey) || "household"; } catch (e) { return "household"; } });
  const setSpace = (s) => { setSpaceState(s); try { localStorage.setItem(spaceKey, s); } catch (e) {} };
  useEffect(() => {
    (async () => {
      const { data } = await sb.from("member_budget").select("user_id, data->ownerName").eq("household_id", household.id);
      let rows = data || [];
      if (!rows.some((r) => r.user_id === me)) {
        const ownerName = nameFromEmail(session.user.email);
        const doc = { ...emptyBudgetDoc(LANG, true), ownerName };
        const { error } = await sb.from("member_budget").insert({ household_id: household.id, user_id: me, data: doc });
        if (!error) rows = [...rows, { user_id: me, ownerName }];
      }
      const list = rows.map((r) => ({ userId: r.user_id, name: r.ownerName || "?" }))
        .sort((a, b) => (a.userId === me ? -1 : b.userId === me ? 1 : a.name.localeCompare(b.name)));
      setMembers(list);
    })();
  }, [household.id, me]);
  if (!members) return <div style={{ padding: 40 }}>{t("Chargement…")}</div>;
  const member = members.find((m) => m.userId === space);
  const current = space === "total" ? "total" : member ? space : "household";
  const spaceBar = (
    <div className="space-bar" role="tablist" aria-label={t("Budgets")}>
      <button role="tab" aria-selected={current === "household"} className={current === "household" ? "active" : ""} onClick={() => setSpace("household")}>{t("Foyer")}</button>
      {members.map((m) => (
        <button key={m.userId} role="tab" aria-selected={current === m.userId} className={current === m.userId ? "active" : ""} onClick={() => setSpace(m.userId)}>
          <span className="sp-pre">{t("Perso ·")} </span>{m.name}
        </button>
      ))}
      <button role="tab" aria-selected={current === "total"} className={current === "total" ? "active" : ""} onClick={() => setSpace("total")}>{t("Total")}</button>
    </div>
  );
  if (current === "total") return <TotalView household={household} members={members} spaceBar={spaceBar} onLogout={onLogout} lang={lang} onLang={onLang} />;
  const spaceObj = member ? { kind: "member", userId: member.userId, name: member.name } : { kind: "household" };
  // Names that identify the household's own accounts in bank labels (first names, and my e-mail's words).
  const nameWords = [...new Set([...members.map((m) => normText(m.name)), ...normText(String(session.user.email || "").split("@")[0]).split(" ")])].filter((w) => w.length >= 3 && w !== "moi");
  return <BudgetTracker key={current} household={household} onLogout={onLogout} onRename={onRename} lang={lang} onLang={onLang} space={spaceObj} spaceBar={spaceBar} nameWords={nameWords} />;
}

// ---------- Total: household + every member's personal budget ----------
// Spending of all budgets added up (transfers to the household are not spending),
// money saved each month, and the total of all savings accounts.
function TotalView({ household, members, spaceBar, onLogout, lang, onLang }) {
  const [docs, setDocs] = useState(null);
  useEffect(() => {
    (async () => {
      const [{ data: hh }, { data: mb }] = await Promise.all([
        sb.from("household_budget").select("data").eq("household_id", household.id).maybeSingle(),
        sb.from("member_budget").select("user_id, data").eq("household_id", household.id),
      ]);
      const list = [{ key: "household", name: t("Foyer"), doc: (hh && hh.data) || {} }];
      for (const m of members) {
        const row = (mb || []).find((r) => r.user_id === m.userId);
        if (row) list.push({ key: m.userId, name: m.name, doc: row.data });
      }
      setDocs(list.map((d) => ({ ...d, sum: summarizeBudgetDoc(d.doc) })));
    })();
  }, [household.id]);
  const now = new Date();
  const nowKey = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  const keys = docs ? [...new Set(docs.flatMap((d) => Object.keys(d.sum.months)))].filter((k) => k <= nowKey).sort().reverse() : [];
  const [sel, setSel] = useState(null);
  const month = sel && keys.includes(sel) ? sel : keys[0];
  const keyLabel = (k) => { const [y, mo] = k.split("-").map(Number); return monthName(mo - 1) + " " + y; };
  const val = (d, k, f) => (d.sum.months[k] ? d.sum.months[k][f] : 0);
  const header = (
    <header className="appbar">
      <div className="appbar-inner">
        <div style={{ display: "flex", alignItems: "baseline", gap: 10, minWidth: 0 }}>
          <span className="brand">{household.name}</span>
          <span className="brand-sub">{t("vue d'ensemble")}</span>
        </div>
        <div className="appbar-actions">
          <LangSwitch lang={lang} onChange={onLang} />
          <button className="logout-btn" onClick={onLogout}>{t("Se déconnecter")}</button>
        </div>
      </div>
      {spaceBar}
    </header>
  );
  if (!docs) return <div className="ledger">{header}<div style={{ padding: 40 }}>{t("Chargement…")}</div></div>;
  const total = (k, f) => docs.reduce((t2, d) => t2 + val(d, k, f), 0);
  const savingsTotal = docs.reduce((t2, d) => t2 + d.sum.savingsBalance, 0);
  return (
    <div className="ledger">
      {header}
      {!month ? (
        <div className="panel"><div className="import-hint" style={{ padding: 16 }}>{t("Aucune donnée pour l'instant.")}</div></div>
      ) : (<React.Fragment>
        <div className="month-bar">
          <select aria-label={t("Choisir le mois")} value={month} onChange={(e) => setSel(e.target.value)}>
            {keys.map((k) => <option key={k} value={k}>{keyLabel(k)}</option>)}
          </select>
        </div>
        <section className="hero total-hero" aria-label={t("Résumé de {m}", { m: keyLabel(month) })}>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <span className="hero-kicker">{t("Dépenses totales")}</span>
            <span className="hero-big">{fmt(Math.round(total(month, "spent")))}</span>
            <span className="total-split">{docs.map((d) => <span key={d.key}>{d.name} <strong>{fmt(Math.round(val(d, month, "spent")))}</strong></span>)}</span>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <span className="hero-label">{t("Épargné ce mois")}</span>
            <span className="hero-num">{fmt(Math.round(total(month, "saved")))}</span>
            <span className="total-split">{docs.map((d) => <span key={d.key}>{d.name} <strong>{fmt(Math.round(val(d, month, "saved")))}</strong></span>)}</span>
          </div>
          <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
            <span className="hero-label">{t("Épargne totale (tous les comptes)")}</span>
            <span className="hero-num">{fmt(Math.round(savingsTotal))}</span>
            <span className="total-split">{docs.map((d) => <span key={d.key}>{d.name} <strong>{fmt(Math.round(d.sum.savingsBalance))}</strong></span>)}</span>
          </div>
        </section>
        <div className="panel">
          <div className="panel-title">{t("Mois par mois")}</div>
          <div style={{ overflowX: "auto", padding: "8px 16px 12px" }}>
            <table style={{ width: "100%" }}>
              <thead>
                <tr><th>{t("Mois")}</th>{docs.map((d) => <th key={d.key} className="num">{d.name}</th>)}<th className="num">{t("Dépenses totales")}</th><th className="num">{t("Épargné")}</th></tr>
              </thead>
              <tbody>
                {keys.map((k) => (
                  <tr key={k} style={k === month ? { background: "var(--paper-alt)" } : undefined}>
                    <td><button className="om-month" style={{ fontWeight: k === month ? 700 : 400 }} onClick={() => setSel(k)}>{keyLabel(k)}</button></td>
                    {docs.map((d) => <td key={d.key} className="num">{fmt(Math.round(val(d, k, "spent")))}</td>)}
                    <td className="num"><strong>{fmt(Math.round(total(k, "spent")))}</strong></td>
                    <td className="num" style={{ color: "var(--gold)" }}>{fmt(Math.round(total(k, "saved")))}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="import-hint" style={{ padding: "0 16px 12px" }}>{t("Les « Virements internes » (entre vos comptes) ne sont pas comptés comme dépenses, pour ne pas compter deux fois le même argent.")}</div>
        </div>
      </React.Fragment>)}
    </div>
  );
}

// ---------- Top-level app: auth -> household -> tracker ----------
function App() {
  const [session, setSession] = useState(null);
  const [loadingSession, setLoadingSession] = useState(true);
  const [household, setHousehold] = useState(null);
  const [checkingHousehold, setCheckingHousehold] = useState(false);
  const [recovering, setRecovering] = useState(ARRIVED_FROM_RECOVERY_LINK);
  const [passwordChanged, setPasswordChanged] = useState(false);
  // Chosen language: kept in this browser and on the user's account (so it follows them to other devices).
  const [lang, setLangState] = useState(LANG);
  const applyLang = (l) => {
    LANG = l;
    document.documentElement.lang = l;
    try { localStorage.setItem("budget:lang", l); } catch (e) {}
    setLangState(l);
  };
  const changeLang = (l) => {
    applyLang(l);
    sb.auth.getSession().then(({ data }) => { if (data.session) sb.auth.updateUser({ data: { lang: l } }); });
  };
  useEffect(() => {
    const saved = session?.user?.user_metadata?.lang;
    if ((saved === "fr" || saved === "en") && saved !== LANG) applyLang(saved);
  }, [session?.user?.id]);

  useEffect(() => {
    document.documentElement.lang = LANG;
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setLoadingSession(false); });
    const { data: listener } = sb.auth.onAuthStateChange((event, s) => {
      if (event === "PASSWORD_RECOVERY") setRecovering(true);
      setSession(s);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  const lastCheckedUserId = useRef(null);
  useEffect(() => {
    const userId = session?.user?.id || null;
    if (!session) { setHousehold(null); lastCheckedUserId.current = null; return; }
    // Supabase silently refreshes the session token whenever the browser tab
    // regains focus — that fires this effect again with a *new* session object
    // for the *same* user. Without this guard, that was force-reloading the
    // whole app (and wiping any unsaved edits) just from switching tabs.
    if (userId === lastCheckedUserId.current) return;
    lastCheckedUserId.current = userId;
    (async () => {
      setCheckingHousehold(true);
      const { data } = await sb.from("household_members")
        .select("household_id, households(id, name, invite_code)")
        .eq("user_id", session.user.id).limit(1).maybeSingle();
      if (data && data.households) setHousehold(data.households);
      setCheckingHousehold(false);
    })();
  }, [session]);

  const logout = async () => { await sb.auth.signOut(); setHousehold(null); };

  const renameHousehold = async (newName) => {
    const { error } = await sb.from("households").update({ name: newName }).eq("id", household.id);
    if (error) {
      window.alert(t("Impossible de renommer le foyer : ") + error.message);
      return;
    }
    setHousehold((h) => ({ ...h, name: newName }));
  };

  if (loadingSession) return <div style={{ padding: 40 }}>{t("Chargement…")}</div>;
  if (!session) return <AuthScreen lang={lang} onLang={changeLang} />;
  if (recovering) return (
    <NewPasswordScreen onDone={() => {
      setRecovering(false); setPasswordChanged(true);
      window.history.replaceState(null, "", window.location.pathname);
      setTimeout(() => setPasswordChanged(false), 6000);
    }} />
  );
  if (checkingHousehold) return <div style={{ padding: 40 }}>{t("Chargement…")}</div>;
  return (
    <React.Fragment>
      {passwordChanged && <div className="toast">{t("✓ Mot de passe modifié.")}</div>}
      {household
        ? <Workspace household={household} session={session} onLogout={logout} onRename={renameHousehold} lang={lang} onLang={changeLang} />
        : <HouseholdSetup session={session} onReady={setHousehold} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  // Manually compile the app source with the CLASSIC JSX runtime.
  // (Babel's default "automatic" runtime injects an ES `import` statement,
  // which fails in a plain, non-module <script> tag.)
  (function () {
    var src = document.getElementById("app-source").textContent;
    var compiled = Babel.transform(src, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    var s = document.createElement("script");
    s.textContent = compiled;
    document.body.appendChild(s);
  })();
</script>
</body>
