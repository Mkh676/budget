        )}
      </div>

      <div className="panel">
        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }} onClick={() => setShowTransactions((v) => !v)}>
          <span>Transactions — {curMonthLabel} ({monthTransactions(selectedMonth).length})</span>
          <span style={{ fontSize: 12, color: "var(--gold)" }}>{showTransactions ? "Masquer ▲" : "Voir / modifier ▼"}</span>
        </div>
        {showTransactions && (
          <React.Fragment>
            {monthTransactions(selectedMonth).length === 0 ? (
              <div className="import-hint" style={{ padding: 16 }}>Aucune dépense enregistrée ce mois-ci pour l'instant.</div>
            ) : (
              (() => {
                const everything = monthTransactions(selectedMonth);
                // Search: keyword in the label (accents/case ignored), or an amount / amount range.
                const amountTest = parseAmountQuery(txQuery);
                const words = normText(txQuery).split(" ").filter(Boolean);
                const matchesSearch = (tx) => {
                  if (!txQuery.trim()) return true;
                  if (amountTest && amountTest(Math.abs(Number(tx.amount) || 0))) return true;
                  const label = normText(tx.label);
                  return words.length > 0 && words.every((w) => label.includes(w));
                };
                const catName = (tx) => categories.find((c) => c.id === tx.categoryId)?.name || "";
                const matchesCategory = (tx) =>
                  !txCatFilter ? true :
                  txCatFilter === "__none__" ? !categories.some((c) => c.id === tx.categoryId) :
                  tx.categoryId === txCatFilter;
                const day = (tx) => { const d = dateToDayNumber(tx.date); return d === null ? -Infinity : d; };
                const sorters = {
                  date_desc: (a, b) => day(b) - day(a),
                  date_asc: (a, b) => day(a) - day(b),
                  amount_desc: (a, b) => (Number(b.amount) || 0) - (Number(a.amount) || 0),
                  amount_asc: (a, b) => (Number(a.amount) || 0) - (Number(b.amount) || 0),
                  category: (a, b) => (catName(a) || "\uffff").localeCompare(catName(b) || "\uffff", "fr") || day(b) - day(a),
                  label: (a, b) => (a.label || "").localeCompare(b.label || "", "fr"),
                };
                const all = everything.filter((tx) => matchesSearch(tx) && matchesCategory(tx));
                if (sorters[txSort]) all.sort(sorters[txSort]);
                const filtering = !!(txQuery.trim() || txCatFilter);
                const filteredTotal = all.reduce((s, tx) => s + (Number(tx.amount) || 0), 0);
                const recurring = all.filter((tx) => tx.recurring);
                const uncategorized = all.filter((tx) => !tx.recurring && !tx.categoryId);
                const categorized = all.filter((tx) => !tx.recurring && tx.categoryId);
                const renderRow = (tx) => (
                  <React.Fragment key={tx.id}>
                    <div className="import-row tx-row">
                      <input
                        type="text"
                        className="tx-date"
                        style={{ fontFamily: "var(--font-mono)", fontSize: 12, border: "1px solid var(--rule)", borderRadius: 3, padding: 4, width: "100%" }}
                        value={tx.date}
                        placeholder="date"
                        onChange={(e) => updateTransactionField(selectedMonth, tx.id, "date", e.target.value)}
                      />
                      <input
                        type="text"
                        className="tx-label"
                        style={{ fontFamily: "var(--font-mono)", fontSize: 12, border: "1px solid var(--rule)", borderRadius: 3, padding: 4, width: "100%" }}
                        value={tx.label}
                        placeholder="libellé"
                        onChange={(e) => updateTransactionField(selectedMonth, tx.id, "label", e.target.value)}
                      />
                      <input
                        type="number"
                        className="tx-amount"
                        style={{ textAlign: "right", fontFamily: "var(--font-mono)", fontSize: 12, border: "1px solid var(--rule)", borderRadius: 3, padding: 4, color: tx.amount < 0 ? "var(--green)" : "var(--ink)" }}
                        value={tx.amount}
                        title={tx.amount < 0 ? "Argent reçu (réduit le total dépensé)" : "Dépense"}
                        onChange={(e) => updateTransactionField(selectedMonth, tx.id, "amount", parseFloat(e.target.value) || 0)}
                      />
                      <div className="tx-actions">
                        <select value={tx.categoryId} title={tx.categoryId && CATEGORY_SOURCE_LABELS[tx.categorySource] || ""} onChange={(e) => updateTransactionCategory(selectedMonth, tx.id, e.target.value)}>
                          <option value="">— Non catégorisé —</option>
                          {categories.map((c) => (<option key={c.id} value={c.id}>{c.name}</option>))}
                          <option value="__new__">+ Nouvelle catégorie…</option>
                        </select>
                        {tx.categoryId && tx.categorySource === "keyword" && (
                          <button
                            className="icon-btn"
                            style={{ color: "var(--gold)", fontWeight: 700, border: "1px solid var(--gold)", borderRadius: 4, padding: "0 6px" }}
                            title="Catégorie devinée d'après le libellé — à vérifier. Cliquer pour la confirmer (elle sera retenue pour ce marchand)."
                            onClick={() => updateTransactionCategory(selectedMonth, tx.id, tx.categoryId)}
                          >
                            ?
                          </button>
                        )}
                        <button
                          className="icon-btn"
                          style={{
                            background: tx.recurring ? "var(--gold)" : "transparent",
                            borderRadius: 4,
                            padding: "2px 5px",
                            opacity: tx.recurring ? 1 : 0.45,
                          }}
                          onClick={() => toggleRecurring(selectedMonth, tx.id)}
                          title={tx.recurring ? "Récurrente — recopiée automatiquement chaque mois. Cliquer pour désactiver." : "Marquer comme récurrente (recopiée automatiquement le mois prochain)"}
                        >
                          🔁
                        </button>
                        <button className="icon-btn" onClick={() => removeTransaction(selectedMonth, tx.id)}>✕</button>
                      </div>
                    </div>
                    {suggestsRecurringFee(tx) && (
                      <div style={{ fontSize: 11, color: "var(--ink-soft)", padding: "0 16px 8px" }}>
                        Prélèvement — pas encore dans vos charges récurrentes.{" "}
                        <button className="btn-link" style={{ marginTop: 0, fontSize: 11 }} onClick={() => createFeeFromTransaction(selectedMonth, tx)}>
                          + Ajouter comme charge récurrente
                        </button>
                      </div>
                    )}
                    {txErrors[tx.id] && (
                      <div style={{ fontSize: 11, color: "var(--red)", padding: "0 16px 8px" }}>{txErrors[tx.id]}</div>
                    )}
                  </React.Fragment>
                );
                const toolbarStyle = { fontFamily: "var(--font-mono)", fontSize: 12, padding: "5px 6px", border: "1px solid var(--rule)", borderRadius: 3, background: "#fff" };
                return (
                  <React.Fragment>
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center", padding: "10px 16px", borderBottom: "1px solid var(--rule)" }}>
                      <input
                        type="search"
                        style={{ ...toolbarStyle, flex: "1 1 200px", minWidth: 0 }}
                        placeholder="Rechercher : mot-clé, 42, 42,10, >100, 50-100…"
                        title="Mot-clé dans le libellé, ou montant : 42 (42,00 à 42,99), 42,10 (exact), >100, <20, 50-100"
                        value={txQuery}
                        onChange={(e) => setTxQuery(e.target.value)}
                      />
                      <select style={{ ...toolbarStyle, flex: "0 1 190px", minWidth: 0 }} value={txCatFilter} onChange={(e) => setTxCatFilter(e.target.value)}>
                        <option value="">Toutes les catégories</option>
                        <option value="__none__">— Non catégorisé —</option>
                        {categories.map((c) => (<option key={c.id} value={c.id}>{c.name}</option>))}
                      </select>
                      <select style={{ ...toolbarStyle, flex: "0 1 170px", minWidth: 0 }} value={txSort} onChange={(e) => setTxSort(e.target.value)}>
                        <option value="default">Tri : ordre d'ajout</option>
                        <option value="date_desc">Date ↓ (récent)</option>
                        <option value="date_asc">Date ↑ (ancien)</option>
                        <option value="amount_desc">Montant ↓ (plus grand)</option>
                        <option value="amount_asc">Montant ↑ (plus petit)</option>
                        <option value="category">Catégorie (A→Z)</option>
                        <option value="label">Libellé (A→Z)</option>
                      </select>
                      {(filtering || txSort !== "default") && (
                        <button className="btn-link" style={{ marginTop: 0 }} onClick={() => { setTxQuery(""); setTxCatFilter(""); setTxSort("default"); }}>Réinitialiser</button>
                      )}
                    </div>
                    {filtering && (
                      <div className="import-summary" style={{ paddingTop: 8 }}>
                        {all.length} transaction(s) sur {everything.length} · total {fmt(filteredTotal)}
                      </div>
                    )}
                    {filtering && all.length === 0 && (
                      <div className="import-hint" style={{ padding: "0 16px 12px" }}>Aucune transaction ne correspond.</div>
                    )}
                    {/* While searching, filtering or sorting: one flat list in exactly that order. */}
                    {(filtering || txSort !== "default") ? (
                      <div className="import-preview" style={{ maxHeight: 520 }}>{all.map(renderRow)}</div>
                    ) : (<React.Fragment>
                    {uncategorized.length > 0 && (
                      <React.Fragment>
                        <div className="import-summary" style={{ color: "var(--red)", fontWeight: 600 }}>
                          ⚠ Non catégorisé ({uncategorized.length}) — à trier
                        </div>
                        <div className="import-preview" style={{ borderBottom: "2px solid var(--rule)" }}>
                          {uncategorized.map(renderRow)}
                        </div>
                      </React.Fragment>
                    )}
                    {recurring.length > 0 && (
                      <React.Fragment>
                        <div
                          className="import-summary"
                          style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}
                          onClick={() => setShowRecurringSection((v) => !v)}
                        >
                          <span>🔁 Récurrentes ({recurring.length})</span>
                          <span style={{ color: "var(--gold)" }}>{showRecurringSection ? "Masquer ▲" : "Afficher ▼"}</span>
                        </div>
                        {showRecurringSection && (
                          <div className="import-preview" style={{ borderBottom: "2px solid var(--rule)" }}>
                            {recurring.map(renderRow)}
                          </div>
                        )}
                      </React.Fragment>
                    )}
                    {categorized.length > 0 && (
                      <React.Fragment>
                        {(uncategorized.length > 0 || recurring.length > 0) && <div className="import-summary">Catégorisées ({categorized.length})</div>}
                        <div className="import-preview">
                          {categorized.map(renderRow)}
                        </div>
                      </React.Fragment>
                    )}
                    </React.Fragment>)}
                  </React.Fragment>
                );
              })()
            )}
            <button className="add-line" onClick={() => addManualTransaction(selectedMonth)}>+ Ajouter une dépense</button>
          </React.Fragment>
        )}
      </div>

      <div className="panel">
        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }} onClick={() => setShowImportFiles((v) => !v)}>
          <span>Relevés CSV importés ({importFiles.length})</span>
          <span style={{ fontSize: 12, color: "var(--gold)" }}>{showImportFiles ? "Masquer ▲" : "Voir ▼"}</span>
        </div>
        {showImportFiles && (
          importFiles.length === 0 ? (
            <div className="import-hint" style={{ padding: 16 }}>Aucun relevé importé pour l'instant. Chaque fichier importé est conservé ici et peut être re-téléchargé.</div>
          ) : (
            importFiles.map((f) => (
              <div key={f.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 16px", borderBottom: "1px solid var(--rule)", fontSize: 12, flexWrap: "wrap" }}>
                <span style={{ flex: "1 1 200px", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={f.file_name}>{f.file_name}</span>
                <span style={{ color: "var(--ink-soft)" }}>
                  {new Date(f.created_at).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" })}
                  {" · "}{months.find((m) => m.id === f.month_id)?.label || "—"}
                  {" · "}{f.imported_count} importée(s){f.skipped_count > 0 ? `, ${f.skipped_count} déjà présente(s)` : ""}
                </span>
                <button className="reset-btn" onClick={() => downloadImportFile(f)}>⭳ Télécharger</button>
                <button className="icon-btn" title="Supprimer ce fichier de l'archive" onClick={() => deleteImportFile(f)}>✕</button>
              </div>
            ))
          )
        )}
      </div>

      <div className="table-wrap">
        <table>
          <thead><tr><th style={{ width: 24 }}></th><th>Catégorie</th><th className="num">Budget mensuel</th><th className="num">Réel ({curMonthLabel})</th><th className="num">Écart</th><th></th></tr></thead>
          <tbody>
            {expenseCategories.map((c, idx) => {
              const total = categoryTotal(selectedMonth, c.id);
              const diff = (Number(c.budget) || 0) - total;
              const budget = Number(c.budget) || 0;
              const pct = budget > 0 ? Math.min(150, (total / budget) * 100) : (total > 0 ? 150 : 0);
              // Progressive yellow shade from pale (low spend) to deep amber (approaching budget) —
              // green right on target, red once over.
              const yellowShade = (p) => {
                const t = Math.max(0, Math.min(1, p / 100));
                const sat = 35 + t * 45; // 35% -> 80%
                const light = 82 - t * 40; // 82% -> 42%
                return `hsl(44, ${sat}%, ${light}%)`;
              };
              const barColor = pct > 100 ? "var(--red)" : Math.round(pct) === 100 ? "var(--green)" : yellowShade(pct);
              return (
                <tr
                  key={c.id}
                  onDragOver={(e) => { e.preventDefault(); if (dragOverCategoryId !== c.id) setDragOverCategoryId(c.id); }}
                  onDragLeave={() => setDragOverCategoryId((v) => (v === c.id ? null : v))}
                  onDrop={(e) => { e.preventDefault(); reorderCategory(dragCategoryId, c.id); setDragCategoryId(null); setDragOverCategoryId(null); }}
                  style={{
                    background: dragOverCategoryId === c.id && dragCategoryId && dragCategoryId !== c.id ? "var(--paper-alt)" : undefined,
                    outline: dragOverCategoryId === c.id && dragCategoryId && dragCategoryId !== c.id ? "2px dashed var(--gold)" : undefined,
                    opacity: dragCategoryId === c.id ? 0.4 : 1,
                  }}
                >
                  <td style={{ padding: "6px 4px" }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 3 }}>
                      <span
                        draggable
                        onDragStart={() => setDragCategoryId(c.id)}
                        onDragEnd={() => { setDragCategoryId(null); setDragOverCategoryId(null); }}
                        style={{ cursor: "grab", color: "var(--ink-soft)", fontSize: 14, userSelect: "none" }}
                        title="Glisser pour réordonner"
                      >
                        ⠿
                      </span>
                      <div style={{ display: "flex", flexDirection: "column", gap: 0 }}>
                        <button className="icon-btn" style={{ color: "var(--ink-soft)", fontSize: 10, lineHeight: 1, padding: 0, opacity: idx === 0 ? 0.3 : 1 }} disabled={idx === 0} onClick={() => moveCategory(c.id, -1)} title="Monter">▲</button>
                        <button className="icon-btn" style={{ color: "var(--ink-soft)", fontSize: 10, lineHeight: 1, padding: 0, opacity: idx === expenseCategories.length - 1 ? 0.3 : 1 }} disabled={idx === expenseCategories.length - 1} onClick={() => moveCategory(c.id, 1)} title="Descendre">▼</button>
                      </div>
                    </div>
                  </td>
                  <td>
                    <input type="text" value={c.name} onChange={(e) => renameCategory(c.id, e.target.value)} />
                    {curActualTotal > 0 && total !== 0 && (
                      <div style={{ fontSize: 10, color: "var(--ink-soft)", fontFamily: "var(--font-mono)", marginTop: 2 }}>
                        {Math.round((total / curActualTotal) * 100)}% des dépenses du mois
                      </div>
                    )}
                  </td>
                  <td className="num"><input type="number" value={c.budget} onChange={(e) => updateCategoryBudget(c.id, parseFloat(e.target.value) || 0)} /></td>
                  <td className="num">{fmt(total)}</td>
                  <td className={"num " + (diff >= 0 ? "diff-pos" : "diff-neg")}>
                    {fmt(diff)}
                    {budget > 0 && (
                      <React.Fragment>
                        <div className="budget-bar-track" style={{ marginLeft: "auto" }} title={`${Math.round(pct)}% du budget`}>
                          <div className="budget-bar-fill" style={{ width: Math.min(100, pct) + "%", background: barColor }} />
                        </div>
                        <div style={{ fontSize: 10, color: barColor, fontFamily: "var(--font-mono)" }}>{Math.round(pct)}%</div>
                      </React.Fragment>
                    )}
                  </td>
                  <td>
                    <button className="icon-btn" onClick={() => removeCategory(c.id)}>✕</button>
                  </td>
                </tr>
              );
            })}
          </tbody>
          <tfoot>
            {uncategorizedSpent(selectedMonth) > 0 && (
              <tr>
                <td></td>
                <td style={{ color: "var(--red)", fontStyle: "italic" }} title="Dépenses sans catégorie — à trier dans « Transactions ». Elles comptent dans le total réel.">Non catégorisé (à trier)</td>
                <td className="num">—</td>
                <td className="num" style={{ color: "var(--red)" }}>{fmt(uncategorizedSpent(selectedMonth))}</td>
                <td></td>
                <td></td>
              </tr>
            )}
            <tr><td></td><td>Total</td><td className="num">{fmt(monthBudgetTotal)}</td><td className="num">{fmt(curActualTotal)}</td><td className={"num " + (monthBudgetTotal - curActualTotal >= 0 ? "diff-pos" : "diff-neg")}>{fmt(monthBudgetTotal - curActualTotal)}</td><td></td></tr>
          </tfoot>
        </table>
        <button className="add-line" onClick={addCategory}>+ Ajouter une catégorie</button>
      </div>
      <div className="import-hint" style={{ maxWidth: 900, margin: "-16px auto 26px", padding: "0 4px" }}>
        Le montant « Réel » est calculé automatiquement à partir des transactions ci-dessus — modifiez-les dans le panneau « Transactions ».
        {(salaireCat || epargneCat) && " Les catégories Salaire/Épargne ne sont pas listées ici : leurs montants apparaissent dans « Revenus » et « Épargne mise de côté » plus haut."}
      </div>

      <div className="summary">
        <div className="stat"><div className="stat-label">Revenus du mois</div><div className="stat-value">{fmt(curIncomeTotal)}</div></div>
        <div className="stat"><div className="stat-label">Dépenses réelles</div><div className="stat-value">{fmt(curActualTotal)}</div></div>
        <div className="stat"><div className="stat-label">Épargne</div><div className="stat-value">{fmt(curSavings)}</div></div>
        <div className="stat">
          <div className="stat-label">Revenus − Dépenses − Épargne</div>
          <div className="stat-value" style={{ color: curRestant >= 0 ? "#3F6B4A" : "#9B3D3D" }}>{fmt(curRestant)}</div>
        </div>
      </div>

      <div className="charts">
        <div className="chart-box"><p className="chart-title">Budget vs. réel par catégorie</p><BarChartCanvas data={barData} /></div>
        <div className="chart-box"><p className="chart-title">Dépenses par mois (hors épargne)</p><MonthlySpendChart data={spendData} budget={monthBudgetTotal} selectedName={curMonthLabel} /></div>
      </div>
    </div>
  );
}

// ---------- Top-level app: auth -> household -> tracker ----------
function App() {
  const [session, setSession] = useState(null);
  const [loadingSession, setLoadingSession] = useState(true);
  const [household, setHousehold] = useState(null);
  const [checkingHousehold, setCheckingHousehold] = useState(false);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setLoadingSession(false); });
    const { data: listener } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  const lastCheckedUserId = useRef(null);
  useEffect(() => {
    const userId = session?.user?.id || null;
    if (!session) { setHousehold(null); lastCheckedUserId.current = null; return; }
    // Supabase silently refreshes the session token whenever the browser tab
    // regains focus — that fires this effect again with a *new* session object
    // for the *same* user. Without this guard, that was force-reloading the
    // whole app (and wiping any unsaved edits) just from switching tabs.
    if (userId === lastCheckedUserId.current) return;
    lastCheckedUserId.current = userId;
    (async () => {
      setCheckingHousehold(true);
      const { data } = await sb.from("household_members")
        .select("household_id, households(id, name, invite_code)")
        .eq("user_id", session.user.id).limit(1).maybeSingle();
      if (data && data.households) setHousehold(data.households);
      setCheckingHousehold(false);
    })();
  }, [session]);

  const logout = async () => { await sb.auth.signOut(); setHousehold(null); };

  const renameHousehold = async (newName) => {
    const { error } = await sb.from("households").update({ name: newName }).eq("id", household.id);
    if (error) {
      window.alert("Impossible de renommer le foyer : " + error.message);
      return;
    }
    setHousehold((h) => ({ ...h, name: newName }));
  };

  if (loadingSession) return <div style={{ padding: 40 }}>Chargement…</div>;
  if (!session) return <AuthScreen />;
  if (checkingHousehold) return <div style={{ padding: 40 }}>Chargement…</div>;
  if (!household) return <HouseholdSetup session={session} onReady={setHousehold} />;
  return <BudgetTracker household={household} onLogout={logout} onRename={renameHousehold} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  // Manually compile the app source with the CLASSIC JSX runtime.
  // (Babel's default "automatic" runtime injects an ES `import` statement,
  // which fails in a plain, non-module <script> tag.)
  (function () {
    var src = document.getElementById("app-source").textContent;
    var compiled = Babel.transform(src, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    var s = document.createElement("script");
    s.textContent = compiled;
    document.body.appendChild(s);
  })();
</script>
