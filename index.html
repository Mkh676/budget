<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Budget du foyer</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap');
  html, body { margin: 0; padding: 0; }
  body {
    /* Light palette: warm grey ground, white cards, soft sand for summaries,
       steel blue for charts, saffron for main actions, red only for "over budget". */
    --ground: #F3F2EE; --paper: #FFFFFF; --paper-alt: #F7F5F0; --sand: #F5E9D4; --sand-line: #E6D3B0;
    --ink: #1B1E21; --ink-soft: #5E6166; --rule: #E3E1DA; --green: #2E6A48; --red: #A93E2B;
    --gold: #4F7394; --blue: #7FA2C0; --blue-soft: #DCE7F1; --saffron: #E4A72C; --amber: #8A5200; --track: #ECEAE4;
    --font-display: 'Fraunces', Georgia, serif; --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
    --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: var(--ground); color: var(--ink); font-family: var(--font-body);
  }
  * { box-sizing: border-box; }
  .center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card { width: 100%; max-width: 380px; border: 1px solid var(--rule); background: var(--paper-alt); padding: 28px; }
  .auth-title { font-family: var(--font-display); font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  .auth-sub { font-size: 12px; color: var(--ink-soft); margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  .field input { width: 100%; font-family: var(--font-mono); font-size: 14px; padding: 9px 10px; border: 1px solid var(--rule); border-radius: 4px; background: #fff; }
  .btn { font-family: var(--font-mono); font-size: 13px; font-weight: 600; padding: 10px 16px; border: none; border-radius: 4px; background: var(--ink); color: var(--paper); cursor: pointer; width: 100%; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-link { background: none; border: none; color: var(--gold); font-family: var(--font-mono); font-size: 12px; cursor: pointer; padding: 0; margin-top: 12px; text-decoration: underline; }
  .err { color: var(--red); font-size: 12px; margin: 8px 0 0; }
  .msg { color: var(--green); font-size: 12px; margin: 8px 0 0; }
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
  .tab-switch { display: flex; gap: 8px; margin-bottom: 18px; }
  .tab-switch button { flex: 1; font-family: var(--font-mono); font-size: 12px; padding: 8px; border: 1px solid var(--rule); background: var(--paper); cursor: pointer; border-radius: 4px; }
  .tab-switch button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .ledger { min-height: 100vh; padding: 28px 20px 60px; }
  .ledger-head { max-width: 900px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--ink); padding-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .ledger-title { font-family: var(--font-display); font-size: 30px; font-weight: 600; margin: 0; }
  .ledger-sub { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .save-pill { font-size: 11px; color: var(--ink-soft); border: 1px solid var(--rule); border-radius: 20px; padding: 4px 10px; background: var(--paper-alt); }
  .head-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .invite-pill { font-size: 11px; color: var(--ink-soft); }
  .invite-code { font-weight: 700; color: var(--ink); background: var(--paper-alt); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 6px; }
  .reset-btn, .logout-btn { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); background: none; border: 1px solid var(--rule); border-radius: 4px; padding: 4px 10px; cursor: pointer; }

  .tabs { max-width: 900px; margin: 0 auto 24px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tab { font-family: var(--font-mono); font-size: 13px; padding: 8px 14px; background: var(--paper-alt); border: 1px solid var(--rule); border-bottom: none; border-radius: 6px 6px 0 0; cursor: pointer; color: var(--ink-soft); position: relative; top: 1px; }
  .tab.active { background: var(--paper); color: var(--ink); border-color: var(--ink); font-weight: 600; }
  .tab-add { font-family: var(--font-mono); font-size: 18px; line-height: 1; padding: 6px 12px; background: transparent; border: 1px dashed var(--rule); border-radius: 6px; cursor: pointer; color: var(--gold); }
  .tab-remove { margin-left: 6px; color: var(--red); cursor: pointer; font-size: 11px; }
  .tab-edit-input { font-family: var(--font-mono); font-size: 13px; border: none; border-bottom: 1px solid var(--ink); background: transparent; color: var(--ink); width: 90px; padding: 0; }
  .title-edit-input { font-family: var(--font-display); font-size: 30px; font-weight: 600; border: none; border-bottom: 2px solid var(--ink); background: transparent; color: var(--ink); padding: 0; }
  .panel { max-width: 900px; margin: 0 auto 26px; border: 1px solid var(--rule); background: var(--paper); }
  .panel-title { font-family: var(--font-display); font-size: 17px; font-weight: 600; padding: 10px 16px; border-bottom: 1px solid var(--rule); background: var(--paper-alt); }
  .row { display: grid; grid-template-columns: 1fr 140px 32px; gap: 10px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--rule); }
  .row:last-child { border-bottom: none; }
  .row input[type="text"] { font-family: var(--font-mono); font-size: 13px; border: none; background: transparent; color: var(--ink); padding: 4px 0; width: 100%; }
  .row input[type="number"] { font-family: var(--font-mono); font-size: 13px; text-align: right; border: 1px solid var(--rule); background: #fff; padding: 5px 8px; width: 100%; border-radius: 3px; }
  .row input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
  .icon-btn { background: none; border: none; color: var(--red); cursor: pointer; font-size: 15px; }
  .add-line { padding: 8px 16px; font-size: 12px; color: var(--gold); background: none; border: none; cursor: pointer; text-align: left; }
  .totals-row { display: flex; justify-content: space-between; padding: 10px 16px; font-size: 13px; border-top: 2px solid var(--ink); font-weight: 600; }
  .table-wrap { max-width: 900px; margin: 0 auto 26px; border: 1px solid var(--rule); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; }
  thead th { text-align: left; font-weight: 600; padding: 10px 12px; border-bottom: 2px solid var(--ink); background: var(--paper-alt); white-space: nowrap; }
  thead th.num, td.num { text-align: right; }
  tbody td { padding: 6px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  tbody tr:hover { background: var(--paper-alt); }
  td input[type="text"] { font-family: var(--font-mono); font-size: 13px; border: none; background: transparent; color: var(--ink); width: 100%; }
  td input[type="number"] { font-family: var(--font-mono); font-size: 13px; text-align: right; border: 1px solid var(--rule); background: #fff; padding: 5px 8px; width: 100px; border-radius: 3px; }
  .diff-pos { color: var(--green); } .diff-neg { color: var(--red); }
  tfoot td { padding: 10px 12px; font-weight: 600; border-top: 2px solid var(--ink); }
  .import-drop { padding: 16px; border: 1px dashed var(--rule); margin: 12px 16px; text-align: center; }
  .import-drop input { font-family: var(--font-mono); font-size: 12px; }
  .import-hint { font-size: 11px; color: var(--ink-soft); margin-top: 8px; }
  .import-preview { max-height: 320px; overflow-y: auto; }
  .import-row { display: grid; grid-template-columns: 90px 1fr 90px 190px; gap: 10px; align-items: center; padding: 6px 16px; border-bottom: 1px solid var(--rule); font-size: 12px; }
  .import-row select { font-family: var(--font-mono); font-size: 12px; padding: 4px; border: 1px solid var(--rule); border-radius: 3px; background: #fff; }
  /* Transaction rows: columns shrink instead of overflowing; the category menu takes the remaining space. */
  .tx-row { grid-template-columns: 92px minmax(0, 1fr) 84px minmax(170px, 270px); grid-template-areas: "date label amount actions"; }
  .tx-row > * { min-width: 0; }
  .tx-date { grid-area: date; } .tx-label { grid-area: label; } .tx-amount { grid-area: amount; } .tx-actions { grid-area: actions; }
  .tx-row input { width: 100%; box-sizing: border-box; }
  .tx-actions { display: flex; gap: 6px; align-items: center; }
  .tx-actions select { flex: 1 1 auto; min-width: 0; width: 100%; }
  .tx-actions .icon-btn { flex: 0 0 auto; }
  /* Phones: date + amount on the first line, label on the second, category + buttons on the third. */
  @media (max-width: 640px) {
    .tx-row { grid-template-columns: minmax(0, 1fr) 96px; grid-template-areas: "date amount" "label label" "actions actions"; gap: 6px; padding: 8px 12px; }
    .tx-row input, .tx-actions select { font-size: 14px !important; padding: 6px !important; }
  }
  .import-actions { display: flex; gap: 8px; padding: 12px 16px; }
  .import-actions button { font-family: var(--font-mono); font-size: 12px; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
  .import-confirm { background: var(--ink); color: var(--paper); border: none; }
  .import-cancel { background: none; border: 1px solid var(--rule); color: var(--ink-soft); }
  .import-summary { font-size: 12px; color: var(--ink-soft); padding: 0 16px 12px; }
  .budget-bar-track { height: 4px; background: var(--rule); border-radius: 2px; margin-top: 5px; overflow: hidden; max-width: 220px; }
  .budget-bar-fill { height: 100%; border-radius: 2px; transition: width 0.2s ease; }
  .summary { max-width: 900px; margin: 0 auto 26px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat { border: 1px solid var(--rule); padding: 14px; background: var(--paper-alt); }
  .stat-label { font-size: 11px; color: var(--ink-soft); margin-bottom: 6px; }
  .stat-value { font-family: var(--font-display); font-size: 22px; font-weight: 600; }
  /* Sections: home screen, section switcher, month picker */
  .section-nav { max-width: 900px; margin: 0 auto 20px; display: flex; gap: 6px; flex-wrap: wrap; }
  .section-nav button { font-family: var(--font-mono); font-size: 13px; padding: 8px 14px; border: 1px solid var(--rule); background: var(--paper-alt); color: var(--ink-soft); border-radius: 20px; cursor: pointer; }
  .section-nav button.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .home-grid { max-width: 900px; margin: 12px auto 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
  .home-card { text-align: left; display: flex; flex-direction: column; gap: 10px; padding: 26px 24px; border: 1px solid var(--rule); background: var(--paper-alt); cursor: pointer; font-family: var(--font-mono); color: var(--ink); border-radius: 6px; }
  .home-card:hover, .home-card:focus-visible { border-color: var(--ink); }
  .home-title { font-family: var(--font-display); font-size: 24px; font-weight: 600; line-height: 1.2; }
  .home-sub { font-size: 12px; color: var(--ink-soft); line-height: 1.6; }
  .home-go { font-size: 12px; color: var(--green); font-weight: 600; margin-top: auto; }
  .month-bar { max-width: 900px; margin: 0 auto 24px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .month-bar select { font-family: var(--font-display); font-size: 20px; font-weight: 600; padding: 6px 10px; border: 1px solid var(--ink); border-radius: 4px; background: var(--paper); color: var(--ink); min-width: 0; max-width: 100%; }
  .month-nav { font-family: var(--font-mono); font-size: 18px; width: 38px; height: 38px; border: 1px solid var(--rule); background: var(--paper-alt); border-radius: 4px; cursor: pointer; color: var(--ink); }
  .month-nav:disabled { opacity: 0.35; cursor: default; }
  .month-action { font-family: var(--font-mono); font-size: 12px; padding: 8px 12px; border: 1px solid var(--rule); background: var(--paper-alt); border-radius: 4px; cursor: pointer; color: var(--ink-soft); white-space: nowrap; }
  .month-action.danger { color: var(--red); }
  .month-action:disabled { opacity: 0.35; cursor: default; }
  .sav-balance-input { width: 120px; text-align: right; font-family: var(--font-mono); font-size: 12px; padding: 4px; border: 1px solid var(--rule); border-radius: 3px; }
  .charts { max-width: 900px; margin: 0 auto; display: grid; gap: 24px; }
  .chart-box { border: 1px solid var(--rule); background: var(--paper-alt); padding: 14px; }
  .chart-title { font-family: var(--font-display); font-size: 15px; margin: 0 0 10px; }

  /* ===== New look (overrides the rules above) ===== */
  .ledger { padding: 0 16px 90px; }
  .panel, .table-wrap, .charts, .month-bar, .home-grid, .hero, .page-w { max-width: 1080px; }
  button, input, select { font-family: var(--font-body); }
  .panel { border: none; border-radius: 18px; background: var(--paper); box-shadow: 0 1px 2px rgba(27,30,33,0.05); overflow: hidden; margin-bottom: 22px; }
  .panel-title { font-size: 21px; background: transparent; border-bottom: 1px solid var(--rule); padding: 16px 22px; }
  .row { padding: 10px 22px; border-bottom-color: var(--rule); }
  .row input[type="text"], td input[type="text"] { font-family: var(--font-body); font-size: 14px; }
  .row input[type="number"], td input[type="number"] { border-radius: 8px; border-color: var(--rule); }
  .row input:focus, input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .totals-row { border-top: 1px solid var(--ink); padding: 12px 22px; font-size: 14px; }
  .add-line { color: var(--gold); font-weight: 600; font-size: 13px; padding: 10px 22px; }
  .btn-link { color: var(--gold); font-family: var(--font-body); }
  .import-hint { font-family: var(--font-body); }
  .import-summary { font-family: var(--font-body); font-size: 13px; }
  .import-row { font-size: 13px; padding: 8px 22px; border-bottom-color: var(--rule); }
  .import-row select, .tx-actions select { border-radius: 8px; border-color: var(--rule); font-family: var(--font-body); }
  .table-wrap { border: none; border-radius: 14px; background: var(--paper); margin: 0 0 12px; }
  table { font-family: var(--font-body); font-size: 14px; }
  td.num, th.num { font-family: var(--font-mono); }
  thead th { background: transparent; border-bottom: 1px solid var(--rule); font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-soft); }
  tbody td { border-bottom-color: var(--rule); }
  tbody tr:hover { background: var(--paper-alt); }
  tfoot td { border-top: 1px solid var(--ink); }
  .chart-box { border: none; border-radius: 18px; background: var(--paper); padding: 20px 24px; box-shadow: 0 1px 2px rgba(27,30,33,0.05); }
  .chart-title { font-size: 21px; font-weight: 600; margin-bottom: 14px; }

  /* Top bar */
  .appbar { position: sticky; top: 0; z-index: 20; margin: 0 -16px 28px; background: rgba(255,255,255,0.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
  .appbar-inner { max-width: 1080px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .brand { font-family: var(--font-display); font-size: 24px; font-weight: 800; letter-spacing: -0.01em; margin: 0; cursor: pointer; background: none; border: none; color: var(--ink); padding: 0; }
  .brand-sub { font-size: 12px; color: var(--ink-soft); }
  .section-nav { max-width: none; margin: 0; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--ground); flex-wrap: nowrap; }
  .section-nav button { font-family: var(--font-body); font-size: 14px; font-weight: 600; padding: 9px 18px; border: none; border-radius: 999px; background: transparent; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
  .section-nav button.active { background: var(--sand); color: var(--ink); }
  .section-nav svg { display: none; }
  .appbar-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); }
  .save-pill { font-size: 12px; border: none; background: none; padding: 0; color: var(--ink-soft); }
  .reset-btn, .logout-btn { font-family: var(--font-body); font-size: 12px; font-weight: 600; border-radius: 8px; padding: 6px 12px; border-color: var(--rule); background: var(--paper); }
  .invite-code { background: var(--ground); border: none; border-radius: 6px; padding: 2px 6px; font-family: var(--font-mono); }
  .title-edit-input { font-size: 22px; }

  /* Buttons */
  .month-action { font-family: var(--font-body); font-size: 13px; font-weight: 600; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
  .month-action.primary { background: var(--saffron); border-color: var(--saffron); color: var(--ink); font-weight: 700; }
  .month-action.danger { color: var(--red); }
  .month-nav { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--rule); background: var(--paper); font-size: 20px; }
  .month-bar { margin: 0 auto 22px; gap: 10px; }
  .month-bar select { font-family: var(--font-display); font-size: 32px; font-weight: 600; border: none; background: transparent; padding: 0 4px; cursor: pointer; }

  /* Summary band (Dépenses) */
  .hero { margin: 0 auto 22px; background: var(--sand); border-radius: 22px; padding: 28px 32px; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1.2fr); gap: 28px; align-items: end; }
  .hero-kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
  .hero-big { font-family: var(--font-display); font-size: 84px; font-weight: 800; line-height: 0.9; letter-spacing: -0.03em; color: var(--amber); }
  .hero-big.neg { color: var(--red); }
  .hero-label { font-size: 12px; color: var(--ink-soft); }
  .hero-num { font-family: var(--font-mono); font-size: 22px; font-weight: 600; }
  .bar-track { height: 10px; border-radius: 99px; background: var(--track); overflow: hidden; }
  .hero .bar-track { background: rgba(27,30,33,0.10); }
  .bar-fill { height: 100%; border-radius: 99px; background: var(--green); }
  .bar-fill.over { background: var(--red); } .bar-fill.reached { background: var(--gold); } .bar-fill.none { background: #C9CCCF; }

  /* Categories as bars */
  .cat-list { padding: 4px 22px 10px; }
  .cat-item { display: flex; flex-direction: column; gap: 7px; padding: 13px 0; border-bottom: 1px solid var(--rule); }
  .cat-item:last-child { border-bottom: none; }
  .cat-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 15px; }
  .cat-name { font-weight: 600; }
  .cat-amt { font-family: var(--font-mono); font-size: 14px; white-space: nowrap; }
  .cat-state { font-size: 12px; font-weight: 500; color: var(--green); }
  .cat-state.over { color: var(--red); font-weight: 700; } .cat-state.reached { color: var(--gold); font-weight: 700; } .cat-state.none { color: var(--ink-soft); }

  /* Home */
  .home-hello { max-width: 1080px; margin: 8px auto 26px; display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
  .home-hello h1 { margin: 0; font-family: var(--font-display); font-size: 52px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; }
  .home-hello h1 em { font-weight: 500; color: var(--gold); }
  .home-grid { margin: 0 auto; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 22px; }
  .home-card { border: none; border-radius: 22px; padding: 30px; gap: 16px; min-height: 340px; font-family: var(--font-body); background: var(--paper); box-shadow: 0 1px 2px rgba(27,30,33,0.05); }
  .home-card.sand { background: var(--sand); }
  .home-card:hover, .home-card:focus-visible { box-shadow: 0 0 0 2px var(--ink); }
  .home-kicker { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
  .home-kicker span:last-child { letter-spacing: 0; text-transform: none; font-size: 14px; color: var(--gold); }
  .home-big { font-family: var(--font-display); font-size: 76px; font-weight: 800; line-height: 0.95; letter-spacing: -0.03em; }
  .home-line { font-size: 15px; color: var(--ink-soft); }
  .home-stats { margin-top: auto; display: flex; gap: 28px; padding-top: 16px; border-top: 1px solid rgba(27,30,33,0.10); }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 99px; background: var(--ground); font-size: 13px; font-weight: 600; }
  .chip.dashed { background: transparent; border: 1px dashed var(--rule); color: var(--ink-soft); font-weight: 500; }

  /* Savings */
  .acc-pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .acc-pill { padding: 11px 18px; border-radius: 999px; border: 1px solid var(--rule); background: var(--paper); font-size: 14px; font-weight: 600; cursor: pointer; color: var(--ink); }
  .acc-pill.active { background: var(--sand); border-color: var(--sand-line); }

// Read before the client consumes the URL: did we arrive from a "reset password" e-mail link?
const ARRIVED_FROM_RECOVERY_LINK = /type=recovery/.test(window.location.hash + window.location.search);
// An expired or already-used e-mail link comes back with an error in the URL.

const fmt = (n) => (Math.round((n || 0) * 100) / 100).toLocaleString("fr-FR", { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + " €";
// Amounts in the transaction list: whole euros stay whole, otherwise always two decimals (2,20 €).
const fmtCents = (n) => { const r = Math.round((n || 0) * 100) / 100; return r.toLocaleString("fr-FR", { minimumFractionDigits: Number.isInteger(r) ? 0 : 2, maximumFractionDigits: 2 }) + " €"; };
function uid(prefix) { return prefix + "_" + Math.random().toString(36).slice(2, 9); }

// ---------- Bank label normalization (used for auto-categorization) ----------
// Lowercase, strip accents, turn punctuation into spaces: "Vétérinaire BKG*Hôtel" -> "veterinaire bkg hotel".
function normText(s) {
  return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[^a-z0-9]+/g, " ").trim();
}
// Whole-word / whole-phrase match on normalized text, so "free" doesn't hit "freelance".
function hasWord(normalized, word) {
  const w = normText(word);
  return w !== "" && (" " + normalized + " ").includes(" " + w + " ");
}
// Operation-type prefixes banks prepend to the merchant name.
const LABEL_PREFIXES = /^(paiement par carte|paiement cb|carte|cb|prlv sepa|prlv|prelevement|vir sepa inst|vir sepa|vir inst|vir|virement|retrait dab|retrait|avoir|achat)\b\s*/;
// Kind of bank operation, from the label's prefix.
function operationType(label) {
  const s = normText(label);
  if (/^(prlv|prelevement)\b/.test(s)) return "debit";      // direct debit: usually a subscription/utility
  if (/^retrait\b/.test(s)) return "withdrawal";            // cash machine
  if (/^(vir|virement)\b/.test(s)) return "transfer";
  if (/^(carte|cb|paiement)\b/.test(s)) return "card";
  return "";
}
// Day of month from a bank date ("2026-09-12" or "12/09/2026"), or null.
function dayOfMonthFromDate(date) {
  const d = (date || "").trim();
  let m = d.match(/^\d{4}-\d{2}-(\d{2})/);
  if (!m) m = d.match(/^(\d{1,2})[\/.-]\d{1,2}/);
  const day = m ? parseInt(m[1], 10) : NaN;
  return day >= 1 && day <= 31 ? day : null;
}
// Bank date ("2026-09-12", "12/09/2026" or "12/09/26") -> days since epoch, or null.
function dateToDayNumber(date) {
  const d = (date || "").trim();
  let y, mo, da, m;
  if ((m = d.match(/^(\d{4})-(\d{2})-(\d{2})/))) [y, mo, da] = [+m[1], +m[2], +m[3]];
  else if ((m = d.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))) [da, mo, y] = [+m[1], +m[2], m[3].length === 2 ? 2000 + +m[3] : +m[3]];
  else return null;
  const t = Date.UTC(y, mo - 1, da);
  return isNaN(t) ? null : Math.round(t / 86400000);
}
// Short, readable version of a bank label for the transaction list
// ("CARTE 28/08/26 DALHAMO 2 CB*6132" -> "Dalhamo 2"). The full label stays in the edit form.
function prettyTxLabel(label) {
  const raw = (label || "").trim();
  let s = raw, prefix = "";
  if (/^(PRLV|PRELEVEMENT)\b/i.test(s)) { prefix = "Prélèvement · "; s = s.replace(/^(PRLV|PRELEVEMENT)( SEPA)?\s+/i, ""); }
  else if (/^VIR(EMENT)?\b/i.test(s)) { prefix = "Virement · "; s = s.replace(/^VIR(EMENT)?( SEPA)?( INST)?( RECU| EMIS)?\s+/i, ""); }
  else s = s.replace(/^(CARTE|CB)\s+(X?\d{4}\s+)?(\d{2}\/\d{2}(\/\d{2,4})?\s+)?/i, "");
  s = s.replace(/\s+CB\*\d+.*$/i, "").replace(/\s+\d{2}\/\d{2}(\/\d{2,4})?$/, "").trim();
  if (!s) return raw;
  if (prefix) s = s.replace(/^(virement|prélèvement|prelevement)\s+/i, "") || s;
  if (s === s.toUpperCase()) s = s.toLowerCase().replace(/(^|[\s'’(-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
  return prefix + s.charAt(0).toUpperCase() + s.slice(1);
}
// "Lundi 31 août" for a day number from dateToDayNumber.
function dayTitle(d) {
  const t = new Date(d * 86400000).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
// Soft background/text colours for a category chip, stable per category.
const CHIP_COLORS = [
  ["#F6E3C1", "#6E4A0A"], ["#DDE7F2", "#24476B"], ["#E7E0F1", "#4B3A72"], ["#DCEBDF", "#2E5A3C"],
  ["#F2DDD7", "#7A2E1F"], ["#E2E6E8", "#35424A"], ["#EFE6D2", "#5C4A1E"], ["#DCEEEE", "#1F5656"],
];
function chipColors(id) {
  let h = 0;
  for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const [background, color] = CHIP_COLORS[h % CHIP_COLORS.length];
  return { background, color };
}
// Amount search in the transaction list. Returns a test on the absolute
// amount, or null when the query isn't an amount:
//   "42"      -> 42.00 to 42.99       "42,10" -> exactly 42.10
//   ">100" / "<20" / ">=50"          "50-100" -> between 50 and 100
function parseAmountQuery(q) {
  const s = (q || "").replace(/\s|€/g, "").replace(/,/g, ".");
  const num = "(\\d+(?:\\.\\d{1,2})?)";
  let m;
  if ((m = s.match(new RegExp("^(>=|<=|>|<)" + num + "$")))) {
    const n = parseFloat(m[2]);
    return { ">": (a) => a > n, "<": (a) => a < n, ">=": (a) => a >= n, "<=": (a) => a <= n }[m[1]];
  }
  if ((m = s.match(new RegExp("^" + num + "-" + num + "$")))) {
    const lo = Math.min(parseFloat(m[1]), parseFloat(m[2])), hi = Math.max(parseFloat(m[1]), parseFloat(m[2]));
    return (a) => a >= lo - 0.005 && a <= hi + 0.005;
  }
  if ((m = s.match(new RegExp("^" + num + "$")))) {
    const n = parseFloat(m[1]);
    return m[1].includes(".") ? (a) => Math.abs(a - n) < 0.005 : (a) => Math.floor(a + 0.005) === n;
  }
  return null;
}

// ---------- Savings statement PDF (LCL format) ----------
// Input: the PDF's text, page by page, as [{ x, y, s }] items (from pdf.js).
// Rebuilds each operation (date, label, signed amount) from the "ECRITURES DE
// LA PERIODE" table: an amount under the DEBIT column is money out, under
// CREDIT money in. Starts from "ANCIEN SOLDE" and computes the balance after
// every operation, then checks it against the bank's own "SOLDE ..." lines.
// Returns null when the file doesn't look like such a statement.
function parseLclStatement(pages) {
  const all = pages.flat().map((i) => i.s).join(" ");
  const period = all.match(/du (\d{2})\.(\d{2})\.(\d{4}) au (\d{2})\.(\d{2})\.(\d{4})/);
  if (!period) return null;
  const startMonth = +period[2], startYear = +period[3], endYear = +period[6];
  const numMatch = all.match(/Compte\s*:\s*(\d+\s*[A-Z]?)/) || all.match(/N° de compte\s+\S+\s+(\d+\s*[A-Z]?)/);
  const accountNumber = numMatch ? numMatch[1].replace(/\s+/g, " ").trim() : "";
  const toAmount = (str) => parseFloat(str.replace(/[\s  ]/g, "").replace(",", "."));
  const isAmount = (str) => /^\d{1,3}(?:[\s  ]\d{3})*,\d{2}$/.test(str.trim());
  const yearFor = (mm) => (startYear === endYear || mm >= startMonth ? startYear : endYear);
  let title = "", creditX = null, valeurX = null, opening = null;
  const checks = []; // bank balances found in the statement: { date?, amount, label }
  const ops = [];
  let last = null;
  let dateX = null;
  pages.forEach((items, pageIdx) => {
    last = null; // notes never continue across a page break
    const byY = {};
    for (const it of items) { if (!it.s.trim()) continue; const y = Math.round(it.y); (byY[y] = byY[y] || []).push(it); }
    const lines = Object.keys(byY).map(Number).sort((a, b) => b - a).map((y) => byY[y].sort((a, b) => a.x - b.x));
    if (pageIdx === 0 && lines.length) title = lines[0].map((i) => i.s).join(" ").trim();
    for (const line of lines) {
      const text = line.map((i) => i.s).join(" ");
      const credit = line.find((i) => /^CREDIT$/i.test(i.s.trim()));
      if (credit && line.some((i) => /^DEBIT$/i.test(i.s.trim()))) {
        creditX = credit.x;
        const v = line.find((i) => /^VALEUR$/i.test(i.s.trim())); if (v) valeurX = v.x;
        continue;
      }
      if (creditX === null) continue; // before the operations table
      const amountItem = [...line].reverse().find((i) => isAmount(i.s));
      const signed = amountItem ? (amountItem.x >= creditX - 12 ? 1 : -1) * toAmount(amountItem.s) : null;
      const dateItem = line[0] && /^\d{2}\.\d{2}$/.test(line[0].s.trim()) ? line[0] : null;
      if (/ANCIEN SOLDE/i.test(text) && signed !== null) { opening = signed; last = null; continue; }
      if (/SOLDE/i.test(text) && signed !== null) { checks.push({ label: text.replace(amountItem.s, "").trim(), amount: signed, afterOps: ops.length }); last = null; continue; }
      if (/TOTAUX/i.test(text)) { last = null; continue; }
      if (dateItem && amountItem) {
        const [dd, mm] = dateItem.s.trim().split(".").map(Number);
        const date = `${yearFor(mm)}-${String(mm).padStart(2, "0")}-${String(dd).padStart(2, "0")}`;
        const label = line.filter((i) => i !== dateItem && i !== amountItem && (valeurX === null || i.x < valeurX - 5)).map((i) => i.s).join(" ").replace(/\s+/g, " ").trim();
        last = { date, label, amount: signed };
        dateX = dateItem.x;
        ops.push(last);
      } else if (last && !amountItem && !dateItem && valeurX !== null && dateX !== null &&
                 line[0].x > dateX + 20 && line.every((i) => i.x < valeurX)) {
        // Continuation line under an operation: keep a real note, skip bank references.
        const note = text.replace(/^LIBELLE\s*:\s*/i, "").trim();
        if (note && !/^REF\.?CLIENT/i.test(note)) last.label += " — " + note;
      }
    }
  });
  if (opening === null || ops.length === 0) return null;
  let balance = opening;
  const entries = ops.map((o) => { balance = Math.round((balance + o.amount) * 100) / 100; return { ...o, balance }; });
  const closing = checks.length ? checks[checks.length - 1].amount : null;
  const mismatches = checks.filter((c) => {
    const at = c.afterOps > 0 ? entries[c.afterOps - 1].balance : opening;
    return Math.abs(at - c.amount) > 0.005;
  });
  const periodEnd = `${period[6]}-${period[5]}-${period[4]}`;
  return { title, accountNumber, opening, entries, closing, periodEnd, verified: checks.length > 0 && mismatches.length === 0, mismatches };
}

// Where an imported row's category came from (shown as a tooltip on its category).
const CATEGORY_SOURCE_LABELS = {
  manual: "Choisie par vous",
  rule: "Retenue d'après votre choix précédent pour ce marchand",
  fee: "D'après une charge récurrente correspondante",
  history: "D'après vos mois précédents pour ce marchand",
  bank: "D'après la catégorie de la banque",
  withdrawal: "Retrait d'espèces",
  keyword: "Devinée d'après le libellé — à vérifier",
};
const LABEL_NOISE_WORDS = new Set([
  "cb", "ref", "fact", "facture", "echeance", "le", "la", "les", "du", "de", "des", "at", "sa", "sas", "sarl",
  "janvier", "fevrier", "mars", "avril", "mai", "juin", "juillet", "aout", "septembre", "octobre", "novembre", "decembre",
]);
// Stable "merchant" key for a bank label: drops the operation prefix, dates,
// card numbers and references, keeps the first 3 meaningful words.
// "CARTE 12/09/26 CARREFOUR MARKET CB*1234" -> "carrefour market"
function merchantKey(label) {
  let s = (label || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  s = s.replace(/\b\d{1,2}[\/.-]\d{1,2}([\/.-]\d{2,4})?\b/g, " "); // dates
  s = normText(s);
  if (/^retrait\b/.test(s)) return "retrait dab"; // cash withdrawals: one key, not the ATM's city
  let prev;
  do { prev = s; s = s.replace(LABEL_PREFIXES, ""); } while (s !== prev);
  // Drop numbers/refs like "x1234", and noise words (incl. month names, so
  // "SALAIRE SEPTEMBRE" and "SALAIRE OCTOBRE" share the same key).
  const words = s.split(" ").filter((w) => w.length > 1 && !/\d/.test(w) && !LABEL_NOISE_WORDS.has(w));
  return words.slice(0, 3).join(" ");
}

const MONTH_NAMES_FR = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
// Best-effort "year-month" key parsed out of a free-text label like "Novembre 2026",
// used as a fallback for months that were never tagged with a real `date`.
function monthLabelToKey(label) {
  const l = (label || "").toLowerCase();
  const year = l.match(/\b(20\d{2})\b/);
  if (!year) return null;
  const monthIdx = MONTH_NAMES_FR.findIndex((name) => l.includes(name));
  if (monthIdx === -1) return null;
  return year[1] + "-" + String(monthIdx + 1).padStart(2, "0");
}
function monthSortKey(m) { return (m.date && m.date.slice(0, 7)) || monthLabelToKey(m.label); }
// Months with a resolvable date/label sort chronologically; months we can't date
// (e.g. an old freeform tab) are kept first, in their original relative order,
// since they predate the introduction of month-tagging.
// The month tab for today (local time). If it doesn't exist yet, the latest month before today.
function currentMonthId(list) {
  const now = new Date();
  const nowKey = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
  const dated = sortMonthsChronologically(list).filter((m) => monthSortKey(m));
  const exact = dated.find((m) => monthSortKey(m) === nowKey);
  const past = dated.filter((m) => monthSortKey(m) <= nowKey);
  return (exact || past[past.length - 1] || dated[0] || list[0] || {}).id || null;
}
function sortMonthsChronologically(list) {
  return list
    .map((m, i) => ({ m, i, key: monthSortKey(m) }))
    .sort((a, b) => {
      if (a.key && b.key) return a.key === b.key ? a.i - b.i : a.key < b.key ? -1 : 1;
      if (a.key || b.key) return a.key ? 1 : -1;
      return a.i - b.i;
    })
    .map((x) => x.m);
}

// ---------- Main budget tracker (shared, per household) ----------
function BudgetTracker({ household, onLogout, onRename }) {
  const [loaded, setLoaded] = useState(false);
  const [categories, setCategories] = useState([]);
  const [months, setMonths] = useState([]);
  const [income, setIncome] = useState({});
  const [savings, setSavings] = useState({});
  const [actuals, setActuals] = useState({});
  const [transactions, setTransactions] = useState({}); // { [monthId]: [{id, date, label, amount, categoryId}] }
  const [recurringFees, setRecurringFees] = useState([]); // [{id, label, amount, dayOfMonth, categoryId}] — household-wide, not per-month
  const [categoryRules, setCategoryRules] = useState({}); // { [merchantKey]: categoryId } — learned from manual categorization
  // Savings accounts imported from their own bank CSV, kept apart from the budget:
  // { [accountKey]: { label, entries: [{ id, date, label, amount (+ = money in), balance|null, importSig }] } }
  const [savingsAccounts, setSavingsAccounts] = useState({});
  const [selectedMonth, setSelectedMonth] = useState(null);
  const [saveState, setSaveState] = useState("idle");
  const [showTransactions, setShowTransactions] = useState(true);
  const [showRecurringFees, setShowRecurringFees] = useState(true);
  // Transaction list: search (keyword or amount), category filter, sort.
  const [txQuery, setTxQuery] = useState("");
  const [txCatFilter, setTxCatFilter] = useState(""); // "" = all, "__none__" = uncategorized, else a category id
  const [txSort, setTxSort] = useState("default");
  const [openTx, setOpenTx] = useState(null); // transaction whose edit form is open
  const [txShowAll, setTxShowAll] = useState(false);
  const [openAutoDetails, setOpenAutoDetails] = useState({});
  const [view, setView] = useState("home"); // "home" | "depenses" | "epargne"
  const [editBudgets, setEditBudgets] = useState(false); // categories: bars (false) or the editable table (true)
  const [selectedAccount, setSelectedAccount] = useState(null); // savings account shown on the Épargne page // { salaire: bool, epargne: bool } — detail list under the "(auto)" lines
  const [dragCategoryId, setDragCategoryId] = useState(null);
  const [dragOverCategoryId, setDragOverCategoryId] = useState(null);
  const saveTimer = useRef(null);
  const csvInputRef = useRef(null);

  useEffect(() => {
    (async () => {
      const { data, error } = await sb.from("household_budget").select("data").eq("household_id", household.id).maybeSingle();
      const doc = (data && data.data) || emptyBudgetDoc();
      // Drop data left behind by month tabs that no longer exist (tabs deleted
      // before deletion also removed their data), so it can't resurface or
      // interfere with imports. It's removed from storage on the next save.
      const liveMonths = new Set((doc.months || []).map((m) => m.id));
      const onlyLive = (obj) => Object.fromEntries(Object.entries(obj || {}).filter(([k]) => liveMonths.has(k)));
      doc.income = onlyLive(doc.income); doc.savings = onlyLive(doc.savings);
      const txs = onlyLive(doc.transactions);
      let acts = onlyLive(doc.actuals);

      // One-time migration: turn any legacy "manual total" numbers into a
      // real transaction line item, so everything lives in one unified list.
      if (!doc.migratedActuals) {
        const newTxs = { ...txs };
        const clearedActs = {};
        for (const m of Object.keys(acts)) {
          clearedActs[m] = {};
          for (const catId of Object.keys(acts[m] || {})) {
            const val = Number(acts[m][catId]) || 0;
            if (val !== 0) {
              newTxs[m] = [
                ...(newTxs[m] || []),
                { id: uid("legacy"), date: "", label: "Saisie manuelle (avant mise à jour)", amount: val, categoryId: catId },
              ];
            }
          }
        }
        acts = clearedActs;
        setTransactions(newTxs);
        setActuals(clearedActs);
      } else {
        setTransactions(txs);
        setActuals(acts);
      }

      setCategories(doc.categories); setMonths(sortMonthsChronologically(doc.months)); setIncome(doc.income);
      setSavings(doc.savings); setRecurringFees(doc.recurringFees || []); setCategoryRules(doc.categoryRules || {}); setSavingsAccounts(doc.savingsAccounts || {});
      setSelectedMonth(currentMonthId(doc.months));
      setLoaded(true);
    })();
  }, [household.id]);

  // Accueil and Dépenses always open on the current month.
  const goTo = (v) => { setView(v); const id = currentMonthId(months); if (id) setSelectedMonth(id); };

  // Auto-detect/create a tab for the real current calendar month. Runs once
  // per app load, after the initial data has loaded.
  const autoMonthChecked = useRef(false);
  useEffect(() => {
    if (!loaded || autoMonthChecked.current) return;
    autoMonthChecked.current = true;

    const now = new Date();
    const currentKey = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
    const currentLabel = MONTH_NAMES_FR[now.getMonth()] + " " + now.getFullYear();

    // Already tagged with a real date matching this month? Nothing to do.
    if (months.some((m) => m.date && m.date.slice(0, 7) === currentKey)) return;

    // Not tagged, but a tab's NAME already looks like this month (e.g. the
    // user manually created/renamed one, with or without a year in the
    // label) — attach the date so future checks are reliable, without
    // creating a duplicate. Skip tabs that already have a *different* date.
    const monthNameLower = MONTH_NAMES_FR[now.getMonth()];
    const yearStr = String(now.getFullYear());
    const byLabel = months.find((m) => {
      if (m.date) return false;
      const l = m.label.toLowerCase();
      return l.includes(monthNameLower);
    }) || months.find((m) => !m.date && m.label.toLowerCase().includes(yearStr));
    if (byLabel) {
      setMonths((ms) => sortMonthsChronologically(ms.map((m) => (m.id === byLabel.id ? { ...m, date: currentKey + "-01" } : m))));
      return;
    }

    // Genuinely missing — create it and switch to it.
    const id = uid("month");
    const prevMonth = sortMonthsChronologically(months)[months.length - 1];
    const recurring = prevMonth
      ? (transactions[prevMonth.id] || []).filter((t) => t.recurring).map((t) => ({ ...t, id: uid("tx"), date: "" }))
      : [];
    setMonths((ms) => sortMonthsChronologically([...ms, { id, label: currentLabel, date: currentKey + "-01" }]));
    setIncome((inc) => ({ ...inc, [id]: [{ id: uid("inc"), label: "Revenu", amount: 0 }] }));
    setSavings((s) => ({ ...s, [id]: 0 }));
    setActuals((a) => ({ ...a, [id]: {} }));
    setTransactions((t) => ({ ...t, [id]: recurring }));
    setSelectedMonth(id);
  }, [loaded]);

  useEffect(() => {
    if (!loaded) return;
    setSaveState("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      const { error } = await sb.from("household_budget")
        .update({ data: { categories, months, income, savings, actuals, transactions, recurringFees, categoryRules, savingsAccounts, migratedActuals: true }, updated_at: new Date().toISOString() })
        .eq("household_id", household.id);
      setSaveState(error ? "error" : "saved");
    }, 500);
    return () => clearTimeout(saveTimer.current);
  }, [categories, months, income, savings, actuals, transactions, recurringFees, categoryRules, savingsAccounts, loaded]);

  // ---------- Undo ----------
  // Every change to the budget data pushes the previous state onto a stack.
  // Changes less than 1 s apart (typing "125" in an amount) count as ONE step.
  // Changes made automatically right after loading (e.g. creating this month's
  // tab) are not undoable. History lives in memory only (lost on reload).
  const undoStack = useRef([]);
  const lastSnapshot = useRef(null);
  const lastChangeAt = useRef(0);
  const restoringUndo = useRef(false);
  const undoReadyAt = useRef(0);
  const [undoCount, setUndoCount] = useState(0);
  useEffect(() => {
    if (!loaded) return;
    const snap = { categories, months, income, savings, actuals, transactions, recurringFees, categoryRules, savingsAccounts };
    const now = Date.now();
    if (!lastSnapshot.current) undoReadyAt.current = now + 1500;
    if (restoringUndo.current) {
      restoringUndo.current = false;
      lastSnapshot.current = snap;
      lastChangeAt.current = 0; // the next edit after an undo always starts a new step
      return;
    }
    if (lastSnapshot.current && now >= undoReadyAt.current && now - lastChangeAt.current > 1000) {
      undoStack.current = [...undoStack.current.slice(-49), lastSnapshot.current];
      setUndoCount(undoStack.current.length);
    }
    if (lastSnapshot.current) lastChangeAt.current = now;
    lastSnapshot.current = snap;
  }, [categories, months, income, savings, actuals, transactions, recurringFees, categoryRules, savingsAccounts, loaded]);

  const undo = () => {
    const prev = undoStack.current[undoStack.current.length - 1];
    if (!prev) return;
    undoStack.current = undoStack.current.slice(0, -1);
    setUndoCount(undoStack.current.length);
    restoringUndo.current = true;
    setCategories(prev.categories); setMonths(prev.months); setIncome(prev.income); setSavings(prev.savings);
    setActuals(prev.actuals); setTransactions(prev.transactions); setRecurringFees(prev.recurringFees); setCategoryRules(prev.categoryRules); setSavingsAccounts(prev.savingsAccounts || {});
    if (!prev.months.some((m) => m.id === selectedMonth)) setSelectedMonth(prev.months[0]?.id || null);
  };
  // Ctrl+Z / Cmd+Z undoes the last change (controlled inputs have no reliable native undo).
  const undoRef = useRef(undo);
  undoRef.current = undo;
  useEffect(() => {
    const onKey = (e) => {
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z") {
        if (undoStack.current.length === 0) return;
        e.preventDefault();
        undoRef.current();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const monthTransactions = (m) => transactions[m] || [];
  const categoryTotal = (m, catId) => monthTransactions(m).filter((t) => t.categoryId === catId).reduce((s, t) => s + t.amount, 0);

  // Salaire/Épargne are income & savings categories, not expense categories —
  // detected by name so this works whether they came from the default
  // template or were added manually by a household member.
  const salaireCat = categories.find((c) => c.name.toLowerCase().includes("salaire"));
  const epargneCat = categories.find((c) => { const n = c.name.toLowerCase(); return n.includes("épargne") || n.includes("epargne"); });
  const expenseCategories = categories.filter((c) => c.id !== salaireCat?.id && c.id !== epargneCat?.id);

  // Salaire transactions are money received (negative app-amount) — flip sign for income.
  const salaryFromTransactions = (m) => (salaireCat ? -categoryTotal(m, salaireCat.id) : 0);
  // Épargne transactions are money moved out to savings (positive app-amount) — add as-is.
  const epargneFromTransactions = (m) => (epargneCat ? categoryTotal(m, epargneCat.id) : 0);

  const monthIncome = (m) => (income[m] || []).reduce((s, l) => s + (Number(l.amount) || 0), 0) + salaryFromTransactions(m);
  const monthSavings = (m) => (Number(savings[m]) || 0) + epargneFromTransactions(m);
  const monthBudgetTotal = expenseCategories.reduce((s, c) => s + (Number(c.budget) || 0), 0);
  // Spending not (yet) in any category — no category, or one that was deleted.
  // Only money going out counts: an uncategorized incoming amount could be a
  // salary as well as a refund, so it isn't subtracted from spending.
  const uncategorizedSpent = (m) => monthTransactions(m)
    .filter((t) => !categories.some((c) => c.id === t.categoryId) && Number(t.amount) > 0)
    .reduce((s, t) => s + Number(t.amount), 0);
  const monthActualTotal = (m) => expenseCategories.reduce((s, c) => s + categoryTotal(m, c.id), 0) + uncategorizedSpent(m);
  const monthRestant = (m) => monthIncome(m) - monthActualTotal(m) - monthSavings(m);


  const updateCategoryBudget = (id, v) => setCategories((cs) => cs.map((c) => (c.id === id ? { ...c, budget: v } : c)));
  const renameCategory = (id, name) => setCategories((cs) => cs.map((c) => (c.id === id ? { ...c, name } : c)));
  const addCategory = () => setCategories((cs) => [...cs, { id: uid("cat"), name: "Nouvelle catégorie", budget: 0 }]);
  const removeCategory = (id) => {
    setCategories((cs) => cs.filter((c) => c.id !== id));
    setActuals((a) => { const next = { ...a }; for (const m of Object.keys(next)) { const { [id]: _, ...rest } = next[m] || {}; next[m] = rest; } return next; });
    setTransactions((t) => {
      const next = {};
      for (const m of Object.keys(t)) next[m] = (t[m] || []).map((tx) => (tx.categoryId === id ? { ...tx, categoryId: "" } : tx));
      return next;
    });
  };
  const moveCategory = (id, direction) => {
    setCategories((cs) => {
      const idx = cs.findIndex((c) => c.id === id);
      const swapIdx = idx + direction;
      if (idx === -1 || swapIdx < 0 || swapIdx >= cs.length) return cs;
      const next = [...cs];
      [next[idx], next[swapIdx]] = [next[swapIdx], next[idx]];

    });

  const reorderCategory = (draggedId, targetId) => {
    if (!draggedId || draggedId === targetId) return;

      const next = [...cs];
      const fromIdx = next.findIndex((c) => c.id === draggedId);
      const toIdx = next.findIndex((c) => c.id === targetId);
      if (fromIdx === -1 || toIdx === -1) return cs;

      next.splice(toIdx, 0, moved);
      return next;
    });
  };
  const addMonth = () => {
    const lastKey = sortMonthsChronologically(months).map(monthSortKey).filter(Boolean).pop();
    let suggestion = "";
    if (lastKey) {
      const [y, mo] = lastKey.split("-").map(Number);
      const ny = mo === 12 ? y + 1 : y, nm = mo === 12 ? 1 : mo + 1;
      const n = MONTH_NAMES_FR[nm - 1];
      suggestion = n.charAt(0).toUpperCase() + n.slice(1) + " " + ny;
    }
    const label = window.prompt("Nom du nouveau mois", suggestion); if (!label) return;
    const id = uid("month");
    const prevMonth = sortMonthsChronologically(months)[months.length - 1];
    const recurring = prevMonth
      ? (transactions[prevMonth.id] || []).filter((t) => t.recurring).map((t) => ({ ...t, id: uid("tx"), date: "" }))
      : [];
    const key = monthLabelToKey(label);
    setMonths((ms) => sortMonthsChronologically([...ms, key ? { id, label, date: key + "-01" } : { id, label }]));
    setIncome((inc) => ({ ...inc, [id]: [{ id: uid("inc"), label: "Revenu", amount: 0 }] }));
    setSavings((s) => ({ ...s, [id]: 0 })); setActuals((a) => ({ ...a, [id]: {} }));
    setTransactions((t) => ({ ...t, [id]: recurring }));

  };
  // Deleting a tab deletes its transactions too (before, they stayed hidden in

  const removeMonth = (id) => {

    // Remove every piece of data keyed by this month, not just the tab.

    setIncome(without);

  };
  const [editingMonthId, setEditingMonthId] = useState(null);
  const [editingMonthLabel, setEditingMonthLabel] = useState("");
  const [editingName, setEditingName] = useState(false);
  const [nameDraft, setNameDraft] = useState("");
  const startEditMonth = (id) => {

  const renameMonth = (id) => {

  };
  const updateIncomeLine = (m, lineId, field, v) => setIncome((inc) => ({ ...inc, [m]: (inc[m] || []).map((l) => (l.id === lineId ? { ...l, [field]: v } : l)) }));
  const addIncomeLine = (m) => setIncome((inc) => ({ ...inc, [m]: [...(inc[m] || []), { id: uid("inc"), label: "Nouveau revenu", amount: 0 }] }));
  const removeIncomeLine = (m, lineId) => setIncome((inc) => ({ ...inc, [m]: (inc[m] || []).filter((l) => l.id !== lineId) }));
  const updateSavings = (m, v) => setSavings((s) => ({ ...s, [m]: v }));

  // ---------- CSV import (bank statement) ----------
  const [importSummary, setImportSummary] = useState(null); // transient success message after an import

  // Imported CSV files are kept (table household_imports) so they can be
  // downloaded again later. The list is loaded without the file contents;
  // a file's content is only fetched when it's downloaded.
  const [importFiles, setImportFiles] = useState([]);
  const [showImportFiles, setShowImportFiles] = useState(false);
  const loadImportFiles = async () => {
    const { data, error } = await sb.from("household_imports")
      .select("id, file_name, month_id, imported_count, skipped_count, created_at")
      .eq("household_id", household.id).order("created_at", { ascending: false });

  useEffect(() => { loadImportFiles(); }, [household.id]);
  const saveImportFile = async (fileName, content, monthId, importedCount, skippedCount) => {
    const { error } = await sb.from("household_imports").insert({

    if (error) setImportSummary((msg) => (msg || "") + " ⚠ Le fichier CSV n'a pas pu être archivé.");
    loadImportFiles();
  };
  const downloadImportFile = async (f) => {
    const { data, error } = await sb.from("household_imports").select("content").eq("id", f.id).maybeSingle();
    if (error || !data) { window.alert("Téléchargement impossible."); return; }
    // PDFs are archived as a data URL; CSVs as plain text.
    let blob;
    if (data.content.startsWith("data:application/pdf;base64,")) {
      const bin = atob(data.content.slice(data.content.indexOf(",") + 1));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      blob = new Blob([bytes], { type: "application/pdf" });
    } else blob = new Blob([data.content], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = f.file_name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const deleteImportFile = async (f) => {
    if (!window.confirm(`Supprimer le fichier « ${f.file_name} » ? (Les transactions importées restent.)`)) return;
    const { error } = await sb.from("household_imports").delete().eq("id", f.id);
    if (error) { window.alert("Suppression impossible."); return; }
    setImportFiles((fs) => fs.filter((x) => x.id !== f.id));
  };

  // Keyword fallback. Matching is on whole words of the normalized label
  // (accents/punctuation stripped), so "free" doesn't match "freelance" and
  // "total" doesn't match "totalenergies". Order matters: first rule wins, so
  // more specific phrases (e.g. "amazon prime") come before generic ones ("amazon").
  // Resolves a target category: by one of our known default ids first, else by
  // the category's NAME (accents/case ignored), so renamed, deleted-and-recreated
  // or user-added categories are still found.
  const findCategoryId = (ids, names) => {
    const byId = categories.find((c) => ids.includes(c.id));
    if (byId) return byId.id;
    const byName = categories.find((c) => (names || []).some((n) => normText(c.name).includes(normText(n))));
    return byName ? byName.id : "";
  };

  const guessCategoryId = (label, amount) => {
    const l = normText(label);
    const rules = [
      { ids: ["electricite"], names: ["electricite", "energie", "gaz"], words: ["edf", "engie", "totalenergies electricite", "totalenergies elec", "ekwateur", "enercoop"] },
      { ids: ["essence"], names: ["essence", "carburant"], words: ["total", "totalenergies", "esso", "shell", "bp", "avia", "station", "station service", "carburant"] },
      { ids: ["voiture_entretien"], names: ["entretien", "garage"], words: ["car wash", "garage", "vidange", "pneu", "pneus", "norauto", "feu vert", "midas", "speedy"] },
      { ids: ["internet"], names: ["internet", "telephone", "mobile", "box"], words: ["free", "free mobile", "freebox", "orange", "sfr", "bouygues", "bouygues telecom", "sosh", "red by sfr"] },
      { ids: ["netflix"], names: ["netflix", "abonnement", "streaming"], words: ["netflix", "prime video", "amazon prime", "spotify", "disney", "disney plus", "deezer", "canal"] },
      { ids: ["resto"], names: ["resto", "restaurant", "sorties"], words: ["restaurant", "resto", "brasserie", "uber eats", "deliveroo", "cafe", "mcdonald", "mcdonalds", "burger king", "kfc", "boulangerie"] },
      { ids: ["weekends"], names: ["weekend", "vacances", "voyage"], words: ["hotel", "booking com", "bkg", "airbnb", "camping", "sncf", "ouigo"] },
      { ids: ["alimentation"], names: ["alimentation", "courses", "supermarche"], words: ["carrefour", "leclerc", "monoprix", "auchan", "lidl", "franprix", "intermarche", "supermarche", "super u", "hyper u", "casino supermarche", "geant casino", "casino shop", "petit casino", "picard", "aldi", "boucherie", "amazon"] },
      { ids: ["assurance_habitation"], names: ["assurance habitation"], words: ["assurance habitation", "maif", "macif", "matmut"] },
      { ids: ["voiture_assurance"], names: ["assurance voiture", "voiture assurance", "assurance auto"], words: ["assurance auto", "assurance vehicule"] },
      { ids: ["sante"], names: ["sante", "medical", "pharmacie"], words: ["pharmacie", "pharma", "medecin", "docteur", "dentiste", "optique", "opticien", "audition", "laboratoire", "kine"] },
      { ids: ["pets"], names: ["pets", "animaux", "chien", "chat", "veto"], words: ["veto", "veterinaire", "clinique veterinaire", "maxizoo", "animalerie", "wanimo", "zooplus", "truffaut"] },
    ];
    for (const rule of rules) {
      if (rule.words.some((w) => hasWord(l, w))) {
        const id = findCategoryId(rule.ids, rule.names);
        if (id) return id;
      }
    }

    // Match by category NAME (not id) for things like Salaire/Épargne, since
    // these are often user-added categories with a random internal id rather
    // than one of our known default ids above.
    const findByName = (needle) => categories.find((c) => normText(c.name).includes(needle));
    // Salary is money received (negative in the app's sign convention) — never guess it for a spending.
    if (amount < 0 && ["salaire", "paie", "paye"].some((w) => hasWord(l, w))) {
      const cat = findByName("salaire");
      if (cat) return cat.id;
    }
    if (["epargne", "livret a", "livret", "ldd", "ldds", "lep", "pel"].some((w) => hasWord(l, w))) {

      if (cat) return cat.id;
