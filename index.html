<html lang="fr">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  html, body { margin: 0; padding: 0; }
  body {
    --paper: #F3F5F0; --paper-alt: #E7EBE0; --ink: #232B3A; --ink-soft: #5C645B;
    --rule: #C4CDBC; --green: #3F6B4A; --red: #9B3D3D; --gold: #7C9473;
    --font-display: 'Fraunces', Georgia, serif; --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
    background: var(--paper); color: var(--ink); font-family: var(--font-mono);
  }
  * { box-sizing: border-box; }
  .center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .auth-card { width: 100%; max-width: 380px; border: 1px solid var(--rule); background: var(--paper-alt); padding: 28px; }
  .auth-title { font-family: var(--font-display); font-size: 24px; font-weight: 600; margin: 0 0 4px; }
  .auth-sub { font-size: 12px; color: var(--ink-soft); margin-bottom: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  .field input { width: 100%; font-family: var(--font-mono); font-size: 14px; padding: 9px 10px; border: 1px solid var(--rule); border-radius: 4px; background: #fff; }
  .btn { font-family: var(--font-mono); font-size: 13px; font-weight: 600; padding: 10px 16px; border: none; border-radius: 4px; background: var(--ink); color: var(--paper); cursor: pointer; width: 100%; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-link { background: none; border: none; color: var(--gold); font-family: var(--font-mono); font-size: 12px; cursor: pointer; padding: 0; margin-top: 12px; text-decoration: underline; }
  .err { color: var(--red); font-size: 12px; margin: 8px 0 0; }
  .msg { color: var(--green); font-size: 12px; margin: 8px 0 0; }
  .tab-switch { display: flex; gap: 8px; margin-bottom: 18px; }

  .ledger { min-height: 100vh; padding: 28px 20px 60px; }
  .ledger-head { max-width: 900px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid var(--ink); padding-bottom: 14px; flex-wrap: wrap; gap: 10px; }

  .head-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }

  .invite-code { font-weight: 700; color: var(--ink); background: var(--paper-alt); border: 1px solid var(--rule); border-radius: 4px; padding: 1px 6px; }
  .reset-btn, .logout-btn { font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); background: none; border: 1px solid var(--rule); border-radius: 4px; padding: 4px 10px; cursor: pointer; }

  .tabs { max-width: 900px; margin: 0 auto 24px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tab { font-family: var(--font-mono); font-size: 13px; padding: 8px 14px; background: var(--paper-alt); border: 1px solid var(--rule); border-bottom: none; border-radius: 6px 6px 0 0; cursor: pointer; color: var(--ink-soft); position: relative; top: 1px; }

  .tab-add { font-family: var(--font-mono); font-size: 18px; line-height: 1; padding: 6px 12px; background: transparent; border: 1px dashed var(--rule); border-radius: 6px; cursor: pointer; color: var(--gold); }

  .tab-edit-input { font-family: var(--font-mono); font-size: 13px; border: none; border-bottom: 1px solid var(--ink); background: transparent; color: var(--ink); width: 90px; padding: 0; }

  .row:last-child { border-bottom: none; }
  .row input[type="text"] { font-family: var(--font-mono); font-size: 13px; border: none; background: transparent; color: var(--ink); padding: 4px 0; width: 100%; }

  .add-line { padding: 8px 16px; font-size: 12px; color: var(--gold); background: none; border: none; cursor: pointer; text-align: left; }
  .totals-row { display: flex; justify-content: space-between; padding: 10px 16px; font-size: 13px; border-top: 2px solid var(--ink); font-weight: 600; }
  .table-wrap { max-width: 900px; margin: 0 auto 26px; border: 1px solid var(--rule); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-family: var(--font-mono); font-size: 13px; }
  thead th { text-align: left; font-weight: 600; padding: 10px 12px; border-bottom: 2px solid var(--ink); background: var(--paper-alt); white-space: nowrap; }
  thead th.num, td.num { text-align: right; }
  tbody td { padding: 6px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  tbody tr:hover { background: var(--paper-alt); }
  td input[type="text"] { font-family: var(--font-mono); font-size: 13px; border: none; background: transparent; color: var(--ink); width: 100%; }
  td input[type="number"] { font-family: var(--font-mono); font-size: 13px; text-align: right; border: 1px solid var(--rule); background: #fff; padding: 5px 8px; width: 100px; border-radius: 3px; }
  .diff-pos { color: var(--green); } .diff-neg { color: var(--red); }
  tfoot td { padding: 10px 12px; font-weight: 600; border-top: 2px solid var(--ink); }
  .import-drop { padding: 16px; border: 1px dashed var(--rule); margin: 12px 16px; text-align: center; }
  .import-drop input { font-family: var(--font-mono); font-size: 12px; }
  .import-hint { font-size: 11px; color: var(--ink-soft); margin-top: 8px; }
  .import-preview { max-height: 320px; overflow-y: auto; }
  .import-row { display: grid; grid-template-columns: 90px 1fr 90px 160px; gap: 10px; align-items: center; padding: 6px 16px; border-bottom: 1px solid var(--rule); font-size: 12px; }
  .import-row select { font-family: var(--font-mono); font-size: 12px; padding: 4px; border: 1px solid var(--rule); border-radius: 3px; background: #fff; }
  .import-actions { display: flex; gap: 8px; padding: 12px 16px; }
  .import-actions button { font-family: var(--font-mono); font-size: 12px; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
  .import-confirm { background: var(--ink); color: var(--paper); border: none; }
  .import-cancel { background: none; border: 1px solid var(--rule); color: var(--ink-soft); }
  .import-summary { font-size: 12px; color: var(--ink-soft); padding: 0 16px 12px; }
  .summary { max-width: 900px; margin: 0 auto 26px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat { border: 1px solid var(--rule); padding: 14px; background: var(--paper-alt); }
  .stat-label { font-size: 11px; color: var(--ink-soft); margin-bottom: 6px; }
  .stat-value { font-family: var(--font-display); font-size: 22px; font-weight: 600; }
  .charts { max-width: 900px; margin: 0 auto; display: grid; gap: 24px; }
  .chart-box { border: 1px solid var(--rule); background: var(--paper-alt); padding: 14px; }
  .chart-title { font-family: var(--font-display); font-size: 15px; margin: 0 0 10px; }
  @media (max-width: 640px) { .summary { grid-template-columns: repeat(2, 1fr); } .row, thead th, tbody td { font-size: 12px; } }
</style>

// ---------- Charts ----------
function BarChartCanvas({ data }) {
  const canvasRef = useRef(null); const chartRef = useRef(null);
  useEffect(() => {
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "bar",
      data: { labels: data.map((d) => d.name), datasets: [
        { label: "Budget", data: data.map((d) => d.Budget), backgroundColor: "#7C9473" },
        { label: "Réel", data: data.map((d) => d.Réel), backgroundColor: "#3F6B4A" },
      ]},
      options: { responsive: true, plugins: { legend: { labels: { font: { family: "IBM Plex Mono", size: 11 } } } },
        scales: { x: { ticks: { font: { family: "IBM Plex Mono", size: 9 }, maxRotation: 60, minRotation: 45 } }, y: { ticks: { font: { family: "IBM Plex Mono", size: 10 } } } } },
    });
    return () => chartRef.current && chartRef.current.destroy();
  }, [data]);
  return <canvas ref={canvasRef} height="110"></canvas>;
}
function LineChartCanvas({ data }) {
  const canvasRef = useRef(null); const chartRef = useRef(null);
  useEffect(() => {
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "line",
      data: { labels: data.map((d) => d.name), datasets: [{ label: "Restant", data: data.map((d) => d.Restant), borderColor: "#232B3A", backgroundColor: "#232B3A", tension: 0.25 }] },
      options: { responsive: true, plugins: { legend: { labels: { font: { family: "IBM Plex Mono", size: 11 } } } },
        scales: { x: { ticks: { font: { family: "IBM Plex Mono", size: 10 } } }, y: { ticks: { font: { family: "IBM Plex Mono", size: 10 } } } } },
    });
    return () => chartRef.current && chartRef.current.destroy();
  }, [data]);
  return <canvas ref={canvasRef} height="90"></canvas>;
}

// ---------- Auth screen ----------
function AuthScreen() {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState(""); const [password, setPassword] = useState("");
  const [error, setError] = useState(""); const [msg, setMsg] = useState(""); const [busy, setBusy] = useState(false);

  const submit = async (e) => {
    e.preventDefault(); setError(""); setMsg(""); setBusy(true);
    if (mode === "signin") {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) setError(error.message);
    } else {
      const { error } = await sb.auth.signUp({ email, password });
      if (error) {
        setError(error.message);
      } else {
        setMsg("Compte créé. Vérifiez votre e-mail si une confirmation est requise, puis connectez-vous.");
        setMode("signin");
      }
    }
    setBusy(false);
  };

  return (
    <div className="center-screen">
      <form className="auth-card" onSubmit={submit}>
        <h1 className="auth-title">Budget du foyer</h1>
        <p className="auth-sub">Connectez-vous pour accéder au budget partagé</p>
        <div className="tab-switch">
          <button type="button" className={mode === "signin" ? "active" : ""} onClick={() => { setMode("signin"); setError(""); setMsg(""); }}>Se connecter</button>
          <button type="button" className={mode === "signup" ? "active" : ""} onClick={() => { setMode("signup"); setError(""); setMsg(""); }}>Créer un compte</button>
        </div>
        <div className="field"><label>E-mail</label><input type="email" value={email} onChange={(e) => setEmail(e.target.value)} required /></div>
        <div className="field"><label>Mot de passe</label><input type="password" value={password} onChange={(e) => setPassword(e.target.value)} required minLength={6} /></div>
        <button className="btn" disabled={busy}>{mode === "signin" ? "Se connecter" : "Créer le compte"}</button>
        {error && <p className="err">{error}</p>}
        {msg && <p className="msg">{msg}</p>}
      </form>
    </div>
  );
}

// ---------- Household create/join screen ----------
function HouseholdSetup({ session, onReady }) {
  const [mode, setMode] = useState("create");
  const [name, setName] = useState(""); const [code, setCode] = useState("");
  const [error, setError] = useState(""); const [busy, setBusy] = useState(false);

  const createHousehold = async (e) => {
    e.preventDefault(); setError(""); setBusy(true);
    const { data: hh, error: e1 } = await sb.from("households").insert({ name }).select().single();
    if (e1) { setError(e1.message); setBusy(false); return; }
    const { error: e2 } = await sb.from("household_members").insert({ household_id: hh.id, user_id: session.user.id });
    if (e2) { setError(e2.message); setBusy(false); return; }
    const { error: e3 } = await sb.from("household_budget").insert({ household_id: hh.id, data: emptyBudgetDoc() });
    if (e3) { setError(e3.message); setBusy(false); return; }
    setBusy(false); onReady(hh);
  };

  const joinHousehold = async (e) => {
    e.preventDefault(); setError(""); setBusy(true);
    const { data: hh, error: e1 } = await sb.from("households").select("*").eq("invite_code", code.trim()).maybeSingle();
    if (e1 || !hh) { setError("Code d'invitation introuvable."); setBusy(false); return; }
    const { error: e2 } = await sb.from("household_members").insert({ household_id: hh.id, user_id: session.user.id });
    if (e2 && !e2.message.includes("duplicate")) { setError(e2.message); setBusy(false); return; }
    setBusy(false); onReady(hh);
  };

  return (
    <div className="center-screen">
      <div className="auth-card">
        <h1 className="auth-title">Votre foyer</h1>
        <p className="auth-sub">Créez un foyer ou rejoignez celui d'un proche</p>
        <div className="tab-switch">
          <button type="button" className={mode === "create" ? "active" : ""} onClick={() => setMode("create")}>Créer un foyer</button>
          <button type="button" className={mode === "join" ? "active" : ""} onClick={() => setMode("join")}>Rejoindre avec un code</button>
        </div>
        {mode === "create" ? (
          <form onSubmit={createHousehold}>
            <div className="field"><label>Nom du foyer</label><input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="ex: Famille Massard" required /></div>
            <button className="btn" disabled={busy}>Créer</button>
          </form>
        ) : (
          <form onSubmit={joinHousehold}>
            <div className="field"><label>Code d'invitation</label><input type="text" value={code} onChange={(e) => setCode(e.target.value)} placeholder="ex: a1b2c3d4" required /></div>
            <button className="btn" disabled={busy}>Rejoindre</button>
          </form>
        )}
        {error && <p className="err">{error}</p>}
      </div>
    </div>
  );
}

// ---------- Main budget tracker (shared, per household) ----------
function BudgetTracker({ household, onLogout, onRename }) {
  const [loaded, setLoaded] = useState(false);
  const [categories, setCategories] = useState([]);
  const [months, setMonths] = useState([]);
  const [income, setIncome] = useState({});
  const [savings, setSavings] = useState({});
  const [actuals, setActuals] = useState({});
  const [transactions, setTransactions] = useState({}); // { [monthId]: [{id, date, label, amount, categoryId}] }
  const [selectedMonth, setSelectedMonth] = useState(null);
  const [saveState, setSaveState] = useState("idle");
  const [showTransactions, setShowTransactions] = useState(true);
  const saveTimer = useRef(null);
  const lastMonthKey = "budget:lastMonth:" + household.id;

  useEffect(() => {
    (async () => {
      const { data, error } = await sb.from("household_budget").select("data").eq("household_id", household.id).maybeSingle();
      const doc = (data && data.data) || emptyBudgetDoc();
      const txs = doc.transactions || {};
      let acts = doc.actuals || {};

      // One-time migration: turn any legacy "manual total" numbers into a
      // real transaction line item, so everything lives in one unified list.
      if (!doc.migratedActuals) {
        const newTxs = { ...txs };
        const clearedActs = {};
        for (const m of Object.keys(acts)) {
          clearedActs[m] = {};
          for (const catId of Object.keys(acts[m] || {})) {
            const val = Number(acts[m][catId]) || 0;
            if (val !== 0) {
              newTxs[m] = [
                ...(newTxs[m] || []),
                { id: uid("legacy"), date: "", label: "Saisie manuelle (avant mise à jour)", amount: val, categoryId: catId },
              ];
            }
          }
        }
        acts = clearedActs;
        setTransactions(newTxs);
        setActuals(clearedActs);
      } else {
        setTransactions(txs);
        setActuals(acts);
      }

      setCategories(doc.categories); setMonths(doc.months); setIncome(doc.income);
      setSavings(doc.savings);
      const remembered = localStorage.getItem(lastMonthKey);
      const validMonth = doc.months.find((m) => m.id === remembered);
      setSelectedMonth((validMonth && validMonth.id) || doc.months[0]?.id || null);
      setLoaded(true);
    })();
  }, [household.id]);

  useEffect(() => {
    if (selectedMonth) localStorage.setItem(lastMonthKey, selectedMonth);
  }, [selectedMonth]);

  useEffect(() => {
    if (!loaded) return;
    setSaveState("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      const { error } = await sb.from("household_budget")
        .update({ data: { categories, months, income, savings, actuals, transactions, migratedActuals: true }, updated_at: new Date().toISOString() })
        .eq("household_id", household.id);
      setSaveState(error ? "error" : "saved");
    }, 500);
    return () => clearTimeout(saveTimer.current);
  }, [categories, months, income, savings, actuals, transactions, loaded]);

  const monthTransactions = (m) => transactions[m] || [];
  const categoryTotal = (m, catId) => monthTransactions(m).filter((t) => t.categoryId === catId).reduce((s, t) => s + t.amount, 0);

  const monthIncome = (m) => (income[m] || []).reduce((s, l) => s + (Number(l.amount) || 0), 0);
  const monthBudgetTotal = categories.reduce((s, c) => s + (Number(c.budget) || 0), 0);
  const monthActualTotal = (m) => categories.reduce((s, c) => s + categoryTotal(m, c.id), 0);
  const monthRestant = (m) => monthIncome(m) - monthActualTotal(m) - (Number(savings[m]) || 0);


  const updateCategoryBudget = (id, v) => setCategories((cs) => cs.map((c) => (c.id === id ? { ...c, budget: v } : c)));
  const renameCategory = (id, name) => setCategories((cs) => cs.map((c) => (c.id === id ? { ...c, name } : c)));
  const addCategory = () => setCategories((cs) => [...cs, { id: uid("cat"), name: "Nouvelle catégorie", budget: 0 }]);
  const removeCategory = (id) => {
    setCategories((cs) => cs.filter((c) => c.id !== id));
    setActuals((a) => { const next = { ...a }; for (const m of Object.keys(next)) { const { [id]: _, ...rest } = next[m] || {}; next[m] = rest; } return next; });
    setTransactions((t) => {
      const next = {};
      for (const m of Object.keys(t)) next[m] = (t[m] || []).map((tx) => (tx.categoryId === id ? { ...tx, categoryId: "" } : tx));
      return next;
    });
  };
  const addMonth = () => {
    const label = window.prompt("Nom du nouveau mois (ex: Novembre 2026)"); if (!label) return;
    const id = uid("month");
    setMonths((ms) => [...ms, { id, label }]);
    setIncome((inc) => ({ ...inc, [id]: [{ id: uid("inc"), label: "Revenu", amount: 0 }] }));
    setSavings((s) => ({ ...s, [id]: 0 })); setActuals((a) => ({ ...a, [id]: {} })); setSelectedMonth(id);
  };
  const removeMonth = (id) => {
    setMonths((ms) => ms.filter((m) => m.id !== id));
    if (selectedMonth === id) { const rest = months.filter((m) => m.id !== id); if (rest.length) setSelectedMonth(rest[0].id); }
  };
  const [editingMonthId, setEditingMonthId] = useState(null);
  const [editingMonthLabel, setEditingMonthLabel] = useState("");
  const [editingName, setEditingName] = useState(false);
  const [nameDraft, setNameDraft] = useState("");
  const startEditMonth = (id) => {
    const current = months.find((m) => m.id === id);
    setEditingMonthId(id);
    setEditingMonthLabel(current ? current.label : "");
  };
  const commitEditMonth = () => {
    const label = editingMonthLabel.trim();
    if (label) setMonths((ms) => ms.map((m) => (m.id === editingMonthId ? { ...m, label } : m)));
    setEditingMonthId(null);
  };
  const cancelEditMonth = () => setEditingMonthId(null);
  const updateIncomeLine = (m, lineId, field, v) => setIncome((inc) => ({ ...inc, [m]: (inc[m] || []).map((l) => (l.id === lineId ? { ...l, [field]: v } : l)) }));
  const addIncomeLine = (m) => setIncome((inc) => ({ ...inc, [m]: [...(inc[m] || []), { id: uid("inc"), label: "Nouveau revenu", amount: 0 }] }));
  const removeIncomeLine = (m, lineId) => setIncome((inc) => ({ ...inc, [m]: (inc[m] || []).filter((l) => l.id !== lineId) }));
  const updateSavings = (m, v) => setSavings((s) => ({ ...s, [m]: v }));

  // ---------- CSV import (bank statement) ----------
  const [importRows, setImportRows] = useState(null); // null = no import in progress

  const guessCategoryId = (label) => {
    const l = (label || "").toLowerCase();
    const rules = [
      { ids: ["alimentation"], words: ["carrefour", "leclerc", "monoprix", "auchan", "lidl", "franprix", "intermarche", "supermarche", "casino"] },
      { ids: ["essence"], words: ["total", "esso", "shell", "bp ", "station", "carburant"] },
      { ids: ["electricite"], words: ["edf", "engie", "totalenergies elec"] },
      { ids: ["internet"], words: ["free", "orange", "sfr", "bouygues", "sosh"] },
      { ids: ["resto"], words: ["restaurant", "resto", "brasserie", "uber eats", "deliveroo"] },
      { ids: ["netflix"], words: ["netflix", "prime video", "amazon prime", "spotify", "disney"] },
      { ids: ["assurance_habitation"], words: ["assurance habitation", "maif", "macif", "matmut"] },
      { ids: ["voiture_assurance"], words: ["assurance auto", "assurance vehicule"] },
      { ids: ["sante"], words: ["pharmacie", "medecin", "docteur", "dentiste"] },
      { ids: ["pets"], words: ["veto", "vétérinaire", "veterinaire", "clinique veterinaire", "maxizoo", "animalerie", "wanimo", "zooplus"] },
    ];
    for (const rule of rules) {
      if (rule.words.some((w) => l.includes(w))) {
        const match = categories.find((c) => rule.ids.includes(c.id));
        if (match) return match.id;
      }
    }
    return "";
  };

  // ---------- Duplicate detection (same date + same amount + same label) ----------
  const normLabel = (s) => (s || "").trim().toLowerCase();
  const isDuplicateOf = (a, b) =>
    (a.date || "").trim() === (b.date || "").trim() &&
    Math.abs((Number(a.amount) || 0) - (Number(b.amount) || 0)) < 0.005 &&
    normLabel(a.label) === normLabel(b.label);
  const signatureOf = (t) => (t.date || "").trim() + "|" + (Number(t.amount) || 0).toFixed(2) + "|" + normLabel(t.label);

  const findDuplicateInMonth = (m, candidate, excludeId) =>
    (transactions[m] || []).find((tx) => tx.id !== excludeId && isDuplicateOf(tx, candidate));

  const parseCsv = (text) => {
    const lines = text.split(/\r\n|\n/).filter((l) => l.trim().length > 0);
    if (lines.length < 2) return [];
    const delim = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ";" : ",";
    const splitLine = (line) => line.split(delim).map((c) => c.trim().replace(/^"|"$/g, ""));
    const header = splitLine(lines[0]).map((h) => h.toLowerCase());
    const dateIdx = header.findIndex((h) => h.includes("date"));
    const labelIdx = header.findIndex((h) => h.includes("label") || h.includes("libell"));
    const amountIdx = header.findIndex((h) => h.includes("amount") || h.includes("montant"));
    if (dateIdx === -1 || labelIdx === -1 || amountIdx === -1) return "invalid";

    // Count how many transactions with each exact signature are already saved
    // for this month — only THAT many repeats in the new file count as
    // duplicates. Extra repeats beyond that (e.g. two separate same-day,
    // same-amount purchases at the same place) are treated as genuinely new.
    const existingCounts = {};
    for (const tx of transactions[selectedMonth] || []) {
      const sig = signatureOf(tx);
      existingCounts[sig] = (existingCounts[sig] || 0) + 1;
    }
    const consumed = {};

    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const cells = splitLine(lines[i]);
      if (cells.length <= Math.max(dateIdx, labelIdx, amountIdx)) continue;
      const rawAmount = (cells[amountIdx] || "").replace(/\s/g, "").replace(",", ".");
      const amount = parseFloat(rawAmount);
      if (isNaN(amount) || amount >= 0) continue; // only keep expenses (negative amounts)
      const label = cells[labelIdx] || "(sans libellé)";
      const candidate = { date: cells[dateIdx] || "", label, amount: Math.abs(amount) };
      const sig = signatureOf(candidate);
      const allowed = existingCounts[sig] || 0;
      const used = consumed[sig] || 0;
      const isDup = used < allowed;
      consumed[sig] = used + 1;
      rows.push({
        id: uid("tx"),
        date: candidate.date,
        label,
        amount: candidate.amount,
        categoryId: isDup ? "" : guessCategoryId(label),
        duplicate: isDup,
      });
    }
    return rows;
  };

  const handleCsvFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const parsed = parseCsv(ev.target.result);
      if (parsed === "invalid") {
        window.alert("Colonnes attendues introuvables (date, libellé/label, montant). Vérifiez le format du fichier exporté.");
        return;
      }
      setImportRows(parsed);
    };
    reader.readAsText(file, "utf-8");
    e.target.value = "";
  };

  const setImportRowCategory = (id, catId) => {
    if (catId === "__new__") {
      const name = window.prompt("Nom de la nouvelle catégorie ?");
      if (!name) return;
      const newId = uid("cat");
      setCategories((cs) => [...cs, { id: newId, name, budget: 0 }]);
      setImportRows((rows) => rows.map((r) => (r.id === id ? { ...r, categoryId: newId } : r)));
      return;
    }
    setImportRows((rows) => rows.map((r) => (r.id === id ? { ...r, categoryId: catId } : r)));
  };

  const confirmImport = () => {
    const classified = importRows.filter((r) => r.categoryId && !r.duplicate);
    setTransactions((t) => ({ ...t, [selectedMonth]: [...(t[selectedMonth] || []), ...classified.map(({ duplicate, ...r }) => r)] }));
    setImportRows(null);
  };

  const cancelImport = () => setImportRows(null);

  // ---------- Transaction log (editable, per month) ----------
  const [txErrors, setTxErrors] = useState({}); // { [txId]: "error message" }, kept for inline highlight too

  const flagTxError = (txId, message) => {
    window.alert(message);
    setTxErrors((e) => ({ ...e, [txId]: message }));
    setTimeout(() => setTxErrors((e) => { const { [txId]: _, ...rest } = e; return rest; }), 6000);
  };

  const updateTransactionCategory = (m, txId, catId) => {
    if (catId === "__new__") {
      const name = window.prompt("Nom de la nouvelle catégorie ?");
      if (!name) return;
      const newId = uid("cat");
      setCategories((cs) => [...cs, { id: newId, name, budget: 0 }]);
      catId = newId;
    }
    setTransactions((t) => ({ ...t, [m]: (t[m] || []).map((tx) => (tx.id === txId ? { ...tx, categoryId: catId } : tx)) }));
  };
  const updateTransactionField = (m, txId, field, value) => {
    const current = (transactions[m] || []).find((tx) => tx.id === txId);
    if (!current) return;
    const candidate = { ...current, [field]: value };
    const isComplete = (candidate.date || "").trim() !== "" && Number(candidate.amount) > 0 && (candidate.label || "").trim() !== "";
    if (isComplete) {
      const dup = findDuplicateInMonth(m, candidate, txId);
      if (dup) {
        flagTxError(txId, "⚠️ Doublon : une dépense identique (même date, même montant, même libellé) existe déjà — modification bloquée.");
        return; // block the change
      }
    }
    setTransactions((t) => ({ ...t, [m]: (t[m] || []).map((tx) => (tx.id === txId ? candidate : tx)) }));
  };
  const removeTransaction = (m, txId) =>
    setTransactions((t) => ({ ...t, [m]: (t[m] || []).filter((tx) => tx.id !== txId) }));
  const addManualTransaction = (m) =>
    setTransactions((t) => ({ ...t, [m]: [...(t[m] || []), { id: uid("tx"), date: "", label: "Nouvelle dépense", amount: 0, categoryId: "" }] }));


  if (!loaded || !selectedMonth) return <div style={{ padding: 40 }}>Chargement du budget…</div>;

  const commitNameEdit = () => {
    const name = nameDraft.trim();
    if (name && name !== household.name) onRename(name);
    setEditingName(false);
  };

  const barData = categories.map((c) => ({ name: c.name.length > 14 ? c.name.slice(0, 13) + "…" : c.name, Budget: Number(c.budget) || 0, Réel: categoryTotal(selectedMonth, c.id) }));
  const trendData = months.map((m) => ({ name: m.label, Restant: Math.round(monthRestant(m.id)) }));
  const curIncomeLines = income[selectedMonth] || [];
  const curIncomeTotal = monthIncome(selectedMonth);
  const curActualTotal = monthActualTotal(selectedMonth);
  const curSavings = Number(savings[selectedMonth]) || 0;
  const curRestant = monthRestant(selectedMonth);
  const curMonthLabel = months.find((m) => m.id === selectedMonth)?.label;

  return (
    <div className="ledger">
      <div className="ledger-head">
        <div>
          {editingName ? (
            <input
              autoFocus
              className="title-edit-input"
              value={nameDraft}
              onChange={(e) => setNameDraft(e.target.value)}
              onBlur={commitNameEdit}
              onKeyDown={(e) => {
                if (e.key === "Enter") commitNameEdit();
                if (e.key === "Escape") setEditingName(false);
              }}
            />
          ) : (
            <h1 className="ledger-title" style={{ display: "inline", cursor: "pointer" }} title="Cliquer pour renommer" onClick={() => { setNameDraft(household.name); setEditingName(true); }}>
              {household.name} <span style={{ fontSize: 14, color: "var(--ink-soft)" }}>✎</span>
            </h1>
          )}
          <div className="ledger-sub">Revenus, épargne et dépenses — partagé et modifiable en direct</div>
        </div>
        <div className="head-actions">
          <span className="save-pill">{saveState === "saving" ? "Enregistrement…" : saveState === "error" ? "Erreur d'enregistrement" : "Enregistré"}</span>
          <span className="invite-pill">Code d'invitation : <span className="invite-code">{household.invite_code}</span></span>
          <button className="logout-btn" onClick={onLogout}>Se déconnecter</button>
        </div>
      </div>

      <div className="tabs">
        {months.map((m) => (
          <div
            key={m.id}
            className={"tab" + (m.id === selectedMonth ? " active" : "")}
            onClick={() => { if (editingMonthId !== m.id) setSelectedMonth(m.id); }}
            onDoubleClick={(e) => { e.stopPropagation(); startEditMonth(m.id); }}
            title="Double-cliquer pour renommer"
          >
            {editingMonthId === m.id ? (
              <input
                autoFocus
                className="tab-edit-input"
                value={editingMonthLabel}
                onClick={(e) => e.stopPropagation()}
                onChange={(e) => setEditingMonthLabel(e.target.value)}
                onBlur={commitEditMonth}
                onKeyDown={(e) => {
                  if (e.key === "Enter") commitEditMonth();
                  if (e.key === "Escape") cancelEditMonth();
                }}
              />
            ) : (
              <React.Fragment>
                {m.label}
                <span className="tab-remove" style={{ color: "var(--ink-soft)" }} onClick={(e) => { e.stopPropagation(); startEditMonth(m.id); }}>✎</span>
              </React.Fragment>
            )}
            {months.length > 1 && editingMonthId !== m.id && <span className="tab-remove" onClick={(e) => { e.stopPropagation(); removeMonth(m.id); }}>✕</span>}
          </div>
        ))}
        <button className="tab-add" onClick={addMonth} title="Ajouter un mois">+</button>
      </div>

      <div className="panel">
        <div className="panel-title">Revenus — {curMonthLabel}</div>
        {curIncomeLines.map((l) => (
          <div className="row" key={l.id}>
            <input type="text" value={l.label} onChange={(e) => updateIncomeLine(selectedMonth, l.id, "label", e.target.value)} />
            <input type="number" value={l.amount} onChange={(e) => updateIncomeLine(selectedMonth, l.id, "amount", parseFloat(e.target.value) || 0)} />
            <button className="icon-btn" onClick={() => removeIncomeLine(selectedMonth, l.id)}>✕</button>
          </div>
        ))}
        <button className="add-line" onClick={() => addIncomeLine(selectedMonth)}>+ Ajouter une ligne de revenu</button>
        <div className="totals-row"><span>Total revenus</span><span>{fmt(curIncomeTotal)}</span></div>
      </div>

      <div className="panel">
        <div className="panel-title">Épargne mise de côté</div>
        <div className="row" style={{ gridTemplateColumns: "1fr 140px" }}>
          <span>Montant épargné ce mois-ci</span>
          <input type="number" value={curSavings} onChange={(e) => updateSavings(selectedMonth, parseFloat(e.target.value) || 0)} />
        </div>
      </div>

      <div className="panel">
        <div className="panel-title">Importer un relevé bancaire (CSV)</div>
        {!importRows && (
          <div className="import-drop">
            <input type="file" accept=".csv,text/csv" onChange={handleCsvFile} />
            <div className="import-hint">
              Exportez votre relevé en CSV depuis votre banque (ex: Boursorama : Comptes → Télécharger → CSV), puis sélectionnez le fichier ici.
              Seules les dépenses (montants négatifs) sont importées, pour le mois « {curMonthLabel} ».
            </div>
          </div>
        )}
        {importRows && importRows.length === 0 && (
          <div className="import-hint" style={{ padding: 16 }}>Aucune dépense trouvée dans ce fichier. <button className="add-line" style={{ display: "inline", padding: 0 }} onClick={cancelImport}>Réessayer</button></div>
        )}
        {importRows && importRows.length > 0 && (
          <React.Fragment>
            <div className="import-summary">
              {importRows.length} transaction(s) trouvée(s)
              {importRows.some((r) => r.duplicate) && <span> — {importRows.filter((r) => r.duplicate).length} doublon(s) détecté(s) et exclu(s) automatiquement</span>}
              . Assignez une catégorie à chacune (ou laissez « Ignorer »).
            </div>
            <div className="import-preview">
              {importRows.map((r) => (
                <div className="import-row" key={r.id} style={r.duplicate ? { opacity: 0.55 } : undefined}>
                  <span>{r.date}</span>
                  <span title={r.label}>{r.label.length > 40 ? r.label.slice(0, 39) + "…" : r.label}</span>
                  <span style={{ textAlign: "right" }}>{fmt(r.amount)}</span>
                  {r.duplicate ? (
                    <span style={{ fontSize: 11, color: "var(--red)" }}>
                      Doublon — déjà présent{" "}
                      <button
                        className="add-line"
                        style={{ display: "inline", padding: 0, fontSize: 11 }}
                        onClick={() => setImportRows((rows) => rows.map((row) => (row.id === r.id ? { ...row, duplicate: false, categoryId: guessCategoryId(row.label) } : row)))}
                      >
                        (pas un doublon ?)
                      </button>
                    </span>
                  ) : (
                    <select value={r.categoryId} onChange={(e) => setImportRowCategory(r.id, e.target.value)}>
                      <option value="">— Ignorer —</option>
                      {categories.map((c) => (
                        <option key={c.id} value={c.id}>{c.name}</option>
                      ))}
                      <option value="__new__">+ Nouvelle catégorie…</option>
                    </select>
                  )}
                </div>
              ))}
            </div>
            <div className="import-summary" style={{ paddingTop: 0 }}>{importRows.filter((r) => !r.duplicate).length} seront importées ; {importRows.filter((r) => r.duplicate).length} ignorées comme doublons.</div>
            <div className="import-actions">
              <button className="import-confirm" onClick={confirmImport}>Importer les dépenses classées</button>
              <button className="import-cancel" onClick={cancelImport}>Annuler</button>
            </div>
            <div className="import-hint" style={{ padding: "0 16px 12px" }}>
              Ces dépenses seront ajoutées à {curMonthLabel} et resteront visibles/modifiables dans « Transactions » ci-dessous.
            </div>
          </React.Fragment>
        )}
      </div>

      <div className="panel">
        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }} onClick={() => setShowTransactions((v) => !v)}>
          <span>Transactions — {curMonthLabel} ({monthTransactions(selectedMonth).length})</span>
          <span style={{ fontSize: 12, color: "var(--gold)" }}>{showTransactions ? "Masquer ▲" : "Voir / modifier ▼"}</span>
        </div>
        {showTransactions && (
          <React.Fragment>
            {monthTransactions(selectedMonth).length === 0 ? (
              <div className="import-hint" style={{ padding: 16 }}>Aucune dépense enregistrée ce mois-ci pour l'instant.</div>
            ) : (
              <div className="import-preview">
                {monthTransactions(selectedMonth).map((tx) => (
                  <React.Fragment key={tx.id}>
                    <div className="import-row">
                      <input
                        type="text"
                        style={{ fontFamily: "var(--font-mono)", fontSize: 12, border: "1px solid var(--rule)", borderRadius: 3, padding: 4, width: "100%" }}
                        value={tx.date}
                        placeholder="date"
                        onChange={(e) => updateTransactionField(selectedMonth, tx.id, "date", e.target.value)}
                      />
                      <input
                        type="text"
                        style={{ fontFamily: "var(--font-mono)", fontSize: 12, border: "1px solid var(--rule)", borderRadius: 3, padding: 4, width: "100%" }}
                        value={tx.label}
                        placeholder="libellé"
                        onChange={(e) => updateTransactionField(selectedMonth, tx.id, "label", e.target.value)}
                      />
                      <input
                        type="number"
                        style={{ textAlign: "right", fontFamily: "var(--font-mono)", fontSize: 12, border: "1px solid var(--rule)", borderRadius: 3, padding: 4 }}
                        value={tx.amount}
                        onChange={(e) => updateTransactionField(selectedMonth, tx.id, "amount", parseFloat(e.target.value) || 0)}
                      />
                      <div style={{ display: "flex", gap: 6 }}>
                        <select value={tx.categoryId} onChange={(e) => updateTransactionCategory(selectedMonth, tx.id, e.target.value)}>
                          <option value="">— Ignorer —</option>
                          {categories.map((c) => (<option key={c.id} value={c.id}>{c.name}</option>))}
                          <option value="__new__">+ Nouvelle catégorie…</option>
                        </select>
                        <button className="icon-btn" onClick={() => removeTransaction(selectedMonth, tx.id)}>✕</button>
                      </div>
                    </div>
                    {txErrors[tx.id] && (
                      <div style={{ fontSize: 11, color: "var(--red)", padding: "0 16px 8px" }}>{txErrors[tx.id]}</div>
                    )}
                  </React.Fragment>
                ))}
              </div>
            )}
            <button className="add-line" onClick={() => addManualTransaction(selectedMonth)}>+ Ajouter une dépense</button>
          </React.Fragment>
        )}
      </div>

      <div className="table-wrap">
        <table>
          <thead><tr><th>Catégorie</th><th className="num">Budget mensuel</th><th className="num">Réel ({curMonthLabel})</th><th className="num">Écart</th><th></th></tr></thead>
          <tbody>
            {categories.map((c) => {
              const total = categoryTotal(selectedMonth, c.id);
              const diff = (Number(c.budget) || 0) - total;
              return (
                <tr key={c.id}>
                  <td><input type="text" value={c.name} onChange={(e) => renameCategory(c.id, e.target.value)} /></td>
                  <td className="num"><input type="number" value={c.budget} onChange={(e) => updateCategoryBudget(c.id, parseFloat(e.target.value) || 0)} /></td>
                  <td className="num">{fmt(total)}</td>
                  <td className={"num " + (diff >= 0 ? "diff-pos" : "diff-neg")}>{fmt(diff)}</td>
                  <td><button className="icon-btn" onClick={() => removeCategory(c.id)}>✕</button></td>
                </tr>
              );
            })}
          </tbody>
          <tfoot><tr><td>Total</td><td className="num">{fmt(monthBudgetTotal)}</td><td className="num">{fmt(curActualTotal)}</td><td className="num">{fmt(monthBudgetTotal - curActualTotal)}</td><td></td></tr></tfoot>
        </table>
        <button className="add-line" onClick={addCategory}>+ Ajouter une catégorie</button>
      </div>
      <div className="import-hint" style={{ maxWidth: 900, margin: "-16px auto 26px", padding: "0 4px" }}>
        Le montant « Réel » est calculé automatiquement à partir des transactions ci-dessus — modifiez-les dans le panneau « Transactions ».
      </div>

      <div className="summary">
        <div className="stat"><div className="stat-label">Revenus du mois</div><div className="stat-value">{fmt(curIncomeTotal)}</div></div>
        <div className="stat"><div className="stat-label">Dépenses réelles</div><div className="stat-value">{fmt(curActualTotal)}</div></div>
        <div className="stat"><div className="stat-label">Épargne</div><div className="stat-value">{fmt(curSavings)}</div></div>
        <div className="stat"><div className="stat-label">Restant</div><div className="stat-value" style={{ color: curRestant >= 0 ? "#3F6B4A" : "#9B3D3D" }}>{fmt(curRestant)}</div></div>
      </div>

      <div className="charts">
        <div className="chart-box"><p className="chart-title">Budget vs. réel par catégorie</p><BarChartCanvas data={barData} /></div>
        <div className="chart-box"><p className="chart-title">Restant en fin de mois — tendance</p><LineChartCanvas data={trendData} /></div>
      </div>
    </div>
  );
}

// ---------- Top-level app: auth -> household -> tracker ----------
function App() {
  const [session, setSession] = useState(null);
  const [loadingSession, setLoadingSession] = useState(true);
  const [household, setHousehold] = useState(null);
  const [checkingHousehold, setCheckingHousehold] = useState(false);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setLoadingSession(false); });
    const { data: listener } = sb.auth.onAuthStateChange((_event, s) => setSession(s));
    return () => listener.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setHousehold(null); return; }
    (async () => {
      setCheckingHousehold(true);
      const { data } = await sb.from("household_members")
        .select("household_id, households(id, name, invite_code)")
        .eq("user_id", session.user.id).limit(1).maybeSingle();
      if (data && data.households) setHousehold(data.households);
      setCheckingHousehold(false);
    })();
  }, [session]);

  const logout = async () => { await sb.auth.signOut(); setHousehold(null); };

  const renameHousehold = async (newName) => {
    const { error } = await sb.from("households").update({ name: newName }).eq("id", household.id);
    if (error) {
      window.alert("Impossible de renommer le foyer : " + error.message);
      return;
    }
    setHousehold((h) => ({ ...h, name: newName }));
  };

  if (loadingSession) return <div style={{ padding: 40 }}>Chargement…</div>;
  if (!session) return <AuthScreen />;
  if (checkingHousehold) return <div style={{ padding: 40 }}>Chargement…</div>;
  if (!household) return <HouseholdSetup session={session} onReady={setHousehold} />;
  return <BudgetTracker household={household} onLogout={logout} onRename={renameHousehold} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  // Manually compile the app source with the CLASSIC JSX runtime.
  // (Babel's default "automatic" runtime injects an ES `import` statement,
  // which fails in a plain, non-module <script> tag.)
  (function () {
    var src = document.getElementById("app-source").textContent;
    var compiled = Babel.transform(src, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    var s = document.createElement("script");
    s.textContent = compiled;
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
