  .center-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }

const fmt = (n) => (Math.round((n || 0) * 100) / 100).toLocaleString("fr-FR", { minimumFractionDigits: 0, maximumFractionDigits: 2 }) + " €";
function uid(prefix) { return prefix + "_" + Math.random().toString(36).slice(2, 9); }

// ---------- Bank label normalization (used for auto-categorization) ----------
// Lowercase, strip accents, turn punctuation into spaces: "Vétérinaire BKG*Hôtel" -> "veterinaire bkg hotel".
function normText(s) {
  return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
    .replace(/[^a-z0-9]+/g, " ").trim();
}
// Whole-word / whole-phrase match on normalized text, so "free" doesn't hit "freelance".
function hasWord(normalized, word) {
  const w = normText(word);
  return w !== "" && (" " + normalized + " ").includes(" " + w + " ");
}
// Operation-type prefixes banks prepend to the merchant name.
const LABEL_PREFIXES = /^(paiement par carte|paiement cb|carte|cb|prlv sepa|prlv|prelevement|vir sepa inst|vir sepa|vir inst|vir|virement|retrait dab|retrait|avoir|achat)\b\s*/;
// Kind of bank operation, from the label's prefix.
function operationType(label) {
  const s = normText(label);
  if (/^(prlv|prelevement)\b/.test(s)) return "debit";      // direct debit: usually a subscription/utility
  if (/^retrait\b/.test(s)) return "withdrawal";            // cash machine
  if (/^(vir|virement)\b/.test(s)) return "transfer";
  if (/^(carte|cb|paiement)\b/.test(s)) return "card";
  return "";
}
// Day of month from a bank date ("2026-09-12" or "12/09/2026"), or null.
function dayOfMonthFromDate(date) {
  const d = (date || "").trim();
  let m = d.match(/^\d{4}-\d{2}-(\d{2})/);
  if (!m) m = d.match(/^(\d{1,2})[\/.-]\d{1,2}/);
  const day = m ? parseInt(m[1], 10) : NaN;
  return day >= 1 && day <= 31 ? day : null;
}
// Bank date ("2026-09-12", "12/09/2026" or "12/09/26") -> days since epoch, or null.
function dateToDayNumber(date) {
  const d = (date || "").trim();
  let y, mo, da, m;
  if ((m = d.match(/^(\d{4})-(\d{2})-(\d{2})/))) [y, mo, da] = [+m[1], +m[2], +m[3]];
  else if ((m = d.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))) [da, mo, y] = [+m[1], +m[2], m[3].length === 2 ? 2000 + +m[3] : +m[3]];
  else return null;
  const t = Date.UTC(y, mo - 1, da);
  return isNaN(t) ? null : Math.round(t / 86400000);
}
// Amount search in the transaction list. Returns a test on the absolute
// amount, or null when the query isn't an amount:
//   "42"      -> 42.00 to 42.99       "42,10" -> exactly 42.10
//   ">100" / "<20" / ">=50"          "50-100" -> between 50 and 100
function parseAmountQuery(q) {
  const s = (q || "").replace(/\s|€/g, "").replace(/,/g, ".");
  const num = "(\\d+(?:\\.\\d{1,2})?)";
  let m;
  if ((m = s.match(new RegExp("^(>=|<=|>|<)" + num + "$")))) {
    const n = parseFloat(m[2]);
    return { ">": (a) => a > n, "<": (a) => a < n, ">=": (a) => a >= n, "<=": (a) => a <= n }[m[1]];
  }
  if ((m = s.match(new RegExp("^" + num + "-" + num + "$")))) {
    const lo = Math.min(parseFloat(m[1]), parseFloat(m[2])), hi = Math.max(parseFloat(m[1]), parseFloat(m[2]));
    return (a) => a >= lo - 0.005 && a <= hi + 0.005;
  }
  if ((m = s.match(new RegExp("^" + num + "$")))) {
    const n = parseFloat(m[1]);
    return m[1].includes(".") ? (a) => Math.abs(a - n) < 0.005 : (a) => Math.floor(a + 0.005) === n;
  }
  return null;
}

// Where an imported row's category came from (shown as a tooltip on its category).
const CATEGORY_SOURCE_LABELS = {
  manual: "Choisie par vous",
  rule: "Retenue d'après votre choix précédent pour ce marchand",
  fee: "D'après une charge récurrente correspondante",
  history: "D'après vos mois précédents pour ce marchand",
  bank: "D'après la catégorie de la banque",
  withdrawal: "Retrait d'espèces",
  keyword: "Devinée d'après le libellé — à vérifier",
};
const LABEL_NOISE_WORDS = new Set([
  "cb", "ref", "fact", "facture", "echeance", "le", "la", "les", "du", "de", "des", "at", "sa", "sas", "sarl",
  "janvier", "fevrier", "mars", "avril", "mai", "juin", "juillet", "aout", "septembre", "octobre", "novembre", "decembre",
]);
// Stable "merchant" key for a bank label: drops the operation prefix, dates,
// card numbers and references, keeps the first 3 meaningful words.
// "CARTE 12/09/26 CARREFOUR MARKET CB*1234" -> "carrefour market"
function merchantKey(label) {
  let s = (label || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  s = s.replace(/\b\d{1,2}[\/.-]\d{1,2}([\/.-]\d{2,4})?\b/g, " "); // dates
  s = normText(s);
  if (/^retrait\b/.test(s)) return "retrait dab"; // cash withdrawals: one key, not the ATM's city
  let prev;
  do { prev = s; s = s.replace(LABEL_PREFIXES, ""); } while (s !== prev);
  // Drop numbers/refs like "x1234", and noise words (incl. month names, so
  // "SALAIRE SEPTEMBRE" and "SALAIRE OCTOBRE" share the same key).
  const words = s.split(" ").filter((w) => w.length > 1 && !/\d/.test(w) && !LABEL_NOISE_WORDS.has(w));
  return words.slice(0, 3).join(" ");
}

const MONTH_NAMES_FR = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
// Best-effort "year-month" key parsed out of a free-text label like "Novembre 2026",
// used as a fallback for months that were never tagged with a real `date`.
function monthLabelToKey(label) {
  const l = (label || "").toLowerCase();
  const year = l.match(/\b(20\d{2})\b/);
  if (!year) return null;
  const monthIdx = MONTH_NAMES_FR.findIndex((name) => l.includes(name));
  if (monthIdx === -1) return null;
  return year[1] + "-" + String(monthIdx + 1).padStart(2, "0");
}
function monthSortKey(m) { return (m.date && m.date.slice(0, 7)) || monthLabelToKey(m.label); }
// Months with a resolvable date/label sort chronologically; months we can't date
// (e.g. an old freeform tab) are kept first, in their original relative order,
// since they predate the introduction of month-tagging.
function sortMonthsChronologically(list) {
  return list
    .map((m, i) => ({ m, i, key: monthSortKey(m) }))
    .sort((a, b) => {
      if (a.key && b.key) return a.key === b.key ? a.i - b.i : a.key < b.key ? -1 : 1;
      if (a.key || b.key) return a.key ? 1 : -1;
      return a.i - b.i;
    })
    .map((x) => x.m);
}

// ---------- Charts ----------
function BarChartCanvas({ data }) {
  const canvasRef = useRef(null); const chartRef = useRef(null);
  useEffect(() => {
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "bar",
      data: { labels: data.map((d) => d.name), datasets: [
        { label: "Budget", data: data.map((d) => d.Budget), backgroundColor: "#7C9473" },
        { label: "Réel", data: data.map((d) => d.Réel), backgroundColor: "#3F6B4A" },
      ]},
      options: { responsive: true, plugins: { legend: { labels: { font: { family: "IBM Plex Mono", size: 11 } } } },
        scales: { x: { ticks: { font: { family: "IBM Plex Mono", size: 9 }, maxRotation: 60, minRotation: 45 } }, y: { ticks: { font: { family: "IBM Plex Mono", size: 10 } } } } },
    });
    return () => chartRef.current && chartRef.current.destroy();
  }, [data]);
  return <canvas ref={canvasRef} height="110"></canvas>;
}
// Savings account balance at the end of each month.
function SavingsBalanceChart({ data }) {
  const canvasRef = useRef(null); const chartRef = useRef(null);
  useEffect(() => {
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "line",
      data: { labels: data.map((d) => d.label), datasets: [{ label: "Solde fin de mois", data: data.map((d) => d.balance),
        borderColor: "#3F6B4A", backgroundColor: "rgba(63,107,74,0.12)", fill: true, tension: 0.25, pointRadius: 3 }] },
      options: { responsive: true,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => `Solde : ${fmt(c.parsed.y)}` } } },
        scales: { x: { ticks: { font: { family: "IBM Plex Mono", size: 10 } } },
          y: { ticks: { font: { family: "IBM Plex Mono", size: 10 }, callback: (v) => fmt(v) } } } },
    });
    return () => chartRef.current && chartRef.current.destroy();
  }, [data]);
  return <canvas ref={canvasRef} height="80"></canvas>;
}

// Spending per month (savings and income excluded), selected month highlighted,
// with the total monthly budget as a dashed reference line.
function MonthlySpendChart({ data, budget, selectedName }) {
  const canvasRef = useRef(null); const chartRef = useRef(null);
  useEffect(() => {
    if (chartRef.current) chartRef.current.destroy();
    chartRef.current = new Chart(canvasRef.current, {
      type: "bar",
      data: { labels: data.map((d) => d.name), datasets: [
        { type: "bar", label: "Dépenses", data: data.map((d) => d.Dépenses), order: 2,
          backgroundColor: data.map((d) => (d.name === selectedName ? "#3F6B4A" : "#9DB39A")) },
        { type: "line", label: "Budget mensuel", data: data.map(() => budget), order: 1,
          borderColor: "#9B3D3D", borderDash: [6, 4], borderWidth: 1.5, pointRadius: 0, fill: false },

        plugins: {
          legend: { labels: { font: { family: "IBM Plex Mono", size: 11 } } },
          tooltip: { callbacks: { label: (c) => `${c.dataset.label} : ${fmt(c.parsed.y)}` } },

        scales: { x: { ticks: { font: { family: "IBM Plex Mono", size: 10 } } },

// ---------- Household create/join screen ----------
function HouseholdSetup({ session, onReady }) {
  const [mode, setMode] = useState("create");
  const [name, setName] = useState(""); const [code, setCode] = useState("");
  const [error, setError] = useState(""); const [busy, setBusy] = useState(false);

  const createHousehold = async (e) => {

    if (e1) { setError(e1.message); setBusy(false); return; }

  };

  const joinHousehold = async (e) => {
    e.preventDefault(); setError(""); setBusy(true);
    const { data: hh, error: e1 } = await sb.from("households").select("*").eq("invite_code", code.trim()).maybeSingle();
    if (e1 || !hh) { setError("Code d'invitation introuvable."); setBusy(false); return; }

  return (

          <button type="button" className={mode === "join" ? "active" : ""} onClick={() => setMode("join")}>Rejoindre avec un code</button>
        </div>
        {mode === "create" ? (
          <form onSubmit={createHousehold}>
            <div className="field"><label>Nom du foyer</label><input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="ex: Famille Massard" required /></div>
            <button className="btn" disabled={busy}>Créer</button>
          </form>
        ) : (
          <form onSubmit={joinHousehold}>
            <div className="field"><label>Code d'invitation</label><input type="text" value={code} onChange={(e) => setCode(e.target.value)} placeholder="ex: a1b2c3d4" required /></div>
            <button className="btn" disabled={busy}>Rejoindre</button>
          </form>
        )}
        {error && <p className="err">{error}</p>}
      </div>
    </div>
  );
}

// ---------- Main budget tracker (shared, per household) ----------
function BudgetTracker({ household, onLogout, onRename }) {
  const [loaded, setLoaded] = useState(false);
  const [categories, setCategories] = useState([]);
  const [months, setMonths] = useState([]);
  const [income, setIncome] = useState({});
  const [savings, setSavings] = useState({});
  const [actuals, setActuals] = useState({});
  const [transactions, setTransactions] = useState({}); // { [monthId]: [{id, date, label, amount, categoryId}] }
  const [recurringFees, setRecurringFees] = useState([]); // [{id, label, amount, dayOfMonth, categoryId}] — household-wide, not per-month
  const [categoryRules, setCategoryRules] = useState({}); // { [merchantKey]: categoryId } — learned from manual categorization
  // Savings accounts imported from their own bank CSV, kept apart from the budget:
  // { [accountKey]: { label, entries: [{ id, date, label, amount (+ = money in), balance|null, importSig }] } }
  const [savingsAccounts, setSavingsAccounts] = useState({});
  const [selectedMonth, setSelectedMonth] = useState(null);
  const [saveState, setSaveState] = useState("idle");
  const [showTransactions, setShowTransactions] = useState(true);
  const [showRecurringSection, setShowRecurringSection] = useState(false);
  const [showRecurringFees, setShowRecurringFees] = useState(true);
  // Transaction list: search (keyword or amount), category filter, sort.
  const [txQuery, setTxQuery] = useState("");
  const [txCatFilter, setTxCatFilter] = useState(""); // "" = all, "__none__" = uncategorized, else a category id
  const [txSort, setTxSort] = useState("default");
  const [openAutoDetails, setOpenAutoDetails] = useState({});
  const [showSavingsPanel, setShowSavingsPanel] = useState(true); // { salaire: bool, epargne: bool } — detail list under the "(auto)" lines
  const [dragCategoryId, setDragCategoryId] = useState(null);
  const [dragOverCategoryId, setDragOverCategoryId] = useState(null);
  const saveTimer = useRef(null);
  const csvInputRef = useRef(null);
  const lastMonthKey = "budget:lastMonth:" + household.id;

  useEffect(() => {
    (async () => {
      const { data, error } = await sb.from("household_budget").select("data").eq("household_id", household.id).maybeSingle();
      const doc = (data && data.data) || emptyBudgetDoc();
      // Drop data left behind by month tabs that no longer exist (tabs deleted
      // before deletion also removed their data), so it can't resurface or
      // interfere with imports. It's removed from storage on the next save.
      const liveMonths = new Set((doc.months || []).map((m) => m.id));
      const onlyLive = (obj) => Object.fromEntries(Object.entries(obj || {}).filter(([k]) => liveMonths.has(k)));
      doc.income = onlyLive(doc.income); doc.savings = onlyLive(doc.savings);
      const txs = onlyLive(doc.transactions);
      let acts = onlyLive(doc.actuals);

      // One-time migration: turn any legacy "manual total" numbers into a
      // real transaction line item, so everything lives in one unified list.
      if (!doc.migratedActuals) {
        const newTxs = { ...txs };
        const clearedActs = {};
        for (const m of Object.keys(acts)) {
          clearedActs[m] = {};
          for (const catId of Object.keys(acts[m] || {})) {
            const val = Number(acts[m][catId]) || 0;
            if (val !== 0) {
              newTxs[m] = [
                ...(newTxs[m] || []),
                { id: uid("legacy"), date: "", label: "Saisie manuelle (avant mise à jour)", amount: val, categoryId: catId },
              ];
            }
          }
        }
        acts = clearedActs;
        setTransactions(newTxs);
        setActuals(clearedActs);
      } else {
        setTransactions(txs);
        setActuals(acts);
      }

      setCategories(doc.categories); setMonths(sortMonthsChronologically(doc.months)); setIncome(doc.income);
      setSavings(doc.savings); setRecurringFees(doc.recurringFees || []); setCategoryRules(doc.categoryRules || {}); setSavingsAccounts(doc.savingsAccounts || {});
      const remembered = localStorage.getItem(lastMonthKey);
      const validMonth = doc.months.find((m) => m.id === remembered);
      setSelectedMonth((validMonth && validMonth.id) || doc.months[0]?.id || null);
      setLoaded(true);
    })();
  }, [household.id]);

  useEffect(() => {
    if (selectedMonth) localStorage.setItem(lastMonthKey, selectedMonth);
  }, [selectedMonth]);

  // Auto-detect/create a tab for the real current calendar month. Runs once
  // per app load, after the initial data has loaded.
  const autoMonthChecked = useRef(false);
  useEffect(() => {
    if (!loaded || autoMonthChecked.current) return;
    autoMonthChecked.current = true;

    const now = new Date();
    const currentKey = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
    const currentLabel = MONTH_NAMES_FR[now.getMonth()] + " " + now.getFullYear();

    // Already tagged with a real date matching this month? Nothing to do.
    if (months.some((m) => m.date && m.date.slice(0, 7) === currentKey)) return;

    // Not tagged, but a tab's NAME already looks like this month (e.g. the
    // user manually created/renamed one, with or without a year in the
    // label) — attach the date so future checks are reliable, without
    // creating a duplicate. Skip tabs that already have a *different* date.
    const monthNameLower = MONTH_NAMES_FR[now.getMonth()];
    const yearStr = String(now.getFullYear());
    const byLabel = months.find((m) => {
      if (m.date) return false;
      const l = m.label.toLowerCase();
      return l.includes(monthNameLower);
    }) || months.find((m) => !m.date && m.label.toLowerCase().includes(yearStr));
    if (byLabel) {
      setMonths((ms) => sortMonthsChronologically(ms.map((m) => (m.id === byLabel.id ? { ...m, date: currentKey + "-01" } : m))));
      return;
    }

    // Genuinely missing — create it and switch to it.
    const id = uid("month");
    const prevMonth = sortMonthsChronologically(months)[months.length - 1];
    const recurring = prevMonth
      ? (transactions[prevMonth.id] || []).filter((t) => t.recurring).map((t) => ({ ...t, id: uid("tx"), date: "" }))
      : [];
    setMonths((ms) => sortMonthsChronologically([...ms, { id, label: currentLabel, date: currentKey + "-01" }]));
    setIncome((inc) => ({ ...inc, [id]: [{ id: uid("inc"), label: "Revenu", amount: 0 }] }));
    setSavings((s) => ({ ...s, [id]: 0 }));
    setActuals((a) => ({ ...a, [id]: {} }));
    setTransactions((t) => ({ ...t, [id]: recurring }));
    setSelectedMonth(id);
  }, [loaded]);

  useEffect(() => {
    if (!loaded) return;
    setSaveState("saving");
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      const { error } = await sb.from("household_budget")
        .update({ data: { categories, months, income, savings, actuals, transactions, recurringFees, categoryRules, savingsAccounts, migratedActuals: true }, updated_at: new Date().toISOString() })
        .eq("household_id", household.id);
      setSaveState(error ? "error" : "saved");
    }, 500);
    return () => clearTimeout(saveTimer.current);
  }, [categories, months, income, savings, actuals, transactions, recurringFees, categoryRules, savingsAccounts, loaded]);

  // ---------- Undo ----------
  // Every change to the budget data pushes the previous state onto a stack.
  // Changes less than 1 s apart (typing "125" in an amount) count as ONE step.
  // Changes made automatically right after loading (e.g. creating this month's
  // tab) are not undoable. History lives in memory only (lost on reload).
  const undoStack = useRef([]);
  const lastSnapshot = useRef(null);
  const lastChangeAt = useRef(0);
  const restoringUndo = useRef(false);
  const undoReadyAt = useRef(0);
  const [undoCount, setUndoCount] = useState(0);
  useEffect(() => {
    if (!loaded) return;
    const snap = { categories, months, income, savings, actuals, transactions, recurringFees, categoryRules, savingsAccounts };
    const now = Date.now();
    if (!lastSnapshot.current) undoReadyAt.current = now + 1500;
    if (restoringUndo.current) {
      restoringUndo.current = false;
      lastSnapshot.current = snap;
      lastChangeAt.current = 0; // the next edit after an undo always starts a new step
      return;
    }
    if (lastSnapshot.current && now >= undoReadyAt.current && now - lastChangeAt.current > 1000) {
      undoStack.current = [...undoStack.current.slice(-49), lastSnapshot.current];
      setUndoCount(undoStack.current.length);
    }
    if (lastSnapshot.current) lastChangeAt.current = now;
    lastSnapshot.current = snap;
  }, [categories, months, income, savings, actuals, transactions, recurringFees, categoryRules, savingsAccounts, loaded]);

  const undo = () => {
    const prev = undoStack.current[undoStack.current.length - 1];
    if (!prev) return;
    undoStack.current = undoStack.current.slice(0, -1);
    setUndoCount(undoStack.current.length);
    restoringUndo.current = true;
    setCategories(prev.categories); setMonths(prev.months); setIncome(prev.income); setSavings(prev.savings);
    setActuals(prev.actuals); setTransactions(prev.transactions); setRecurringFees(prev.recurringFees); setCategoryRules(prev.categoryRules); setSavingsAccounts(prev.savingsAccounts || {});
    if (!prev.months.some((m) => m.id === selectedMonth)) setSelectedMonth(prev.months[0]?.id || null);
  };
  // Ctrl+Z / Cmd+Z undoes the last change (controlled inputs have no reliable native undo).
  const undoRef = useRef(undo);
  undoRef.current = undo;
  useEffect(() => {
    const onKey = (e) => {
      if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === "z") {
        if (undoStack.current.length === 0) return;
        e.preventDefault();
        undoRef.current();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const monthTransactions = (m) => transactions[m] || [];
  const categoryTotal = (m, catId) => monthTransactions(m).filter((t) => t.categoryId === catId).reduce((s, t) => s + t.amount, 0);

  // Salaire/Épargne are income & savings categories, not expense categories —
  // detected by name so this works whether they came from the default
  // template or were added manually by a household member.
  const salaireCat = categories.find((c) => c.name.toLowerCase().includes("salaire"));
  const epargneCat = categories.find((c) => { const n = c.name.toLowerCase(); return n.includes("épargne") || n.includes("epargne"); });
  const expenseCategories = categories.filter((c) => c.id !== salaireCat?.id && c.id !== epargneCat?.id);

  // Salaire transactions are money received (negative app-amount) — flip sign for income.
  const salaryFromTransactions = (m) => (salaireCat ? -categoryTotal(m, salaireCat.id) : 0);
  // Épargne transactions are money moved out to savings (positive app-amount) — add as-is.
  const epargneFromTransactions = (m) => (epargneCat ? categoryTotal(m, epargneCat.id) : 0);

  const monthIncome = (m) => (income[m] || []).reduce((s, l) => s + (Number(l.amount) || 0), 0) + salaryFromTransactions(m);
  const monthSavings = (m) => (Number(savings[m]) || 0) + epargneFromTransactions(m);
  const monthBudgetTotal = expenseCategories.reduce((s, c) => s + (Number(c.budget) || 0), 0);
  // Spending not (yet) in any category — no category, or one that was deleted.
  // Only money going out counts: an uncategorized incoming amount could be a
  // salary as well as a refund, so it isn't subtracted from spending.
  const uncategorizedSpent = (m) => monthTransactions(m)
    .filter((t) => !categories.some((c) => c.id === t.categoryId) && Number(t.amount) > 0)
    .reduce((s, t) => s + Number(t.amount), 0);
  const monthActualTotal = (m) => expenseCategories.reduce((s, c) => s + categoryTotal(m, c.id), 0) + uncategorizedSpent(m);
  const monthRestant = (m) => monthIncome(m) - monthActualTotal(m) - monthSavings(m);


  const updateCategoryBudget = (id, v) => setCategories((cs) => cs.map((c) => (c.id === id ? { ...c, budget: v } : c)));
  const renameCategory = (id, name) => setCategories((cs) => cs.map((c) => (c.id === id ? { ...c, name } : c)));
  const addCategory = () => setCategories((cs) => [...cs, { id: uid("cat"), name: "Nouvelle catégorie", budget: 0 }]);
  const removeCategory = (id) => {
    setCategories((cs) => cs.filter((c) => c.id !== id));
    setActuals((a) => { const next = { ...a }; for (const m of Object.keys(next)) { const { [id]: _, ...rest } = next[m] || {}; next[m] = rest; } return next; });
    setTransactions((t) => {
      const next = {};
      for (const m of Object.keys(t)) next[m] = (t[m] || []).map((tx) => (tx.categoryId === id ? { ...tx, categoryId: "" } : tx));
      return next;
    });
  };
  const moveCategory = (id, direction) => {
    setCategories((cs) => {
      const idx = cs.findIndex((c) => c.id === id);
      const swapIdx = idx + direction;
      if (idx === -1 || swapIdx < 0 || swapIdx >= cs.length) return cs;
      const next = [...cs];
      [next[idx], next[swapIdx]] = [next[swapIdx], next[idx]];
      return next;
    });
  };
  const reorderCategory = (draggedId, targetId) => {
    if (!draggedId || draggedId === targetId) return;
    setCategories((cs) => {
      const next = [...cs];
      const fromIdx = next.findIndex((c) => c.id === draggedId);
      const toIdx = next.findIndex((c) => c.id === targetId);
      if (fromIdx === -1 || toIdx === -1) return cs;
      const [moved] = next.splice(fromIdx, 1);
      next.splice(toIdx, 0, moved);
      return next;
    });
  };
  const addMonth = () => {
    const label = window.prompt("Nom du nouveau mois (ex: Novembre 2026)"); if (!label) return;
    const id = uid("month");
    const prevMonth = sortMonthsChronologically(months)[months.length - 1];
    const recurring = prevMonth
      ? (transactions[prevMonth.id] || []).filter((t) => t.recurring).map((t) => ({ ...t, id: uid("tx"), date: "" }))
      : [];
    const key = monthLabelToKey(label);
    setMonths((ms) => sortMonthsChronologically([...ms, key ? { id, label, date: key + "-01" } : { id, label }]));
    setIncome((inc) => ({ ...inc, [id]: [{ id: uid("inc"), label: "Revenu", amount: 0 }] }));
    setSavings((s) => ({ ...s, [id]: 0 })); setActuals((a) => ({ ...a, [id]: {} }));
    setTransactions((t) => ({ ...t, [id]: recurring }));
    setSelectedMonth(id);
  };
  // Deleting a tab deletes its transactions too (before, they stayed hidden in
  // the data and blocked re-importing the same lines). "Annuler" restores both.
  const removeMonth = (id) => {
    const m = months.find((x) => x.id === id);
    const n = (transactions[id] || []).length;
    if (!window.confirm(
      `Êtes-vous sûr de vouloir supprimer l'onglet « ${m?.label || ""} » ?\n\n` +
      `Tout ce qui lui est lié sera supprimé : ${n} transaction(s), revenus et épargne du mois.\n` +
      `(Vous pourrez encore revenir en arrière avec « ↶ Annuler » tant que la page reste ouverte.)`
    )) return;
    // Remove every piece of data keyed by this month, not just the tab.
    const without = (obj) => { const { [id]: _, ...rest } = obj || {}; return rest; };
    setMonths((ms) => ms.filter((x) => x.id !== id));
    setTransactions(without);
    setIncome(without);
    setSavings(without);
    setActuals(without);
    if (selectedMonth === id) { const rest = months.filter((m) => m.id !== id); if (rest.length) setSelectedMonth(rest[0].id); }
  };
  const [editingMonthId, setEditingMonthId] = useState(null);
  const [editingMonthLabel, setEditingMonthLabel] = useState("");
  const [editingName, setEditingName] = useState(false);
  const [nameDraft, setNameDraft] = useState("");
  const startEditMonth = (id) => {
    const current = months.find((m) => m.id === id);
    setEditingMonthId(id);
    setEditingMonthLabel(current ? current.label : "");
  };
  const commitEditMonth = () => {
    const label = editingMonthLabel.trim();
    if (label) setMonths((ms) => ms.map((m) => (m.id === editingMonthId ? { ...m, label } : m)));
    setEditingMonthId(null);
  };
  const cancelEditMonth = () => setEditingMonthId(null);
  const updateIncomeLine = (m, lineId, field, v) => setIncome((inc) => ({ ...inc, [m]: (inc[m] || []).map((l) => (l.id === lineId ? { ...l, [field]: v } : l)) }));
  const addIncomeLine = (m) => setIncome((inc) => ({ ...inc, [m]: [...(inc[m] || []), { id: uid("inc"), label: "Nouveau revenu", amount: 0 }] }));
  const removeIncomeLine = (m, lineId) => setIncome((inc) => ({ ...inc, [m]: (inc[m] || []).filter((l) => l.id !== lineId) }));
  const updateSavings = (m, v) => setSavings((s) => ({ ...s, [m]: v }));

  // ---------- CSV import (bank statement) ----------
  const [importSummary, setImportSummary] = useState(null); // transient success message after an import

  // Imported CSV files are kept (table household_imports) so they can be
  // downloaded again later. The list is loaded without the file contents;
  // a file's content is only fetched when it's downloaded.
  const [importFiles, setImportFiles] = useState([]);
  const [showImportFiles, setShowImportFiles] = useState(false);
  const loadImportFiles = async () => {
    const { data, error } = await sb.from("household_imports")
      .select("id, file_name, month_id, imported_count, skipped_count, created_at")
      .eq("household_id", household.id).order("created_at", { ascending: false });
    if (!error) setImportFiles(data || []);
  };
  useEffect(() => { loadImportFiles(); }, [household.id]);
  const saveImportFile = async (fileName, content, monthId, importedCount, skippedCount) => {
    const { error } = await sb.from("household_imports").insert({
      household_id: household.id, month_id: monthId, file_name: fileName, content,
      imported_count: importedCount, skipped_count: skippedCount,
    });
    if (error) setImportSummary((msg) => (msg || "") + " ⚠ Le fichier CSV n'a pas pu être archivé.");
    loadImportFiles();
  };
  const downloadImportFile = async (f) => {
    const { data, error } = await sb.from("household_imports").select("content").eq("id", f.id).maybeSingle();
    if (error || !data) { window.alert("Téléchargement impossible."); return; }
    const blob = new Blob([data.content], { type: "text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = f.file_name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const deleteImportFile = async (f) => {
    if (!window.confirm(`Supprimer le fichier « ${f.file_name} » ? (Les transactions importées restent.)`)) return;
    const { error } = await sb.from("household_imports").delete().eq("id", f.id);
    if (error) { window.alert("Suppression impossible."); return; }
    setImportFiles((fs) => fs.filter((x) => x.id !== f.id));
  };

  // Keyword fallback. Matching is on whole words of the normalized label
  // (accents/punctuation stripped), so "free" doesn't match "freelance" and
  // "total" doesn't match "totalenergies". Order matters: first rule wins, so
  // more specific phrases (e.g. "amazon prime") come before generic ones ("amazon").
  // Resolves a target category: by one of our known default ids first, else by
  // the category's NAME (accents/case ignored), so renamed, deleted-and-recreated
  // or user-added categories are still found.
  const findCategoryId = (ids, names) => {
    const byId = categories.find((c) => ids.includes(c.id));
    if (byId) return byId.id;
    const byName = categories.find((c) => (names || []).some((n) => normText(c.name).includes(normText(n))));
    return byName ? byName.id : "";
  };

  const guessCategoryId = (label, amount) => {
    const l = normText(label);
    const rules = [
      { ids: ["electricite"], names: ["electricite", "energie", "gaz"], words: ["edf", "engie", "totalenergies electricite", "totalenergies elec", "ekwateur", "enercoop"] },
      { ids: ["essence"], names: ["essence", "carburant"], words: ["total", "totalenergies", "esso", "shell", "bp", "avia", "station", "station service", "carburant"] },
      { ids: ["voiture_entretien"], names: ["entretien", "garage"], words: ["car wash", "garage", "vidange", "pneu", "pneus", "norauto", "feu vert", "midas", "speedy"] },
      { ids: ["internet"], names: ["internet", "telephone", "mobile", "box"], words: ["free", "free mobile", "freebox", "orange", "sfr", "bouygues", "bouygues telecom", "sosh", "red by sfr"] },
      { ids: ["netflix"], names: ["netflix", "abonnement", "streaming"], words: ["netflix", "prime video", "amazon prime", "spotify", "disney", "disney plus", "deezer", "canal"] },
      { ids: ["resto"], names: ["resto", "restaurant", "sorties"], words: ["restaurant", "resto", "brasserie", "uber eats", "deliveroo", "cafe", "mcdonald", "mcdonalds", "burger king", "kfc", "boulangerie"] },
      { ids: ["weekends"], names: ["weekend", "vacances", "voyage"], words: ["hotel", "booking com", "bkg", "airbnb", "camping", "sncf", "ouigo"] },
      { ids: ["alimentation"], names: ["alimentation", "courses", "supermarche"], words: ["carrefour", "leclerc", "monoprix", "auchan", "lidl", "franprix", "intermarche", "supermarche", "super u", "hyper u", "casino supermarche", "geant casino", "casino shop", "petit casino", "picard", "aldi", "boucherie", "amazon"] },
      { ids: ["assurance_habitation"], names: ["assurance habitation"], words: ["assurance habitation", "maif", "macif", "matmut"] },
      { ids: ["voiture_assurance"], names: ["assurance voiture", "voiture assurance", "assurance auto"], words: ["assurance auto", "assurance vehicule"] },
      { ids: ["sante"], names: ["sante", "medical", "pharmacie"], words: ["pharmacie", "pharma", "medecin", "docteur", "dentiste", "optique", "opticien", "audition", "laboratoire", "kine"] },
      { ids: ["pets"], names: ["pets", "animaux", "chien", "chat", "veto"], words: ["veto", "veterinaire", "clinique veterinaire", "maxizoo", "animalerie", "wanimo", "zooplus", "truffaut"] },
    ];
    for (const rule of rules) {
      if (rule.words.some((w) => hasWord(l, w))) {
        const id = findCategoryId(rule.ids, rule.names);
        if (id) return id;
      }
    }

    // Match by category NAME (not id) for things like Salaire/Épargne, since
    // these are often user-added categories with a random internal id rather
    // than one of our known default ids above.
    const findByName = (needle) => categories.find((c) => normText(c.name).includes(needle));
    // Salary is money received (negative in the app's sign convention) — never guess it for a spending.
    if (amount < 0 && ["salaire", "paie", "paye"].some((w) => hasWord(l, w))) {
      const cat = findByName("salaire");
      if (cat) return cat.id;
    }
    if (["epargne", "livret a", "livret", "ldd", "ldds", "lep", "pel"].some((w) => hasWord(l, w))) {
      const cat = findByName("epargne");
      if (cat) return cat.id;
    }

    return "";
  };

  // Learned categories: explicit rules (categoryRules, saved when the user
  // picks a category by hand) and history — the category most often used for
  // each merchant in past months. Categories that no longer exist are ignored.
  const categoryExists = (id) => !!id && categories.some((c) => c.id === id);
  const buildHistoryIndex = () => {
    const counts = {}; // { [key]: { [catId]: n } }
    for (const txs of months.map((m) => transactions[m.id])) {
      for (const tx of txs || []) {
        if (!tx.categoryId) continue;
        const key = merchantKey(tx.label);
        if (!key) continue;
        counts[key] = counts[key] || {};
        counts[key][tx.categoryId] = (counts[key][tx.categoryId] || 0) + 1;
      }
    }
    const best = {};
    for (const [key, byCat] of Object.entries(counts)) {
      const [catId] = Object.entries(byCat).filter(([id]) => categoryExists(id)).sort((a, b) => b[1] - a[1])[0] || [];
      if (catId) best[key] = catId;
    }
    return best;
  };

  // A transaction matches a recurring fee when the amounts agree (±5%, at
  // least ±1 €) and the labels share a meaningful word. For a direct debit
  // (PRLV) whose amount matches ONE fee almost exactly (±1%), the amount alone
  // is enough — bank labels for direct debits are often cryptic.
  const feeAmountClose = (fee, amount, tolerance) => {
    const fa = Number(fee.amount) || 0;
    return fa > 0 && amount > 0 && Math.abs(amount - fa) <= Math.max(1, fa * tolerance);
  };
  const feeLabelOverlap = (fee, label) => {
    const txWords = new Set(normText(label).split(" "));
    return merchantKey(fee.label).split(" ").some((w) => w.length >= 3 && txWords.has(w));
  };
  const matchRecurringFee = (label, amount) => {
    const fees = recurringFees.filter((f) => categoryExists(f.categoryId));
    const byLabel = fees.find((f) => feeAmountClose(f, amount, 0.05) && feeLabelOverlap(f, label));
    if (byLabel) return byLabel;
    if (operationType(label) === "debit") {
      const byAmount = fees.filter((f) => (Number(f.amount) || 0) > 0 && Math.abs(amount - Number(f.amount)) <= Number(f.amount) * 0.01);
      if (byAmount.length === 1) return byAmount[0];
    }
    return null;
  };

  // Categories for a cash withdrawal, matched by the category's NAME (user-created).
  const withdrawalCategoryId = () => {
    const cat = categories.find((c) => ["retrait", "espece", "liquide", "cash"].some((w) => normText(c.name).includes(w)));
    return cat ? cat.id : "";
  };

  // BoursoBank (and similar exports) tag each transaction with their OWN
  // category — far more reliable than guessing from the merchant name.
  // Each entry: bank category phrases (compared without accents/case, and
  // matching when the bank's label CONTAINS the phrase) -> our category, by id
  // or by name. Anything not listed falls back to guessCategoryId() on the label.
  const BANK_CATEGORY_MAP = [
    { bank: ["alimentation", "supermarche", "hypermarche"], ids: ["alimentation"], names: ["alimentation", "courses"] },
    { bank: ["carburant", "essence"], ids: ["essence"], names: ["essence", "carburant"] },
    { bank: ["entretien reparation", "entretien vehicule", "pieces auto"], ids: ["voiture_entretien"], names: ["entretien"] },
    { bank: ["peage", "parking", "stationnement"], ids: ["voiture_entretien"], names: ["peage", "parking", "transport", "voiture"] },
    { bank: ["transports", "transport en commun", "train", "taxi vtc"], ids: [], names: ["transport"] },
    { bank: ["hebergement", "hotel", "voyage", "vacances"], ids: ["weekends"], names: ["weekend", "vacances", "voyage"] },
    { bank: ["loyers charges", "loyer"], ids: ["loyer"], names: ["loyer"] },
    { bank: ["restaurants bars", "restauration rapide", "restaurant"], ids: ["resto"], names: ["resto", "restaurant"] },
    { bank: ["optique audition", "pharmacie", "medecin", "sante", "dentiste", "hopital", "mutuelle"], ids: ["sante"], names: ["sante"] },
    { bank: ["electricite gaz", "electricite", "energie", "gaz"], ids: ["electricite"], names: ["electricite", "energie"] },
    { bank: ["eau"], ids: ["eau"], names: ["eau"] },
    { bank: ["telephonie", "internet", "telephone"], ids: ["internet"], names: ["internet", "telephone"] },
    { bank: ["abonnement", "multimedia", "streaming"], ids: ["netflix"], names: ["netflix", "abonnement"] },
    { bank: ["assurance habitation"], ids: ["assurance_habitation"], names: ["assurance habitation"] },
    { bank: ["assurance vehicule", "assurance auto"], ids: ["voiture_assurance"], names: ["voiture assurance", "assurance voiture"] },
    { bank: ["animaux", "veterinaire"], ids: ["pets"], names: ["pets", "animaux"] },
    { bank: ["cadeaux", "dons"], ids: ["cadeaux"], names: ["cadeau"] },
    { bank: ["bricolage", "jardinage", "equipement maison", "ameublement", "travaux"], ids: ["travaux"], names: ["travaux", "maison"] },
    { bank: ["impots", "taxe fonciere"], ids: ["taxe_fonciere"], names: ["taxe", "impot"] },
    { bank: ["credit immobilier", "pret immobilier", "emprunt"], ids: ["emprunt"], names: ["emprunt", "credit"] },
    { bank: ["salaires", "salaire", "revenus du travail"], ids: ["salaire"], names: ["salaire"] },
    { bank: ["epargne", "placement", "livret"], ids: ["epargne"], names: ["epargne"] },
    { bank: ["retrait", "especes"], ids: [], names: ["retrait", "espece", "liquide", "cash"] },
  ];
  const bankCategoryId = (bankCat) => {
    const b = normText(bankCat);
    if (!b) return "";
    for (const entry of BANK_CATEGORY_MAP) {
      if (entry.bank.some((phrase) => hasWord(b, phrase))) {
        const id = findCategoryId(entry.ids, entry.names);
        if (id) return id;
      }
    }
    return "";
  };

  // ---------- Duplicate detection (same date + same amount + same label) ----------
  const normLabel = (s) => (s || "").trim().toLowerCase();
  const isDuplicateOf = (a, b) =>
    (a.date || "").trim() === (b.date || "").trim() &&
    Math.abs((Number(a.amount) || 0) - (Number(b.amount) || 0)) < 0.005 &&
    normLabel(a.label) === normLabel(b.label);
  const signatureOf = (t) => (t.date || "").trim() + "|" + (Number(t.amount) || 0).toFixed(2) + "|" + normLabel(t.label);

  const findDuplicateInMonth = (m, candidate, excludeId) =>
    (transactions[m] || []).find((tx) => tx.id !== excludeId && isDuplicateOf(tx, candidate));

  const parseCsv = (text, targetMonth) => {
    text = text.replace(/^\uFEFF/, ""); // strip UTF-8 BOM some bank exports include
    const lines = text.split(/\r\n|\n/).filter((l) => l.trim().length > 0);
    if (lines.length < 2) return [];
    const delim = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ";" : ",";
    const splitLine = (line) => line.split(delim).map((c) => c.trim().replace(/^"|"$/g, ""));
    const header = splitLine(lines[0]).map((h) => h.toLowerCase());
    const dateIdx = header.findIndex((h) => h.includes("date"));
    const labelIdx = header.findIndex((h) => h.includes("label") || h.includes("libell"));
    // BoursoBank confusingly calls the transaction amount column "Solde" (normally
    // "balance") — and repeats "Solde" again later for the real running balance.
    // findIndex takes the FIRST match, which is correctly the transaction amount.
    const amountIdx = header.findIndex((h) => h.includes("amount") || h.includes("montant") || h.includes("solde"));
    // Optional: the bank's own category column, if present (used for auto-categorization below).
    const bankCatIdx = header.findIndex((h) => ["catégorie", "categorie", "category"].includes(h));
    const bankParentIdx = header.findIndex((h) => ["catégorie parent", "categorie parent", "categoryparent"].includes(h));
    if (dateIdx === -1 || labelIdx === -1 || amountIdx === -1) return "invalid";

    // Re-importing is always safe: a statement exported on the 10th and another
    // on the 28th overlap, and the overlap is skipped. Each file row is matched
    // against ONE transaction already saved (in any month), so two genuine
    // same-day, same-amount purchases in the file are still both imported if
    // only one was saved before. Saved rows are compared on their ORIGINAL
    // bank data (importSig), so renaming/fixing an imported row doesn't make
    // it come back — while a row you deleted is simply missing, and is
    // imported again.
    // Pass 1 matches exact bank data; pass 2 catches small changes between two
    // exports (e.g. a pending card payment whose date or label settled
    // differently): same amount, same merchant, dates within 3 days.
    // Only month tabs that still exist count: a deleted tab's rows are gone
    // from view, so the same lines must be importable again.
    const pool = [];
    for (const m of months) {
      for (const tx of transactions[m.id] || []) {
        pool.push({ sig: tx.importSig || signatureOf(tx), amount: Number(tx.amount) || 0, key: merchantKey(tx.label), day: dateToDayNumber(tx.date), claimed: false });
      }
    }
    const claimExact = (sig) => {
      const hit = pool.find((p) => !p.claimed && p.sig === sig);
      if (hit) hit.claimed = true;
      return !!hit;
    };
    const claimFuzzy = (c) => {
      const key = merchantKey(c.label), day = dateToDayNumber(c.date);
      if (!key || day === null) return false;
      const hit = pool.find((p) => !p.claimed && p.key === key && p.day !== null && Math.abs(p.day - day) <= 3 && Math.abs(p.amount - c.amount) < 0.005);
      if (hit) hit.claimed = true;
      return !!hit;
    };
    const history = buildHistoryIndex();

    const candidates = [];
    for (let i = 1; i < lines.length; i++) {
      const cells = splitLine(lines[i]);
      if (cells.length <= Math.max(dateIdx, labelIdx, amountIdx)) continue;
      const rawAmount = (cells[amountIdx] || "").replace(/\s/g, "").replace(",", ".");
      const amount = parseFloat(rawAmount);
      if (isNaN(amount)) continue;
      // Sign convention in the app: positive = money spent, negative = money
      // received. The bank's sign is the opposite (negative = spent), so flip it.
      const label = cells[labelIdx] || "(sans libellé)";
      const bankCat = bankCatIdx !== -1 ? (cells[bankCatIdx] || "").trim() : "";
      const bankParent = bankParentIdx !== -1 ? (cells[bankParentIdx] || "").trim() : "";
      candidates.push({ date: cells[dateIdx] || "", label, amount: -amount, bankCat, bankParent });
    }
    for (const c of candidates) c.duplicate = claimExact(signatureOf(c));
    for (const c of candidates) if (!c.duplicate) c.duplicate = claimFuzzy(c);

    const rows = [];
    for (const candidate of candidates) {
      const { label, bankCat, duplicate: isDup } = candidate;
      // Priority: explicit rule > matching recurring fee > history > bank's own category > type/keyword guess.
      const key = merchantKey(label);
      const fee = isDup ? null : matchRecurringFee(label, candidate.amount);
      // Each source is tried in order; the first that gives a category wins and
      // is recorded, so uncertain guesses can be flagged for review.
      const sources = isDup ? [] : [
        ["rule", () => categoryExists(categoryRules[key]) && categoryRules[key]],
        ["fee", () => fee && fee.categoryId],
        ["history", () => history[key]],
        ["bank", () => bankCategoryId(bankCat) || bankCategoryId(candidate.bankParent)],
        ["withdrawal", () => operationType(label) === "withdrawal" && withdrawalCategoryId()],
        ["keyword", () => guessCategoryId(label, candidate.amount)],
      ];
      let categoryId = "", categorySource = "";
      for (const [src, get] of sources) {
        const id = get();
        if (id) { categoryId = id; categorySource = src; break; }
      }
      rows.push({
        id: uid("tx"),
        date: candidate.date,
        label,
        amount: candidate.amount,
        categoryId,
        ...(categorySource ? { categorySource } : {}),
        importSig: signatureOf(candidate), // original bank data, kept even if the row is edited later
        ...(fee && fee.categoryId === categoryId ? { feeId: fee.id } : {}),
        duplicate: isDup,
      });
    }
    return rows;
  };

  // ---------- Savings account import (separate from the budget) ----------
  const savingsInputRef = useRef(null);
  const parseNumber = (v) => parseFloat(String(v || "").replace(/[\s\u00a0\u202f]/g, "").replace(",", "."));
  const parseSavingsCsv = (text) => {
    text = text.replace(/^\uFEFF/, "");
    const lines = text.split(/\r\n|\n/).filter((l) => l.trim().length > 0);
    if (lines.length < 2) return "invalid";
    const delim = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ";" : ",";
    const split = (line) => line.split(delim).map((c) => c.trim().replace(/^"|"$/g, ""));
    const header = split(lines[0]).map((h) => h.toLowerCase());
    const dateIdx = header.findIndex((h) => h.includes("date"));
    const labelIdx = header.findIndex((h) => (h.includes("libell") || h === "label") && !h.includes("compte") && !h.includes("sugg"));
    const amountIdx = header.findIndex((h) => h.includes("montant") || h === "amount" || h.includes("solde"));
    // BoursoBank: the 1st "Solde" column is the amount, the 2nd one the account balance after that day.
    const balanceIdx = header.findIndex((h, i) => i !== amountIdx && (h.includes("solde") || h.includes("balance")));
    const accNumIdx = header.findIndex((h) => h.includes("numéro compte") || h.includes("numero compte") || h === "accountnum");
    const accLabelIdx = header.findIndex((h) => h.includes("libellé compte") || h.includes("libelle compte") || h === "accountlabel");
    if (dateIdx === -1 || labelIdx === -1 || amountIdx === -1) return "invalid";
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const c = split(lines[i]);
      const amount = parseNumber(c[amountIdx]);
      if (isNaN(amount) || !c[dateIdx]) continue;
      const balance = balanceIdx !== -1 ? parseNumber(c[balanceIdx]) : NaN;
      const label = c[labelIdx] || "(sans libellé)";
      rows.push({
        account: (accNumIdx !== -1 && c[accNumIdx]) || (accLabelIdx !== -1 && c[accLabelIdx]) || "epargne",
        accountLabel: (accLabelIdx !== -1 && c[accLabelIdx]) || "Compte d'épargne",
        date: c[dateIdx], label, amount, balance: isNaN(balance) ? null : balance,
        importSig: c[dateIdx] + "|" + amount.toFixed(2) + "|" + label.trim().toLowerCase(),
      });
    }
    return rows;
  };
  const handleSavingsFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const content = ev.target.result;
      const rows = parseSavingsCsv(content);
      if (rows === "invalid" || rows.length === 0) {
        window.alert("Colonnes attendues introuvables (date, libellé, montant). Vérifiez le fichier exporté de votre compte d'épargne.");
        return;
      }
      // Re-importing is safe: each line already saved (same date, amount and label) is skipped once.
      let added = 0, skipped = 0;
      const next = { ...savingsAccounts };
      for (const r of rows) {
        const acc = next[r.account] ? { ...next[r.account], entries: [...next[r.account].entries] } : { label: r.accountLabel, entries: [] };
        next[r.account] = acc;
        acc._pool = acc._pool || acc.entries.map((x) => x.importSig);
        const hit = acc._pool.indexOf(r.importSig);
        if (hit !== -1) { acc._pool.splice(hit, 1); skipped++; continue; }
        acc.entries.push({ id: uid("sav"), date: r.date, label: r.label, amount: r.amount, balance: r.balance, importSig: r.importSig });
        added++;
      }
      for (const k of Object.keys(next)) delete next[k]._pool;
      setSavingsAccounts(next);
      setImportSummary(`Épargne : ${added} opération(s) importée(s)` + (skipped ? `, ${skipped} déjà présente(s) ignorée(s)` : "") + ". Voir « Comptes d'épargne ».");
      setShowSavingsPanel(true);
      saveImportFile(file.name, content, null, added, skipped);
    };
    reader.readAsText(file, "utf-8");
    e.target.value = "";
  };
  const removeSavingsAccount = (key) => {
    const acc = savingsAccounts[key];
    if (!window.confirm(`Êtes-vous sûr de vouloir supprimer le compte d'épargne « ${acc?.label || key} » et ses ${acc?.entries.length || 0} opération(s) ? (Annulable avec « ↶ Annuler »)`)) return;
    setSavingsAccounts((a) => { const { [key]: _, ...rest } = a; return rest; });
  };
  // Month-by-month summary of one savings account: money in, money out,
  // interest, end-of-month balance and change. The balance comes from the
  // bank's balance column when present (last day of the month), otherwise it
  // is computed by adding up the operations from 0. Months without any
  // operation are filled in with the previous balance.
  const savingsMonthly = (entries) => {
    const withDay = entries.map((e) => ({ ...e, day: dateToDayNumber(e.date) })).filter((e) => e.day !== null).sort((a, b) => a.day - b.day);
    if (withDay.length === 0) return { months: [], fromBank: false };
    const fromBank = withDay.some((e) => typeof e.balance === "number");
    const keyOf = (day) => { const d = new Date(day * 86400000); return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0"); };
    const byMonth = {};
    let running = 0;
    for (const e of withDay) {
      const k = keyOf(e.day);
      const m = (byMonth[k] = byMonth[k] || { in: 0, out: 0, interest: 0, balance: null, lastDay: -Infinity });
      if (e.amount >= 0) m.in += e.amount; else m.out += -e.amount;
      if (e.amount > 0 && /int[ée]r[êe]ts?/i.test(e.label)) m.interest += e.amount;
      running += e.amount;
      if (fromBank) { if (typeof e.balance === "number" && e.day >= m.lastDay) { m.balance = e.balance; m.lastDay = e.day; } }
      else m.balance = running;
    }
    const keys = Object.keys(byMonth).sort();
    const [y0, m0] = keys[0].split("-").map(Number);
    const [y1, m1] = keys[keys.length - 1].split("-").map(Number);
    const out = [];
    let prevBalance = null;
    for (let y = y0, mo = m0; y < y1 || (y === y1 && mo <= m1); mo === 12 ? (y++, mo = 1) : mo++) {
      const k = y + "-" + String(mo).padStart(2, "0");
      const m = byMonth[k] || { in: 0, out: 0, interest: 0, balance: null };
      const balance = m.balance !== null ? m.balance : prevBalance;
      const name = MONTH_NAMES_FR[mo - 1];
      out.push({ key: k, label: name.charAt(0).toUpperCase() + name.slice(1) + " " + y, in: m.in, out: m.out, interest: m.interest,
        balance, change: balance !== null && prevBalance !== null ? balance - prevBalance : null });
      if (balance !== null) prevBalance = balance;
    }
    return { months: out, fromBank };
  };

  const handleCsvFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const targetMonth = selectedMonth; // capture now — shouldn't drift if the user switches tabs before the read finishes
    const targetLabel = months.find((m) => m.id === targetMonth)?.label || targetMonth;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const content = ev.target.result;
      const parsed = parseCsv(content, targetMonth);
      if (parsed === "invalid") {
        window.alert("Colonnes attendues introuvables (date, libellé/label, montant). Vérifiez le format du fichier exporté.");
        return;
      }
      const dupCount = parsed.filter((r) => r.duplicate).length;
      const newRows = parsed.filter((r) => !r.duplicate).map(({ duplicate, ...r }) => r);

      // Each row goes to the month tab matching ITS date (a statement from
      // 28/08 to 30/09 fills both August and September, whichever tab is
      // open). A missing month tab is created. Rows without a readable date
      // go to the open tab.
      const tabForKey = {};
      for (const m of months) {
        const key = monthSortKey(m);
        if (key && !tabForKey[key]) tabForKey[key] = m.id;
      }
      const newTabs = [];
      const byMonth = {}; // { [monthId]: rows }
      for (const row of newRows) {
        const dayNum = dateToDayNumber(row.date);
        let monthId = targetMonth;
        if (dayNum !== null) {
          const d = new Date(dayNum * 86400000);
          const key = d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0");
          if (!tabForKey[key]) {
            const name = MONTH_NAMES_FR[d.getUTCMonth()];
            const tab = { id: uid("month"), label: name.charAt(0).toUpperCase() + name.slice(1) + " " + d.getUTCFullYear(), date: key + "-01" };
            tabForKey[key] = tab.id;
            newTabs.push(tab);
          }
          monthId = tabForKey[key];
        }
        (byMonth[monthId] = byMonth[monthId] || []).push(row);
      }
      if (newTabs.length) {
        setMonths((ms) => sortMonthsChronologically([...ms, ...newTabs]));
        setIncome((inc) => ({ ...inc, ...Object.fromEntries(newTabs.map((t) => [t.id, []])) }));
        setSavings((sv) => ({ ...sv, ...Object.fromEntries(newTabs.map((t) => [t.id, 0])) }));
        setActuals((a) => ({ ...a, ...Object.fromEntries(newTabs.map((t) => [t.id, {}])) }));
      }
      // Save straight away — no in-memory-only review step, so nothing is
      // lost if the tab gets reloaded or discarded before you're done
      // reviewing. Categorize/fix rows afterward in "Transactions" below.
      setTransactions((t) => {
        const next = { ...t };
        for (const [monthId, rows] of Object.entries(byMonth)) next[monthId] = [...(next[monthId] || []), ...rows];
        return next;
      });
      const labelOf = (id) => newTabs.find((t) => t.id === id)?.label || months.find((m) => m.id === id)?.label || id;
      const perMonth = Object.entries(byMonth)
        .map(([id, rows]) => `${rows.length} en ${labelOf(id)}${newTabs.some((t) => t.id === id) ? " (onglet créé)" : ""}`)
        .join(", ");
      setImportSummary(
        `${newRows.length} transaction(s) importée(s)` + (perMonth ? ` : ${perMonth}` : ` pour ${targetLabel}`) +
        (dupCount > 0 ? `, ${dupCount} déjà importée(s) ignorée(s)` : "") +
        (newRows.some((r) => r.categorySource === "keyword") ? `, ${newRows.filter((r) => r.categorySource === "keyword").length} catégorie(s) devinée(s) marquée(s) « ? » à vérifier` : "") +
        `. Vérifiez/complétez leur catégorie ci-dessous dans « Transactions ».`
      );
      setShowTransactions(true);
      saveImportFile(file.name, content, targetMonth, newRows.length, dupCount);
    };
    reader.readAsText(file, "utf-8");
    e.target.value = "";
  };

  // ---------- Transaction log (editable, per month) ----------
  const [txErrors, setTxErrors] = useState({}); // { [txId]: "error message" }, kept for inline highlight too

  const flagTxError = (txId, message) => {
    window.alert(message);
    setTxErrors((e) => ({ ...e, [txId]: message }));
    setTimeout(() => setTxErrors((e) => { const { [txId]: _, ...rest } = e; return rest; }), 6000);
  };

  const updateTransactionCategory = (m, txId, catId) => {
    if (catId === "__new__") {
      const name = window.prompt("Nom de la nouvelle catégorie ?");
      if (!name) return;
      const newId = uid("cat");
      setCategories((cs) => [...cs, { id: newId, name, budget: 0 }]);
      catId = newId;
    }
    // Remember this choice for the merchant, so future imports categorize it
    // automatically, and fill in other still-uncategorized rows of the same
    // merchant this month. Already-categorized rows are left untouched.
    const tx = (transactions[m] || []).find((x) => x.id === txId);
    const key = tx ? merchantKey(tx.label) : "";
    if (key) {
      setCategoryRules((r) => {
        const { [key]: _, ...rest } = r;
        return catId ? { ...rest, [key]: catId } : rest;
      });
    }
    setTransactions((t) => ({
      ...t,
      [m]: (t[m] || []).map((x) => {
        if (x.id === txId) return { ...x, categoryId: catId, categorySource: "manual" };
        if (catId && key && !x.categoryId && !x.recurring && merchantKey(x.label) === key) return { ...x, categoryId: catId, categorySource: "rule" };
        return x;
      }),
    }));
  };
  const updateTransactionField = (m, txId, field, value) => {
    const current = (transactions[m] || []).find((tx) => tx.id === txId);
    if (!current) return;
    const candidate = { ...current, [field]: value };
    const isComplete = (candidate.date || "").trim() !== "" && Number(candidate.amount) !== 0 && (candidate.label || "").trim() !== "";
    if (isComplete) {
      const dup = findDuplicateInMonth(m, candidate, txId);
      if (dup) {
        flagTxError(txId, "⚠️ Doublon : une dépense identique (même date, même montant, même libellé) existe déjà — modification bloquée.");
        return; // block the change
      }
    }
    setTransactions((t) => ({ ...t, [m]: (t[m] || []).map((tx) => (tx.id === txId ? candidate : tx)) }));
  };
  const removeTransaction = (m, txId) =>
    setTransactions((t) => ({ ...t, [m]: (t[m] || []).filter((tx) => tx.id !== txId) }));
  const addManualTransaction = (m) =>
    setTransactions((t) => ({ ...t, [m]: [...(t[m] || []), { id: uid("tx"), date: "", label: "Nouvelle dépense", amount: 0, categoryId: "" }] }));
  const toggleRecurring = (m, txId) =>
    setTransactions((t) => ({ ...t, [m]: (t[m] || []).map((tx) => (tx.id === txId ? { ...tx, recurring: !tx.recurring } : tx)) }));

  // ---------- Recurring fees (household-wide schedule, not tied to a specific month) ----------
  const addRecurringFee = () =>
    setRecurringFees((fs) => [...fs, { id: uid("fee"), label: "Nouvelle charge", amount: 0, dayOfMonth: 1, categoryId: "" }]);
  const updateRecurringFee = (id, field, value) =>
    setRecurringFees((fs) => fs.map((f) => (f.id === id ? { ...f, [field]: value } : f)));
  const removeRecurringFee = (id) => setRecurringFees((fs) => fs.filter((f) => f.id !== id));
  // Turn an imported direct debit into a recurring fee (label, amount, day and
  // category taken from the transaction) and link the transaction to it.
  const createFeeFromTransaction = (m, tx) => {
    const key = merchantKey(tx.label);
    const feeLabel = key ? key.replace(/\b\w/g, (c) => c.toUpperCase()) : tx.label;
    const fee = { id: uid("fee"), label: feeLabel, amount: Math.abs(Number(tx.amount) || 0), dayOfMonth: dayOfMonthFromDate(tx.date) || 1, categoryId: tx.categoryId || "" };
    setRecurringFees((fs) => [...fs, fee]);
    setTransactions((t) => ({ ...t, [m]: (t[m] || []).map((x) => (x.id === tx.id ? { ...x, feeId: fee.id } : x)) }));
    setShowRecurringFees(true);
  };
  // Direct debits not yet covered by a recurring fee: suggest adding one.
  const suggestsRecurringFee = (tx) =>
    operationType(tx.label) === "debit" && tx.amount > 0 && !tx.recurring &&
    !(tx.feeId && recurringFees.some((f) => f.id === tx.feeId)) &&
    !recurringFees.some((f) => feeAmountClose(f, tx.amount, 0.05) && feeLabelOverlap(f, tx.label));


  if (!loaded || !selectedMonth) return <div style={{ padding: 40 }}>Chargement du budget…</div>;

  const commitNameEdit = () => {
    const name = nameDraft.trim();
    if (name && name !== household.name) onRename(name);
    setEditingName(false);
  };

  const barData = expenseCategories.map((c) => ({ name: c.name.length > 14 ? c.name.slice(0, 13) + "…" : c.name, Budget: Number(c.budget) || 0, Réel: categoryTotal(selectedMonth, c.id) }));
  const sortedMonths = sortMonthsChronologically(months);
  const spendData = sortedMonths.map((m) => ({ name: m.label, Dépenses: Math.round(monthActualTotal(m.id) * 100) / 100 }));
  const curIncomeLines = income[selectedMonth] || [];
  const curIncomeTotal = monthIncome(selectedMonth);
  const curActualTotal = monthActualTotal(selectedMonth);
  const curManualSavings = Number(savings[selectedMonth]) || 0;
  const curSavingsFromCategory = epargneFromTransactions(selectedMonth);
  const curSavings = monthSavings(selectedMonth);
  const curRestant = monthRestant(selectedMonth);
  const curMonthLabel = months.find((m) => m.id === selectedMonth)?.label;

  // Recurring fees: for each one, check whether a real transaction already
  // exists in its category for the selected month — that's a genuine
  // confirmation, not just a date-based guess. The calendar day is only used
  // as a fallback to flag "expected but not seen yet" vs "not due yet".
  const today = new Date();
  const todayKey = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0");
  const selectedMonthObj = months.find((m) => m.id === selectedMonth);
  const isRealCurrentMonth = selectedMonthObj?.date?.slice(0, 7) === todayKey;
  const todayDay = today.getDate();

  const feeStatus = (f) => {
    const matched = monthTransactions(selectedMonth).some((t) => t.feeId === f.id || (f.categoryId && t.categoryId === f.categoryId));
    if (matched) return "confirmed";
    if (isRealCurrentMonth) return (Number(f.dayOfMonth) || 1) <= todayDay ? "overdue" : "upcoming";
    return "unmatched";
  };
  // Detail list under an "(auto)" total: the transactions of this month in that
  // category. `sign` flips amounts so they read the same way as the total
  // (salary is stored negative = money received).
  const renderAutoDetails = (catId, sign) => {
    const txs = monthTransactions(selectedMonth).filter((t) => t.categoryId === catId);
    return (
      <div style={{ padding: "2px 16px 10px 34px", fontSize: 12, color: "var(--ink-soft)" }}>
        {txs.length === 0 ? (
          <div>Aucune transaction dans cette catégorie ce mois-ci.</div>
        ) : txs.map((t) => (
          <div key={t.id} style={{ display: "flex", gap: 10, padding: "3px 0", borderBottom: "1px dotted var(--rule)" }}>
            <span style={{ width: 84, flexShrink: 0 }}>{t.date || "—"}</span>
            <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={t.label}>{t.label}</span>
            <span style={{ fontFamily: "var(--font-mono)", whiteSpace: "nowrap" }}>{fmt(sign * (Number(t.amount) || 0))}</span>
          </div>
        ))}
      </div>
    );
  };
  const confirmedFees = recurringFees.filter((f) => feeStatus(f) === "confirmed");
  const outstandingFees = recurringFees.filter((f) => feeStatus(f) !== "confirmed");
  const confirmedTotal = confirmedFees.reduce((s, f) => s + (f.categoryId ? categoryTotal(selectedMonth, f.categoryId) : Number(f.amount) || 0), 0);
  const outstandingTotal = outstandingFees.reduce((s, f) => s + (Number(f.amount) || 0), 0);

  return (
    <div className="ledger">
      <div className="ledger-head">
        <div>
          {editingName ? (
            <input
              autoFocus
              className="title-edit-input"
              value={nameDraft}
              onChange={(e) => setNameDraft(e.target.value)}
              onBlur={commitNameEdit}
              onKeyDown={(e) => {
                if (e.key === "Enter") commitNameEdit();
                if (e.key === "Escape") setEditingName(false);
              }}
            />
          ) : (
            <h1 className="ledger-title" style={{ display: "inline", cursor: "pointer" }} title="Cliquer pour renommer" onClick={() => { setNameDraft(household.name); setEditingName(true); }}>
              {household.name} <span style={{ fontSize: 14, color: "var(--ink-soft)" }}>✎</span>
            </h1>
          )}
          <div className="ledger-sub">Revenus, épargne et dépenses — partagé et modifiable en direct</div>
        </div>
        <div className="head-actions">
          <input ref={csvInputRef} type="file" accept=".csv,text/csv" onChange={handleCsvFile} style={{ display: "none" }} />
          <button className="reset-btn" onClick={undo} disabled={undoCount === 0} style={{ opacity: undoCount === 0 ? 0.4 : 1, cursor: undoCount === 0 ? "default" : "pointer" }} title="Annuler la dernière modification (Ctrl+Z / ⌘Z)">
            ↶ Annuler{undoCount > 0 ? ` (${undoCount})` : ""}
          </button>
          <span className="save-pill">{saveState === "saving" ? "Enregistrement…" : saveState === "error" ? "Erreur d'enregistrement" : "Enregistré"}</span>
          <span className="invite-pill">Code d'invitation : <span className="invite-code">{household.invite_code}</span></span>
          <button className="logout-btn" onClick={onLogout}>Se déconnecter</button>
        </div>
      </div>

      {importSummary && (
        <div className="import-summary" style={{ maxWidth: 900, margin: "0 auto 16px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, border: "1px solid var(--rule)" }}>
          <span>{importSummary}</span>
          <button className="add-line" style={{ display: "inline", padding: 0, whiteSpace: "nowrap" }} onClick={() => setImportSummary(null)}>Fermer ✕</button>
        </div>
      )}

      <div className="tabs">
        {sortedMonths.map((m) => (
          <div
            key={m.id}
            className={"tab" + (m.id === selectedMonth ? " active" : "")}
            onClick={() => { if (editingMonthId !== m.id) setSelectedMonth(m.id); }}
            onDoubleClick={(e) => { e.stopPropagation(); startEditMonth(m.id); }}
            title="Double-cliquer pour renommer"
          >
            {editingMonthId === m.id ? (
              <input
                autoFocus
                className="tab-edit-input"
                value={editingMonthLabel}
                onClick={(e) => e.stopPropagation()}
                onChange={(e) => setEditingMonthLabel(e.target.value)}
                onBlur={commitEditMonth}
                onKeyDown={(e) => {
                  if (e.key === "Enter") commitEditMonth();
                  if (e.key === "Escape") cancelEditMonth();
                }}
              />
            ) : (
              <React.Fragment>
                {m.label}
                <span className="tab-remove" style={{ color: "var(--ink-soft)" }} onClick={(e) => { e.stopPropagation(); startEditMonth(m.id); }}>✎</span>
              </React.Fragment>
            )}
            {months.length > 1 && editingMonthId !== m.id && <span className="tab-remove" onClick={(e) => { e.stopPropagation(); removeMonth(m.id); }}>✕</span>}
          </div>
        ))}
        <button className="tab-add" onClick={addMonth} title="Ajouter un mois">+</button>
        <button
          className="tab-add"
          style={{ color: "var(--ink-soft)", marginLeft: "auto" }}
          onClick={() => csvInputRef.current && csvInputRef.current.click()}
          title={`Importer un relevé CSV pour ${curMonthLabel}`}
        >
          ⭱ Importer
        </button>
      </div>

      <div className="panel">
        <div className="panel-title">Revenus — {curMonthLabel}</div>
        {curIncomeLines.map((l) => (
          <div className="row" key={l.id}>
            <input type="text" value={l.label} onChange={(e) => updateIncomeLine(selectedMonth, l.id, "label", e.target.value)} />
            <input type="number" value={l.amount} onChange={(e) => updateIncomeLine(selectedMonth, l.id, "amount", parseFloat(e.target.value) || 0)} />
            <button className="icon-btn" onClick={() => removeIncomeLine(selectedMonth, l.id)}>✕</button>
          </div>
        ))}
        {salaireCat && (
          <React.Fragment>
            <div className="row" style={{ cursor: "pointer" }} onClick={() => setOpenAutoDetails((o) => ({ ...o, salaire: !o.salaire }))}>
              <span style={{ fontStyle: "italic", color: "var(--ink-soft)" }} title={`Total automatique des transactions catégorisées « ${salaireCat.name} » — cliquer pour voir le détail`}>
                {openAutoDetails.salaire ? "▾" : "▸"} {salaireCat.name} (auto)
              </span>
              <span style={{ textAlign: "right", fontFamily: "var(--font-mono)", color: "var(--ink-soft)" }}>{fmt(salaryFromTransactions(selectedMonth))}</span>
              <span></span>
            </div>
            {openAutoDetails.salaire && renderAutoDetails(salaireCat.id, -1)}
          </React.Fragment>
        )}
        <button className="add-line" onClick={() => addIncomeLine(selectedMonth)}>+ Ajouter une ligne de revenu</button>
        <div className="totals-row"><span>Total revenus</span><span>{fmt(curIncomeTotal)}</span></div>
      </div>

      <div className="panel">
        <div className="panel-title">Épargne mise de côté</div>
        <div className="row" style={{ gridTemplateColumns: "1fr 140px" }}>
          <span>Montant épargné ce mois-ci (manuel)</span>
          <input type="number" value={curManualSavings} onChange={(e) => updateSavings(selectedMonth, parseFloat(e.target.value) || 0)} />
        </div>
        {epargneCat && (
          <React.Fragment>
            <div className="row" style={{ gridTemplateColumns: "1fr 140px", cursor: "pointer" }} onClick={() => setOpenAutoDetails((o) => ({ ...o, epargne: !o.epargne }))}>
              <span style={{ fontStyle: "italic", color: "var(--ink-soft)" }} title={`Total automatique des transactions catégorisées « ${epargneCat.name} » — cliquer pour voir le détail`}>
                {openAutoDetails.epargne ? "▾" : "▸"} {epargneCat.name} (auto)
              </span>
              <span style={{ textAlign: "right", fontFamily: "var(--font-mono)", color: "var(--ink-soft)" }}>{fmt(curSavingsFromCategory)}</span>
            </div>
            {openAutoDetails.epargne && renderAutoDetails(epargneCat.id, 1)}
          </React.Fragment>
        )}
        <div className="totals-row"><span>Total épargne</span><span>{fmt(curSavings)}</span></div>
      </div>

      <div className="panel">
        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <span style={{ cursor: "pointer" }} onClick={() => setShowSavingsPanel((v) => !v)}>
            Comptes d'épargne — évolution {showSavingsPanel ? "▲" : "▼"}
          </span>
          <input ref={savingsInputRef} type="file" accept=".csv,text/csv" onChange={handleSavingsFile} style={{ display: "none" }} />
          <button className="reset-btn" onClick={() => savingsInputRef.current && savingsInputRef.current.click()} title="Importer l'export CSV de votre compte d'épargne (Livret A, LDDS…)">
            ⭱ Importer un relevé d'épargne
          </button>
        </div>
        {showSavingsPanel && (
          Object.keys(savingsAccounts).length === 0 ? (
            <div className="import-hint" style={{ padding: 16 }}>
              Importez l'export CSV de votre compte d'épargne (même format que le compte courant). Vous verrez le solde et les mouvements mois par mois. Ces opérations restent séparées du budget.
            </div>
          ) : (
            Object.entries(savingsAccounts).map(([key, acc]) => {
              const { months: rows, fromBank } = savingsMonthly(acc.entries);
              const last = [...rows].reverse().find((r) => r.balance !== null);
              const first = rows.find((r) => r.balance !== null);
              return (
                <div key={key} style={{ padding: "12px 16px", borderBottom: "1px solid var(--rule)" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
                    <strong style={{ fontFamily: "var(--font-display)", fontSize: 16 }}>{acc.label}</strong>
                    <span style={{ fontSize: 12, color: "var(--ink-soft)" }}>
                      Solde : <strong style={{ color: "var(--ink)" }}>{last ? fmt(last.balance) : "—"}</strong>
                      {first && last && first !== last && (
                        <span style={{ color: last.balance - first.balance >= 0 ? "var(--green)" : "var(--red)" }}>
                          {" "}({last.balance - first.balance >= 0 ? "+" : ""}{fmt(last.balance - first.balance)} depuis {first.label.toLowerCase()})
                        </span>
                      )}
                      {" · "}
                      <button className="btn-link" style={{ marginTop: 0, fontSize: 11 }} onClick={() => removeSavingsAccount(key)}>supprimer</button>
                    </span>
                  </div>
                  {rows.length > 1 && <SavingsBalanceChart data={rows.filter((r) => r.balance !== null)} />}
                  <div style={{ overflowX: "auto", marginTop: 8 }}>
                    <table style={{ width: "100%", fontSize: 12 }}>
                      <thead><tr><th>Mois</th><th className="num">Entrées</th><th className="num">Sorties</th><th className="num">dont intérêts</th><th className="num">Solde fin de mois</th><th className="num">Variation</th></tr></thead>
                      <tbody>
                        {[...rows].reverse().map((r) => (
                          <tr key={r.key}>
                            <td>{r.label}</td>
                            <td className="num" style={{ color: r.in ? "var(--green)" : "var(--ink-soft)" }}>{r.in ? "+" + fmt(r.in) : "—"}</td>
                            <td className="num" style={{ color: r.out ? "var(--red)" : "var(--ink-soft)" }}>{r.out ? "−" + fmt(r.out) : "—"}</td>
                            <td className="num">{r.interest ? fmt(r.interest) : "—"}</td>
                            <td className="num"><strong>{r.balance !== null ? fmt(r.balance) : "—"}</strong></td>
                            <td className={"num " + (r.change === null ? "" : r.change >= 0 ? "diff-pos" : "diff-neg")}>{r.change === null ? "—" : (r.change >= 0 ? "+" : "") + fmt(r.change)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                  {!fromBank && (
                    <div className="import-hint">Le fichier ne contient pas de colonne de solde : le solde est calculé en additionnant les opérations à partir de 0.</div>
                  )}
                </div>
              );
            })
          )
        )}
      </div>

      <div className="panel">
        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }} onClick={() => setShowRecurringFees((v) => !v)}>
          <span>Charges récurrentes (prélèvements prévus) — {recurringFees.length}</span>
          <span style={{ fontSize: 12, color: "var(--gold)" }}>{showRecurringFees ? "Masquer ▲" : "Voir / modifier ▼"}</span>
        </div>
        {showRecurringFees && (
          <React.Fragment>
            {recurringFees.map((f) => {
              const status = feeStatus(f);
              const catName = categories.find((c) => c.id === f.categoryId)?.name;
              const statusIcon =
                status === "confirmed" ? <span title={`Confirmé — transaction trouvée dans « ${catName} » ce mois-ci`} style={{ color: "var(--green)" }}>✓</span> :
                status === "overdue" ? <span title="Le jour est passé mais aucune transaction trouvée dans cette catégorie — pas encore importée, ou en retard" style={{ color: "var(--red)" }}>⚠</span> :
                status === "upcoming" ? <span title="Pas encore dû ce mois-ci" style={{ color: "var(--gold)" }}>⏳</span> :
                <span title="Pas encore de transaction correspondante ce mois-ci" style={{ color: "var(--ink-soft)" }}>·</span>;
              return (
                <div className="row" key={f.id} style={{ gridTemplateColumns: "1fr 90px 140px 110px 32px" }}>
                  <input type="text" value={f.label} onChange={(e) => updateRecurringFee(f.id, "label", e.target.value)} />
                  <input type="number" value={f.amount} onChange={(e) => updateRecurringFee(f.id, "amount", parseFloat(e.target.value) || 0)} />
                  <select value={f.categoryId} onChange={(e) => updateRecurringFee(f.id, "categoryId", e.target.value)} style={{ fontFamily: "var(--font-mono)", fontSize: 12, padding: 4, border: "1px solid var(--rule)", borderRadius: 3, background: "#fff" }}>
                    <option value="">— Catégorie —</option>
                    {categories.map((c) => (<option key={c.id} value={c.id}>{c.name}</option>))}
                  </select>
                  <div style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 12, color: "var(--ink-soft)" }}>
                    le
                    <input
                      type="number" min="1" max="31"
                      style={{ width: 40, fontFamily: "var(--font-mono)", fontSize: 12, border: "1px solid var(--rule)", borderRadius: 3, padding: 4, textAlign: "center" }}
                      value={f.dayOfMonth}
                      onChange={(e) => updateRecurringFee(f.id, "dayOfMonth", Math.min(31, Math.max(1, parseInt(e.target.value) || 1)))}
                    />
                    {statusIcon}
                  </div>
                  <button className="icon-btn" onClick={() => removeRecurringFee(f.id)}>✕</button>
                </div>
              );
            })}
            <button className="add-line" onClick={addRecurringFee}>+ Ajouter une charge récurrente</button>
            {recurringFees.length > 0 && (
              <div className="import-hint" style={{ padding: "8px 16px 12px" }}>
                <strong style={{ color: "var(--green)" }}>{fmt(confirmedTotal)}</strong> confirmée(s) par une vraie transaction ({confirmedFees.length}) · <strong style={{ color: "var(--gold)" }}>{fmt(outstandingTotal)}</strong> pas encore vue(s) ({outstandingFees.length}). Dès qu'une transaction apparaît dans la catégorie liée (import ou saisie manuelle), la charge passe automatiquement en « confirmé ».
              </div>
            )}
          </React.Fragment>
