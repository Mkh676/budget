  };

  // Learned categories: explicit rules (categoryRules, saved when the user
  // picks a category by hand) and history — the category most often used for
  // each merchant in past months. Categories that no longer exist are ignored.
  const categoryExists = (id) => !!id && categories.some((c) => c.id === id);
  const buildHistoryIndex = () => {
    const counts = {}; // { [key]: { [catId]: n } }
    for (const txs of months.map((m) => transactions[m.id])) {
      for (const tx of txs || []) {
        if (!tx.categoryId) continue;
        const key = merchantKey(tx.label);
        if (!key) continue;
        counts[key] = counts[key] || {};
        counts[key][tx.categoryId] = (counts[key][tx.categoryId] || 0) + 1;
      }
    }
    const best = {};
    for (const [key, byCat] of Object.entries(counts)) {
      const [catId] = Object.entries(byCat).filter(([id]) => categoryExists(id)).sort((a, b) => b[1] - a[1])[0] || [];
      if (catId) best[key] = catId;
    }
    return best;
  };

  // A transaction matches a recurring fee when the amounts agree (±5%, at
  // least ±1 €) and the labels share a meaningful word. For a direct debit
  // (PRLV) whose amount matches ONE fee almost exactly (±1%), the amount alone
  // is enough — bank labels for direct debits are often cryptic.
  const feeAmountClose = (fee, amount, tolerance) => {
    const fa = Number(fee.amount) || 0;
    return fa > 0 && amount > 0 && Math.abs(amount - fa) <= Math.max(1, fa * tolerance);
  };
  const feeLabelOverlap = (fee, label) => {
    const txWords = new Set(normText(label).split(" "));
    return merchantKey(fee.label).split(" ").some((w) => w.length >= 3 && txWords.has(w));
  };
  const matchRecurringFee = (label, amount) => {
    const fees = recurringFees.filter((f) => categoryExists(f.categoryId));
    const byLabel = fees.find((f) => feeAmountClose(f, amount, 0.05) && feeLabelOverlap(f, label));
    if (byLabel) return byLabel;
    if (operationType(label) === "debit") {
      const byAmount = fees.filter((f) => (Number(f.amount) || 0) > 0 && Math.abs(amount - Number(f.amount)) <= Number(f.amount) * 0.01);
      if (byAmount.length === 1) return byAmount[0];
    }
    return null;
  };

  // Categories for a cash withdrawal, matched by the category's NAME (user-created).
  const withdrawalCategoryId = () => {
    const cat = categories.find((c) => ["retrait", "espece", "liquide", "cash"].some((w) => normText(c.name).includes(w)));
    return cat ? cat.id : "";
  };

  // BoursoBank (and similar exports) tag each transaction with their OWN
  // category — far more reliable than guessing from the merchant name.
  // Each entry: bank category phrases (compared without accents/case, and
  // matching when the bank's label CONTAINS the phrase) -> our category, by id
  // or by name. Anything not listed falls back to guessCategoryId() on the label.
  const BANK_CATEGORY_MAP = [
    { bank: ["alimentation", "supermarche", "hypermarche"], ids: ["alimentation"], names: ["alimentation", "courses"] },
    { bank: ["carburant", "essence"], ids: ["essence"], names: ["essence", "carburant"] },
    { bank: ["entretien reparation", "entretien vehicule", "pieces auto"], ids: ["voiture_entretien"], names: ["entretien"] },
    { bank: ["peage", "parking", "stationnement"], ids: ["voiture_entretien"], names: ["peage", "parking", "transport", "voiture"] },
    { bank: ["transports", "transport en commun", "train", "taxi vtc"], ids: [], names: ["transport"] },
    { bank: ["hebergement", "hotel", "voyage", "vacances"], ids: ["weekends"], names: ["weekend", "vacances", "voyage"] },
    { bank: ["loyers charges", "loyer"], ids: ["loyer"], names: ["loyer"] },
    { bank: ["restaurants bars", "restauration rapide", "restaurant"], ids: ["resto"], names: ["resto", "restaurant"] },
    { bank: ["optique audition", "pharmacie", "medecin", "sante", "dentiste", "hopital", "mutuelle"], ids: ["sante"], names: ["sante"] },
    { bank: ["electricite gaz", "electricite", "energie", "gaz"], ids: ["electricite"], names: ["electricite", "energie"] },
    { bank: ["eau"], ids: ["eau"], names: ["eau"] },
    { bank: ["telephonie", "internet", "telephone"], ids: ["internet"], names: ["internet", "telephone"] },
    { bank: ["abonnement", "multimedia", "streaming"], ids: ["netflix"], names: ["netflix", "abonnement"] },
    { bank: ["assurance habitation"], ids: ["assurance_habitation"], names: ["assurance habitation"] },
    { bank: ["assurance vehicule", "assurance auto"], ids: ["voiture_assurance"], names: ["voiture assurance", "assurance voiture"] },
    { bank: ["animaux", "veterinaire"], ids: ["pets"], names: ["pets", "animaux"] },
    { bank: ["cadeaux", "dons"], ids: ["cadeaux"], names: ["cadeau"] },
    { bank: ["bricolage", "jardinage", "equipement maison", "ameublement", "travaux"], ids: ["travaux"], names: ["travaux", "maison"] },
    { bank: ["impots", "taxe fonciere"], ids: ["taxe_fonciere"], names: ["taxe", "impot"] },
    { bank: ["credit immobilier", "pret immobilier", "emprunt"], ids: ["emprunt"], names: ["emprunt", "credit"] },
    { bank: ["salaires", "salaire", "revenus du travail"], ids: ["salaire"], names: ["salaire"] },
    { bank: ["epargne", "placement", "livret"], ids: ["epargne"], names: ["epargne"] },
    { bank: ["retrait", "especes"], ids: [], names: ["retrait", "espece", "liquide", "cash"] },
  ];
  const bankCategoryId = (bankCat) => {
    const b = normText(bankCat);
    if (!b) return "";
    for (const entry of BANK_CATEGORY_MAP) {
      if (entry.bank.some((phrase) => hasWord(b, phrase))) {
        const id = findCategoryId(entry.ids, entry.names);
        if (id) return id;
      }
    }
    return "";
  };

  // ---------- Duplicate detection (same date + same amount + same label) ----------
  const normLabel = (s) => (s || "").trim().toLowerCase();
  const isDuplicateOf = (a, b) =>
    (a.date || "").trim() === (b.date || "").trim() &&
    Math.abs((Number(a.amount) || 0) - (Number(b.amount) || 0)) < 0.005 &&
    normLabel(a.label) === normLabel(b.label);
  const signatureOf = (t) => (t.date || "").trim() + "|" + (Number(t.amount) || 0).toFixed(2) + "|" + normLabel(t.label);

  const findDuplicateInMonth = (m, candidate, excludeId) =>
    (transactions[m] || []).find((tx) => tx.id !== excludeId && isDuplicateOf(tx, candidate));

  const parseCsv = (text, targetMonth) => {
    text = text.replace(/^\uFEFF/, ""); // strip UTF-8 BOM some bank exports include
    const lines = text.split(/\r\n|\n/).filter((l) => l.trim().length > 0);
    if (lines.length < 2) return [];
    const delim = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ";" : ",";
    const splitLine = (line) => line.split(delim).map((c) => c.trim().replace(/^"|"$/g, ""));
    const header = splitLine(lines[0]).map((h) => h.toLowerCase());
    const dateIdx = header.findIndex((h) => h.includes("date"));
    const labelIdx = header.findIndex((h) => h.includes("label") || h.includes("libell"));
    // BoursoBank confusingly calls the transaction amount column "Solde" (normally
    // "balance") — and repeats "Solde" again later for the real running balance.
    // findIndex takes the FIRST match, which is correctly the transaction amount.
    const amountIdx = header.findIndex((h) => h.includes("amount") || h.includes("montant") || h.includes("solde"));
    // Optional: the bank's own category column, if present (used for auto-categorization below).
    const bankCatIdx = header.findIndex((h) => ["catégorie", "categorie", "category"].includes(h));
    const bankParentIdx = header.findIndex((h) => ["catégorie parent", "categorie parent", "categoryparent"].includes(h));
    if (dateIdx === -1 || labelIdx === -1 || amountIdx === -1) return "invalid";

    // Re-importing is always safe: a statement exported on the 10th and another
    // on the 28th overlap, and the overlap is skipped. Each file row is matched
    // against ONE transaction already saved (in any month), so two genuine
    // same-day, same-amount purchases in the file are still both imported if
    // only one was saved before. Saved rows are compared on their ORIGINAL
    // bank data (importSig), so renaming/fixing an imported row doesn't make
    // it come back — while a row you deleted is simply missing, and is
    // imported again.
    // Pass 1 matches exact bank data; pass 2 catches small changes between two
    // exports (e.g. a pending card payment whose date or label settled
    // differently): same amount, same merchant, dates within 3 days.
    // Only month tabs that still exist count: a deleted tab's rows are gone
    // from view, so the same lines must be importable again.
    const pool = [];
    for (const m of months) {
      for (const tx of transactions[m.id] || []) {
        pool.push({ sig: tx.importSig || signatureOf(tx), amount: Number(tx.amount) || 0, key: merchantKey(tx.label), day: dateToDayNumber(tx.date), claimed: false });
      }
    }
    const claimExact = (sig) => {
      const hit = pool.find((p) => !p.claimed && p.sig === sig);
      if (hit) hit.claimed = true;
      return !!hit;
    };
    const claimFuzzy = (c) => {
      const key = merchantKey(c.label), day = dateToDayNumber(c.date);
      if (!key || day === null) return false;
      const hit = pool.find((p) => !p.claimed && p.key === key && p.day !== null && Math.abs(p.day - day) <= 3 && Math.abs(p.amount - c.amount) < 0.005);
      if (hit) hit.claimed = true;
      return !!hit;
    };
    const history = buildHistoryIndex();

    const candidates = [];
    for (let i = 1; i < lines.length; i++) {
      const cells = splitLine(lines[i]);
      if (cells.length <= Math.max(dateIdx, labelIdx, amountIdx)) continue;
      const rawAmount = (cells[amountIdx] || "").replace(/\s/g, "").replace(",", ".");
      const amount = parseFloat(rawAmount);
      if (isNaN(amount)) continue;
      // Sign convention in the app: positive = money spent, negative = money
      // received. The bank's sign is the opposite (negative = spent), so flip it.
      const label = cells[labelIdx] || "(sans libellé)";
      const bankCat = bankCatIdx !== -1 ? (cells[bankCatIdx] || "").trim() : "";
      const bankParent = bankParentIdx !== -1 ? (cells[bankParentIdx] || "").trim() : "";
      candidates.push({ date: cells[dateIdx] || "", label, amount: -amount, bankCat, bankParent });
    }
    for (const c of candidates) c.duplicate = claimExact(signatureOf(c));
    for (const c of candidates) if (!c.duplicate) c.duplicate = claimFuzzy(c);

    const rows = [];
    for (const candidate of candidates) {
      const { label, bankCat, duplicate: isDup } = candidate;
      // Priority: explicit rule > matching recurring fee > history > bank's own category > type/keyword guess.
      const key = merchantKey(label);
      const fee = isDup ? null : matchRecurringFee(label, candidate.amount);
      // Each source is tried in order; the first that gives a category wins and
      // is recorded, so uncertain guesses can be flagged for review.
      const sources = isDup ? [] : [
        ["rule", () => categoryExists(categoryRules[key]) && categoryRules[key]],
        ["fee", () => fee && fee.categoryId],
        ["history", () => history[key]],
        ["bank", () => bankCategoryId(bankCat) || bankCategoryId(candidate.bankParent)],
        ["withdrawal", () => operationType(label) === "withdrawal" && withdrawalCategoryId()],
        ["keyword", () => guessCategoryId(label, candidate.amount)],
      ];
      let categoryId = "", categorySource = "";
      for (const [src, get] of sources) {
        const id = get();
        if (id) { categoryId = id; categorySource = src; break; }
      }
      rows.push({
        id: uid("tx"),
        date: candidate.date,
        label,
        amount: candidate.amount,
        categoryId,
        ...(categorySource ? { categorySource } : {}),
        importSig: signatureOf(candidate), // original bank data, kept even if the row is edited later
        ...(fee && fee.categoryId === categoryId ? { feeId: fee.id } : {}),
        duplicate: isDup,
      });
    }
    return rows;
  };

  // ---------- Savings account import (separate from the budget) ----------
  const savingsInputRef = useRef(null);
  const parseNumber = (v) => parseFloat(String(v || "").replace(/[\s\u00a0\u202f]/g, "").replace(",", "."));
  const parseSavingsCsv = (text) => {
    text = text.replace(/^\uFEFF/, "");
    const lines = text.split(/\r\n|\n/).filter((l) => l.trim().length > 0);
    if (lines.length < 2) return "invalid";
    const delim = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ";" : ",";
    const split = (line) => line.split(delim).map((c) => c.trim().replace(/^"|"$/g, ""));
    const header = split(lines[0]).map((h) => h.toLowerCase());
    const dateIdx = header.findIndex((h) => h.includes("date"));
    const labelIdx = header.findIndex((h) => (h.includes("libell") || h === "label") && !h.includes("compte") && !h.includes("sugg"));
    const amountIdx = header.findIndex((h) => h.includes("montant") || h === "amount" || h.includes("solde"));
    // BoursoBank: the 1st "Solde" column is the amount, the 2nd one the account balance after that day.
    const balanceIdx = header.findIndex((h, i) => i !== amountIdx && (h.includes("solde") || h.includes("balance")));
    const accNumIdx = header.findIndex((h) => h.includes("numéro compte") || h.includes("numero compte") || h === "accountnum");
    const accLabelIdx = header.findIndex((h) => h.includes("libellé compte") || h.includes("libelle compte") || h === "accountlabel");
    if (dateIdx === -1 || labelIdx === -1 || amountIdx === -1) return "invalid";
    const rows = [];
    for (let i = 1; i < lines.length; i++) {
      const c = split(lines[i]);
      const amount = parseNumber(c[amountIdx]);
      if (isNaN(amount) || !c[dateIdx]) continue;
      const balance = balanceIdx !== -1 ? parseNumber(c[balanceIdx]) : NaN;
      const label = c[labelIdx] || "(sans libellé)";
      rows.push({
        account: (accNumIdx !== -1 && c[accNumIdx]) || (accLabelIdx !== -1 && c[accLabelIdx]) || "epargne",
        accountLabel: (accLabelIdx !== -1 && c[accLabelIdx]) || "Compte d'épargne",
        date: c[dateIdx], label, amount, balance: isNaN(balance) ? null : balance,
        importSig: c[dateIdx] + "|" + amount.toFixed(2) + "|" + label.trim().toLowerCase(),
      });
    }
    return rows;
  };
  // pdf.js is only loaded (from cdnjs) the first time a PDF statement is imported.
  const loadPdfJs = () => new Promise((resolve, reject) => {
    if (window.pdfjsLib) return resolve(window.pdfjsLib);
    const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    const tag = document.createElement("script");
    tag.src = base + "pdf.min.js";
    tag.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js"; resolve(window.pdfjsLib); };
    tag.onerror = () => reject(new Error("pdf.js"));
    document.head.appendChild(tag);
  });
  const readPdfPages = async (buffer) => {
    const pdfjs = await loadPdfJs();
    // pdf.js transfers (empties) the buffer it's given, so it gets a copy:
    // the original is still needed to archive the file.
    const doc = await pdfjs.getDocument({ data: new Uint8Array(buffer.slice(0)) }).promise;
    const pages = [];
    for (let i = 1; i <= doc.numPages; i++) {
      const tc = await (await doc.getPage(i)).getTextContent();
      pages.push(tc.items.map((it) => ({ x: it.transform[4], y: it.transform[5], s: it.str })));
    }
    return pages;
  };
  const titleCase = (t) => t.toLowerCase().replace(/(^|[\s.'-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());

  // Adds imported operations to their savings account. Lines already saved
  // (same date, amount and label) are skipped, so re-importing is safe. A
  // statement for an account not seen before can be attached to the manual
  // account currently shown (it then becomes an imported account).
  const mergeSavingsRows = (rows, fileName, archiveContent, note) => {
    const next = { ...savingsAccounts };
    const findId = (bankKey) => Object.keys(next).find((id) => id === bankKey || next[id].bankKey === bankKey);
    let targetFirst = null, added = 0, skipped = 0;
    for (const r of rows) {
      let id = findId(r.account);
      if (!id) {
        // The account currently shown on the page (the first one if none was picked).
        const shownId = selectedAccount && next[selectedAccount] ? selectedAccount : Object.keys(savingsAccounts)[0];
        const cur = shownId && next[shownId];
        if (cur && cur.manual && window.confirm(
          `Ajouter ce relevé (« ${r.accountLabel} ») au compte « ${cur.label} » ?\n\n` +
          `OK : le compte « ${cur.label} » utilisera désormais les opérations du relevé.\n` +
          `Annuler : créer un nouveau compte « ${r.accountLabel} ».`)) {
          id = shownId;
          next[id] = { ...cur, manual: false, bankKey: r.account, entries: [] };
        } else {
          id = r.account;
          next[id] = { label: r.accountLabel, bankKey: r.account, entries: [] };
        }
      }
      if (!targetFirst) targetFirst = id;
      const acc = next[id]._copied ? next[id] : (next[id] = { ...next[id], entries: [...(next[id].entries || [])], _copied: true });
      acc._pool = acc._pool || acc.entries.map((x) => x.importSig);
      const hit = acc._pool.indexOf(r.importSig);
      if (hit !== -1) { acc._pool.splice(hit, 1); skipped++; continue; }
      acc.entries.push({ id: uid("sav"), date: r.date, label: r.label, amount: r.amount, balance: r.balance, importSig: r.importSig });
      added++;
    }
    for (const k of Object.keys(next)) { delete next[k]._pool; delete next[k]._copied; }
    setSavingsAccounts(next);
    setImportSummary(`Épargne : ${added} opération(s) importée(s)` + (skipped ? `, ${skipped} déjà présente(s) ignorée(s)` : "") + "." + (note ? " " + note : ""));
    setView("epargne");
    if (targetFirst) setSelectedAccount(targetFirst);
    saveImportFile(fileName, archiveContent, null, added, skipped);
  };

  const handleSavingsFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = "";
    const isPdf = /\.pdf$/i.test(file.name) || file.type === "application/pdf";
    const reader = new FileReader();
    if (isPdf) {
      reader.onload = async (ev) => {
        const buffer = ev.target.result;
        let st;
        try { st = parseLclStatement(await readPdfPages(buffer)); }
        catch (err) { window.alert("Impossible de lire ce PDF (connexion nécessaire pour charger le lecteur PDF). Réessayez."); return; }
        if (!st) {
          window.alert("Ce PDF n'a pas été reconnu comme un relevé de compte d'épargne (format LCL attendu : « ECRITURES DE LA PERIODE », colonnes DEBIT / CREDIT). Vous pouvez aussi importer un export CSV.");
          return;
        }
        const accountLabel = titleCase(st.title || "Compte d'épargne") + (st.accountNumber ? " · " + st.accountNumber : "");
        const bankKey = "pdf:" + (st.accountNumber || st.title).replace(/\s+/g, "");
        const rows = st.entries.map((o) => ({ account: bankKey, accountLabel, date: o.date, label: o.label, amount: o.amount, balance: o.balance,
          importSig: o.date + "|" + o.amount.toFixed(2) + "|" + o.label.trim().toLowerCase() }));
        const note = st.verified
          ? `Solde vérifié avec le relevé : ${fmt(st.closing)} au ${st.periodEnd.split("-").reverse().join("/")}.`
          : `⚠ Le solde recalculé ne correspond pas exactement au relevé (${st.mismatches.map((m) => m.label + " " + fmt(m.amount)).join(", ")}) : vérifiez ce compte.`;
        // Archive the PDF itself (as a data URL) so it can be downloaded again.
        const bytes = new Uint8Array(buffer); let bin = "";
        for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        mergeSavingsRows(rows, file.name, "data:application/pdf;base64," + btoa(bin), note);
      };
      reader.readAsArrayBuffer(file);
    } else {
      reader.onload = (ev) => {
        const content = ev.target.result;
        const rows = parseSavingsCsv(content);
        if (rows === "invalid" || rows.length === 0) {
          window.alert("Colonnes attendues introuvables (date, libellé, montant). Vérifiez le fichier exporté de votre compte d'épargne.");
          return;
        }
        mergeSavingsRows(rows, file.name, content, "");
      };
      reader.readAsText(file, "utf-8");
    }
  };
  const removeSavingsAccount = (key) => {
    const acc = savingsAccounts[key];
    if (!window.confirm(`Êtes-vous sûr de vouloir supprimer le compte d'épargne « ${acc?.label || key} » et ses ${acc?.entries.length || 0} opération(s) ? (Annulable avec « ↶ Annuler »)`)) return;
    setSavingsAccounts((a) => { const { [key]: _, ...rest } = a; return rest; });
  };
  // Month-by-month summary of one savings account: money in, money out,
  // interest, end-of-month balance and change. The balance comes from the
  // bank's balance column when present (last day of the month), otherwise it
  // is computed by adding up the operations from 0. Months without any
  // operation are filled in with the previous balance.
  const addSavingsAccount = () => {
    const name = window.prompt("Nom du compte d'épargne (ex : Livret A, PEL, Assurance-vie)");
    if (!name || !name.trim()) return;
    const id = uid("acc");
    setSavingsAccounts((a) => ({ ...a, [id]: { label: name.trim(), manual: true, balances: {}, entries: [] } }));
    setSelectedAccount(id);
  };
  const renameSavingsAccount = (key) => {
    const name = window.prompt("Nouveau nom du compte", savingsAccounts[key]?.label || "");
    if (name && name.trim()) setSavingsAccounts((a) => ({ ...a, [key]: { ...a[key], label: name.trim() } }));
  };
  // Typing a balance for a month; emptying the box removes that month's value.
  const setManualBalance = (key, monthKey, value) =>
    setSavingsAccounts((a) => {
      const { [monthKey]: _, ...rest } = a[key].balances || {};
      return { ...a, [key]: { ...a[key], balances: value === "" || value === null || isNaN(value) ? rest : { ...rest, [monthKey]: value } } };
    });
  const monthKeyLabel = (k) => { const [y, mo] = k.split("-").map(Number); const n = MONTH_NAMES_FR[mo - 1]; return n.charAt(0).toUpperCase() + n.slice(1) + " " + y; };
  const savingsMonthly = (acc, monthKeys = []) => {
    if (acc.manual) {
      // One row per month of the budget (plus any other month that has a
      // balance); the balance is typed by hand and may be left empty.
      const bal = acc.balances || {};
      const keys = [...new Set([...monthKeys, ...Object.keys(bal)])].sort();
      let prev = null;
      const months = keys.map((k) => {
        const has = bal[k] !== undefined && bal[k] !== "" && !isNaN(Number(bal[k]));
        const balance = has ? Number(bal[k]) : null;
        const row = { key: k, label: monthKeyLabel(k), in: null, out: null, interest: null, balance,
          change: balance !== null && prev !== null ? balance - prev : null };
        if (balance !== null) prev = balance;
        return row;
      });
      return { months, fromBank: true };
    }
    const entries = acc.entries || [];
    const withDay = entries.map((e) => ({ ...e, day: dateToDayNumber(e.date) })).filter((e) => e.day !== null).sort((a, b) => a.day - b.day);
    if (withDay.length === 0) return { months: [], fromBank: false };
    const fromBank = withDay.some((e) => typeof e.balance === "number");
    const keyOf = (day) => { const d = new Date(day * 86400000); return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0"); };
    const byMonth = {};
    let running = 0;
    for (const e of withDay) {
      const k = keyOf(e.day);
      const m = (byMonth[k] = byMonth[k] || { in: 0, out: 0, interest: 0, balance: null, lastDay: -Infinity });
      if (e.amount >= 0) m.in += e.amount; else m.out += -e.amount;
      if (e.amount > 0 && /int[ée]r[êe]ts?/i.test(e.label)) m.interest += e.amount;
      running += e.amount;
      if (fromBank) { if (typeof e.balance === "number" && e.day >= m.lastDay) { m.balance = e.balance; m.lastDay = e.day; } }
      else m.balance = running;
    }
    const keys = Object.keys(byMonth).sort();
    const [y0, m0] = keys[0].split("-").map(Number);
    const [y1, m1] = keys[keys.length - 1].split("-").map(Number);
    const out = [];
    let prevBalance = null;
    for (let y = y0, mo = m0; y < y1 || (y === y1 && mo <= m1); mo === 12 ? (y++, mo = 1) : mo++) {
      const k = y + "-" + String(mo).padStart(2, "0");
      const m = byMonth[k] || { in: 0, out: 0, interest: 0, balance: null };
      const balance = m.balance !== null ? m.balance : prevBalance;
      const name = MONTH_NAMES_FR[mo - 1];
      out.push({ key: k, label: name.charAt(0).toUpperCase() + name.slice(1) + " " + y, in: m.in, out: m.out, interest: m.interest,
        balance, change: balance !== null && prevBalance !== null ? balance - prevBalance : null });
      if (balance !== null) prevBalance = balance;
    }
    return { months: out, fromBank };
  };

  const handleCsvFile = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const targetMonth = selectedMonth; // capture now — shouldn't drift if the user switches tabs before the read finishes
    const targetLabel = months.find((m) => m.id === targetMonth)?.label || targetMonth;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const content = ev.target.result;
      const parsed = parseCsv(content, targetMonth);
      if (parsed === "invalid") {
        window.alert("Colonnes attendues introuvables (date, libellé/label, montant). Vérifiez le format du fichier exporté.");
        return;
      }
      const dupCount = parsed.filter((r) => r.duplicate).length;
      const newRows = parsed.filter((r) => !r.duplicate).map(({ duplicate, ...r }) => r);

      // Each row goes to the month tab matching ITS date (a statement from
      // 28/08 to 30/09 fills both August and September, whichever tab is
      // open). A missing month tab is created. Rows without a readable date
      // go to the open tab.
      const tabForKey = {};
      for (const m of months) {
        const key = monthSortKey(m);
        if (key && !tabForKey[key]) tabForKey[key] = m.id;
      }
      const newTabs = [];
      const byMonth = {}; // { [monthId]: rows }
      for (const row of newRows) {
        const dayNum = dateToDayNumber(row.date);
        let monthId = targetMonth;
        if (dayNum !== null) {
          const d = new Date(dayNum * 86400000);
          const key = d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0");
          if (!tabForKey[key]) {
            const name = MONTH_NAMES_FR[d.getUTCMonth()];
            const tab = { id: uid("month"), label: name.charAt(0).toUpperCase() + name.slice(1) + " " + d.getUTCFullYear(), date: key + "-01" };
            tabForKey[key] = tab.id;
            newTabs.push(tab);
          }
          monthId = tabForKey[key];
        }
        (byMonth[monthId] = byMonth[monthId] || []).push(row);
      }
      if (newTabs.length) {
        setMonths((ms) => sortMonthsChronologically([...ms, ...newTabs]));
        setIncome((inc) => ({ ...inc, ...Object.fromEntries(newTabs.map((t) => [t.id, []])) }));
        setSavings((sv) => ({ ...sv, ...Object.fromEntries(newTabs.map((t) => [t.id, 0])) }));
        setActuals((a) => ({ ...a, ...Object.fromEntries(newTabs.map((t) => [t.id, {}])) }));
      }
      // Save straight away — no in-memory-only review step, so nothing is
      // lost if the tab gets reloaded or discarded before you're done
      // reviewing. Categorize/fix rows afterward in "Transactions" below.
      setTransactions((t) => {
        const next = { ...t };
        for (const [monthId, rows] of Object.entries(byMonth)) next[monthId] = [...(next[monthId] || []), ...rows];
        return next;
      });
      const labelOf = (id) => newTabs.find((t) => t.id === id)?.label || months.find((m) => m.id === id)?.label || id;
      const perMonth = Object.entries(byMonth)
        .map(([id, rows]) => `${rows.length} en ${labelOf(id)}${newTabs.some((t) => t.id === id) ? " (onglet créé)" : ""}`)
        .join(", ");
      setImportSummary(
        `${newRows.length} transaction(s) importée(s)` + (perMonth ? ` : ${perMonth}` : ` pour ${targetLabel}`) +
        (dupCount > 0 ? `, ${dupCount} déjà importée(s) ignorée(s)` : "") +
        (newRows.some((r) => r.categorySource === "keyword") ? `, ${newRows.filter((r) => r.categorySource === "keyword").length} catégorie(s) devinée(s) marquée(s) « ? » à vérifier` : "") +
        `. Vérifiez/complétez leur catégorie ci-dessous dans « Transactions ».`
      );
      setShowTransactions(true);
      saveImportFile(file.name, content, targetMonth, newRows.length, dupCount);
    };
    reader.readAsText(file, "utf-8");
    e.target.value = "";
  };

  // ---------- Transaction log (editable, per month) ----------
  const [txErrors, setTxErrors] = useState({}); // { [txId]: "error message" }, kept for inline highlight too

  const flagTxError = (txId, message) => {
    window.alert(message);
    setTxErrors((e) => ({ ...e, [txId]: message }));
    setTimeout(() => setTxErrors((e) => { const { [txId]: _, ...rest } = e; return rest; }), 6000);
  };

  const updateTransactionCategory = (m, txId, catId) => {
    if (catId === "__new__") {
      const name = window.prompt("Nom de la nouvelle catégorie ?");
      if (!name) return;
      const newId = uid("cat");
      setCategories((cs) => [...cs, { id: newId, name, budget: 0 }]);
      catId = newId;
    }
    // Remember this choice for the merchant, so future imports categorize it
    // automatically, and fill in other still-uncategorized rows of the same
    // merchant this month. Already-categorized rows are left untouched.
    const tx = (transactions[m] || []).find((x) => x.id === txId);
    const key = tx ? merchantKey(tx.label) : "";
    if (key) {
      setCategoryRules((r) => {
        const { [key]: _, ...rest } = r;
        return catId ? { ...rest, [key]: catId } : rest;
      });
    }
    setTransactions((t) => ({
      ...t,
      [m]: (t[m] || []).map((x) => {
        if (x.id === txId) return { ...x, categoryId: catId, categorySource: "manual" };
        if (catId && key && !x.categoryId && !x.recurring && merchantKey(x.label) === key) return { ...x, categoryId: catId, categorySource: "rule" };
        return x;
      }),
    }));
  };
  const updateTransactionField = (m, txId, field, value) => {
    const current = (transactions[m] || []).find((tx) => tx.id === txId);
    if (!current) return;
    const candidate = { ...current, [field]: value };
    const isComplete = (candidate.date || "").trim() !== "" && Number(candidate.amount) !== 0 && (candidate.label || "").trim() !== "";
    if (isComplete) {
      const dup = findDuplicateInMonth(m, candidate, txId);
      if (dup) {
        flagTxError(txId, "⚠️ Doublon : une dépense identique (même date, même montant, même libellé) existe déjà — modification bloquée.");
        return; // block the change
      }
    }
    setTransactions((t) => ({ ...t, [m]: (t[m] || []).map((tx) => (tx.id === txId ? candidate : tx)) }));
  };
  const removeTransaction = (m, txId) =>
    setTransactions((t) => ({ ...t, [m]: (t[m] || []).filter((tx) => tx.id !== txId) }));
  // New lines start without a date, so they show at the top of the list, already open for editing.
  const addManualTransaction = (m) => {
    const id = uid("tx");
    setTransactions((t) => ({ ...t, [m]: [...(t[m] || []), { id, date: "", label: "Nouvelle dépense", amount: 0, categoryId: "" }] }));
    setTxQuery(""); setTxCatFilter(""); setOpenTx(id);
  };
  const toggleRecurring = (m, txId) =>
    setTransactions((t) => ({ ...t, [m]: (t[m] || []).map((tx) => (tx.id === txId ? { ...tx, recurring: !tx.recurring } : tx)) }));

  // ---------- Recurring fees (household-wide schedule, not tied to a specific month) ----------
  const addRecurringFee = () =>
    setRecurringFees((fs) => [...fs, { id: uid("fee"), label: "Nouvelle charge", amount: 0, dayOfMonth: 1, categoryId: "" }]);
  const updateRecurringFee = (id, field, value) =>
    setRecurringFees((fs) => fs.map((f) => (f.id === id ? { ...f, [field]: value } : f)));
  const removeRecurringFee = (id) => setRecurringFees((fs) => fs.filter((f) => f.id !== id));
  // Turn an imported direct debit into a recurring fee (label, amount, day and
  // category taken from the transaction) and link the transaction to it.
  const createFeeFromTransaction = (m, tx) => {
    const key = merchantKey(tx.label);
    const feeLabel = key ? key.replace(/\b\w/g, (c) => c.toUpperCase()) : tx.label;
    const fee = { id: uid("fee"), label: feeLabel, amount: Math.abs(Number(tx.amount) || 0), dayOfMonth: dayOfMonthFromDate(tx.date) || 1, categoryId: tx.categoryId || "" };
    setRecurringFees((fs) => [...fs, fee]);
    setTransactions((t) => ({ ...t, [m]: (t[m] || []).map((x) => (x.id === tx.id ? { ...x, feeId: fee.id } : x)) }));
    setShowRecurringFees(true);
  };
  // Direct debits not yet covered by a recurring fee: suggest adding one.
  const suggestsRecurringFee = (tx) =>
    operationType(tx.label) === "debit" && tx.amount > 0 && !tx.recurring &&
    !(tx.feeId && recurringFees.some((f) => f.id === tx.feeId)) &&
    !recurringFees.some((f) => feeAmountClose(f, tx.amount, 0.05) && feeLabelOverlap(f, tx.label));


  if (!loaded || !selectedMonth) return <div style={{ padding: 40 }}>Chargement du budget…</div>;

    if (name && name !== household.name) onRename(name);
    setEditingName(false);
  };

  const barData = expenseCategories.map((c) => ({ name: c.name.length > 14 ? c.name.slice(0, 13) + "…" : c.name, Budget: Number(c.budget) || 0, Réel: categoryTotal(selectedMonth, c.id) }));
  const sortedMonths = sortMonthsChronologically(months);
  const curIdx = sortedMonths.findIndex((m) => m.id === selectedMonth);
  // Category bars for the selected month: state = over (red) / reached (blue) / near (≥ 90 %) and ok (green) / none (no budget).
  const catRows = expenseCategories.map((c) => {
    const spent = categoryTotal(selectedMonth, c.id), budget = Number(c.budget) || 0;
    // Within 50 cents of the budget counts as exactly reached (the note would otherwise say "reste 0 €").
    const reached = budget > 0 && Math.abs(budget - spent) < 0.5;
    const state = budget <= 0 ? "none" : reached ? "reached" : spent > budget ? "over" : spent >= 0.9 * budget ? "near" : "ok";
    const note = state === "none" ? (spent ? "hors budget" : "pas de budget") : reached ? "budget atteint" : state === "over" ? `+${fmt(Math.round(spent - budget))} au-dessus` : state === "near" ? `presque atteint · reste ${fmt(Math.round(budget - spent))}` : `reste ${fmt(Math.round(budget - spent))}`;
    return { id: c.id, name: c.name, spent, budget, state, note, pct: budget > 0 ? Math.min(100, (spent / budget) * 100) : (spent ? 100 : 0) };
  }).filter((c) => c.spent !== 0 || c.budget > 0)
    .sort((a, b) => (a.state === "over") !== (b.state === "over") ? (a.state === "over" ? -1 : 1) : b.spent - a.spent);
  const overCount = catRows.filter((c) => c.state === "over").length;
  const budgetMonthKeys = [...new Set(sortedMonths.map(monthSortKey).filter(Boolean))];
  const savingsList = Object.entries(savingsAccounts).map(([key, acc]) => {
    const { months: rows, fromBank } = savingsMonthly(acc, budgetMonthKeys);
    const withBal = rows.filter((r) => r.balance !== null);
    return { key, acc, rows, fromBank, last: withBal[withBal.length - 1], first: withBal[0] };
  });
  const savingsTotal = savingsList.reduce((t, a) => t + (a.last ? Number(a.last.balance) || 0 : 0), 0);
  const accIdx = Math.max(0, savingsList.findIndex((a) => a.key === selectedAccount));
  // Home card: change of the account with the most recent balance, and its sparkline.
  const homeSavAcc = [...savingsList].filter((a) => a.last).sort((x, y) => (y.last.key > x.last.key ? 1 : -1))[0];
  const homeSav = homeSavAcc ? { ...homeSavAcc.last, name: homeSavAcc.acc.label } : null;
  const homeSpark = (() => {
    const pts = homeSavAcc ? homeSavAcc.rows.filter((r) => r.balance !== null) : [];
    if (pts.length < 2) return null;
    const vals = pts.map((r) => r.balance), lo = Math.min(...vals), hi = Math.max(...vals), span = hi - lo || 1;
    return pts.map((r, i) => `${(i / (pts.length - 1)) * 500},${(88 - ((r.balance - lo) / span) * 80).toFixed(1)}`).join(" ");
  })();
  const curAccount = savingsList[accIdx] || null;
  const spendData = sortedMonths.map((m) => ({ name: m.label, Dépenses: Math.round(monthActualTotal(m.id) * 100) / 100 }));
  const curIncomeLines = income[selectedMonth] || [];
  const curIncomeTotal = monthIncome(selectedMonth);
  const curActualTotal = monthActualTotal(selectedMonth);
  const curManualSavings = Number(savings[selectedMonth]) || 0;
  const curSavingsFromCategory = epargneFromTransactions(selectedMonth);
  const curSavings = monthSavings(selectedMonth);
  const curRestant = monthRestant(selectedMonth);
  const curMonthLabel = months.find((m) => m.id === selectedMonth)?.label;

  // Recurring fees: for each one, check whether a real transaction already
  // exists in its category for the selected month — that's a genuine
  // confirmation, not just a date-based guess. The calendar day is only used
  // as a fallback to flag "expected but not seen yet" vs "not due yet".
  const today = new Date();
  const todayKey = today.getFullYear() + "-" + String(today.getMonth() + 1).padStart(2, "0");
  const selectedMonthObj = months.find((m) => m.id === selectedMonth);
  const isRealCurrentMonth = selectedMonthObj?.date?.slice(0, 7) === todayKey;
  const todayDay = today.getDate();

  const feeStatus = (f) => {
    const matched = monthTransactions(selectedMonth).some((t) => t.feeId === f.id || (f.categoryId && t.categoryId === f.categoryId));
    if (matched) return "confirmed";
    if (isRealCurrentMonth) return (Number(f.dayOfMonth) || 1) <= todayDay ? "overdue" : "upcoming";
    return "unmatched";
  };
  // Detail list under an "(auto)" total: the transactions of this month in that
  // category. `sign` flips amounts so they read the same way as the total
  // (salary is stored negative = money received).
  const renderAutoDetails = (catId, sign) => {
    const txs = monthTransactions(selectedMonth).filter((t) => t.categoryId === catId);
    return (
      <div style={{ padding: "2px 16px 10px 34px", fontSize: 12, color: "var(--ink-soft)" }}>
        {txs.length === 0 ? (
          <div>Aucune transaction dans cette catégorie ce mois-ci.</div>
        ) : txs.map((t) => (
          <div key={t.id} style={{ display: "flex", gap: 10, padding: "3px 0", borderBottom: "1px dotted var(--rule)" }}>
            <span style={{ width: 84, flexShrink: 0 }}>{t.date || "—"}</span>
            <span style={{ flex: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={t.label}>{t.label}</span>
            <span style={{ fontFamily: "var(--font-mono)", whiteSpace: "nowrap" }}>{fmt(sign * (Number(t.amount) || 0))}</span>
          </div>
        ))}
      </div>
    );
  };
  const confirmedFees = recurringFees.filter((f) => feeStatus(f) === "confirmed");
  const outstandingFees = recurringFees.filter((f) => feeStatus(f) !== "confirmed");
  const confirmedTotal = confirmedFees.reduce((s, f) => s + (f.categoryId ? categoryTotal(selectedMonth, f.categoryId) : Number(f.amount) || 0), 0);
  const outstandingTotal = outstandingFees.reduce((s, f) => s + (Number(f.amount) || 0), 0);

  return (
    <div className="ledger">
      <header className="appbar">
        <div className="appbar-inner">

              <input

                className="title-edit-input"
                aria-label="Nom du foyer"

                onBlur={commitNameEdit}
                onKeyDown={(e) => {
                  if (e.key === "Enter") commitNameEdit();
                  if (e.key === "Escape") setEditingName(false);
                }}
              />
            ) : (
              <button className="brand" title="Cliquer pour renommer le foyer" onClick={() => { setNameDraft(household.name); setEditingName(true); }}>{household.name}</button>
            )}
            <span className="brand-sub">budget du foyer</span>
          </div>
          <nav className="section-nav" aria-label="Sections">
            <button className={view === "home" ? "active" : ""} onClick={() => goTo("home")}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"></path><path d="M5 10v10h14V10"></path></svg>Accueil</button>
            <button className={view === "depenses" ? "active" : ""} onClick={() => goTo("depenses")}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"></rect><path d="M3 10h18"></path><path d="M8 3v4M16 3v4"></path></svg>Dépenses</button>
            <button className={view === "epargne" ? "active" : ""} onClick={() => setView("epargne")}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"></path></svg>Épargne</button>
          </nav>
          <div className="appbar-actions">
            <input ref={csvInputRef} type="file" accept=".csv,text/csv" onChange={handleCsvFile} style={{ display: "none" }} />
            <span className="save-pill">{saveState === "saving" ? "Enregistrement…" : saveState === "error" ? "⚠ Erreur d'enregistrement" : "✓ Enregistré"}</span>
            <button className="reset-btn" onClick={undo} disabled={undoCount === 0} style={{ opacity: undoCount === 0 ? 0.45 : 1, cursor: undoCount === 0 ? "default" : "pointer" }} title="Annuler la dernière modification (Ctrl+Z / ⌘Z)">
              ↶ Annuler{undoCount > 0 ? ` (${undoCount})` : ""}
            </button>
            <span className="invite-pill">Code : <span className="invite-code">{household.invite_code}</span></span>
            <button className="logout-btn" onClick={onLogout}>Se déconnecter</button>
          </div>
        </div>
      </header>

      {importSummary && (
        <div className="import-summary" style={{ maxWidth: 1080, margin: "0 auto 18px", padding: "12px 16px", borderRadius: 12, background: "var(--paper)", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, border: "1px solid var(--rule)" }}>
          <span>{importSummary}</span>
          <button className="add-line" style={{ display: "inline", padding: 0, whiteSpace: "nowrap" }} onClick={() => setImportSummary(null)}>Fermer ✕</button>
        </div>

      {view === "home" && (<React.Fragment>
        <div className="home-hello">
          <h1>{new Date().getHours() < 18 ? "Bonjour." : "Bonsoir."} <em>Voici {(curMonthLabel || "").toLowerCase().replace(/ \d{4}$/, "")}.</em></h1>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <button className="month-action" onClick={() => { setView("depenses"); csvInputRef.current && csvInputRef.current.click(); }}>↑ Importer un relevé</button>
            <button className="month-action primary" onClick={() => { setView("depenses"); addManualTransaction(selectedMonth); setShowTransactions(true); }}>+ Ajouter une dépense</button>
          </div>
        </div>
        <div className="home-grid">
          <button className="home-card sand" onClick={() => goTo("depenses")}>
            <span className="home-kicker"><span>Dépenses · {curMonthLabel}</span><span>Ouvrir →</span></span>
            <span className="home-big">{fmt(Math.round(curActualTotal))}</span>
            <span className="home-line">dépensés sur un budget de <strong style={{ color: "var(--ink)" }}>{fmt(Math.round(monthBudgetTotal))}</strong></span>
            <span className="bar-track" style={{ background: "rgba(27,30,33,0.10)" }}><span className={"bar-fill " + (monthBudgetTotal > 0 && Math.abs(curActualTotal - monthBudgetTotal) < 0.5 ? "reached" : curActualTotal > monthBudgetTotal ? "over" : "")} style={{ display: "block", width: Math.min(100, monthBudgetTotal > 0 ? (curActualTotal / monthBudgetTotal) * 100 : 0) + "%" }}></span></span>

              <span><span className="hero-label" style={{ display: "block" }}>Épargné</span><span className="hero-num" style={{ fontSize: 18 }}>{fmt(Math.round(curSavings))}</span></span>
              <span><span className="hero-label" style={{ display: "block" }}>Reste</span><span className="hero-num" style={{ fontSize: 18, color: curRestant >= 0 ? "var(--amber)" : "var(--red)" }}>{fmt(Math.round(curRestant))}</span></span>
            </span>

            <span className="home-big" style={{ color: "var(--ink)" }}>{fmt(Math.round(savingsTotal))}</span>
            {homeSav && homeSav.change !== null
              ? <span className="home-line"><strong style={{ color: homeSav.change >= 0 ? "var(--green)" : "var(--red)" }}>{homeSav.change >= 0 ? "+" : ""}{fmt(Math.round(homeSav.change))}</strong> en {homeSav.label.toLowerCase()} sur {homeSav.name}</span>
              : <span className="home-line">{savingsList.length ? "Total de vos comptes d'épargne" : "Ajoutez vos comptes d'épargne pour suivre leur solde"}</span>}
            {homeSpark && <svg width="100%" height="96" viewBox="0 0 500 96" preserveAspectRatio="none" aria-hidden="true"><polygon points={homeSpark + " 500,96 0,96"} fill="var(--blue-soft)"></polygon><polyline points={homeSpark} fill="none" stroke="var(--gold)" strokeWidth="3" strokeLinejoin="round"></polyline></svg>}
            <span style={{ marginTop: "auto", display: "flex", gap: 8, flexWrap: "wrap" }}>
              {savingsList.map((a) => a.last
                ? <span key={a.key} className="chip">{a.acc.label} · {fmt(Math.round(a.last.balance))}</span>
                : <span key={a.key} className="chip dashed">{a.acc.label} · à compléter</span>)}
            </span>
          </button>
        </div>
      </React.Fragment>)}

      {view === "epargne" && (<React.Fragment>
        <input ref={savingsInputRef} type="file" accept=".csv,.pdf,text/csv,application/pdf" onChange={handleSavingsFile} style={{ display: "none" }} />
        <div className="month-bar">
          <div className="acc-pills" role="tablist" aria-label="Comptes d'épargne">
            {savingsList.map((a) => (
              <button key={a.key} role="tab" aria-selected={curAccount && a.key === curAccount.key} className={"acc-pill" + (curAccount && a.key === curAccount.key ? " active" : "")} onClick={() => setSelectedAccount(a.key)}>
                {a.acc.label}<span className="m">{a.last ? fmt(Math.round(a.last.balance)) : "—"}</span>
              </button>
            ))}
            <button className="acc-pill" style={{ borderStyle: "dashed", fontWeight: 500 }} onClick={addSavingsAccount}>+ Compte</button>
          </div>
          <span style={{ marginLeft: "auto", fontSize: 14, color: "var(--ink-soft)" }}>Total épargne <strong style={{ fontFamily: "var(--font-mono)", color: "var(--ink)" }}>{fmt(savingsTotal)}</strong></span>
          <button className="month-action primary" onClick={() => savingsInputRef.current && savingsInputRef.current.click()} title="Importer le relevé PDF (LCL) ou l'export CSV d'un compte d'épargne : les opérations et le solde sont lus automatiquement">↑ Importer un relevé (PDF ou CSV)</button>
        </div>

        {!curAccount ? (
          <div className="panel">
            <div className="import-hint" style={{ padding: 16 }}>
              Aucun compte d'épargne pour l'instant. Cliquez sur « + Ajouter un compte » pour en créer un et saisir son solde chaque mois, ou importez l'export CSV d'un compte.
            </div>
          </div>
        ) : (() => {
          const { key, acc, rows, fromBank, last, first } = curAccount;
          const charted = rows.filter((r) => r.balance !== null);
          const prevBal = charted.length > 1 ? charted[charted.length - 2].balance : null;
          const recentMonth = !acc.manual && acc.entries.length ? [...acc.entries].map((e) => e.date).sort().pop().slice(0, 7) : null;
          const recent = recentMonth ? acc.entries.filter((e) => e.date.startsWith(recentMonth)).sort((x, y) => (x.date < y.date ? 1 : -1)) : [];
          return (<React.Fragment>
            <div className="sav-grid">
              <div className="panel" style={{ padding: "26px 30px", display: "flex", flexDirection: "column", gap: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 12, flexWrap: "wrap" }}>
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    <span className="hero-kicker">{acc.label} · {acc.manual ? "saisie manuelle" : "importé"}</span>
                    <span className="hero-big" style={{ color: "var(--ink)" }}>{last ? fmt(Math.round(last.balance)) : "—"}</span>
                    <span style={{ fontSize: 15, color: "var(--ink-soft)" }}>
                      {last ? `fin ${last.label.toLowerCase()}` : "Saisissez un premier solde ci-dessous"}
                      {last && prevBal !== null && <React.Fragment> · <strong style={{ color: last.balance - prevBal >= 0 ? "var(--green)" : "var(--red)" }}>{last.balance - prevBal >= 0 ? "+" : ""}{fmt(Math.round(last.balance - prevBal))}</strong> ce mois</React.Fragment>}
                      {first && last && first !== last && <React.Fragment> · <strong style={{ color: last.balance - first.balance >= 0 ? "var(--green)" : "var(--red)" }}>{last.balance - first.balance >= 0 ? "+" : ""}{fmt(Math.round(last.balance - first.balance))}</strong> depuis {first.label.toLowerCase()}</React.Fragment>}
                    </span>
                  </div>
                  {!acc.manual && fromBank && <span className="verified">✓ Solde lu sur le relevé</span>}
                </div>
                {charted.length > 1 && <SavingsBalanceChart data={charted} />}
                <div style={{ display: "flex", gap: 14, flexWrap: "wrap", fontSize: 12 }}>
                  <button className="btn-link" style={{ marginTop: 0 }} onClick={() => renameSavingsAccount(key)}>✎ Renommer le compte</button>
                  <button className="btn-link" style={{ marginTop: 0, color: "var(--red)" }} onClick={() => removeSavingsAccount(key)}>✕ Supprimer le compte</button>
                </div>
              </div>
              <div className="panel" style={{ padding: "22px 24px", display: "flex", flexDirection: "column" }}>
                <h2 style={{ margin: "0 0 6px", fontFamily: "var(--font-display)", fontSize: 21, fontWeight: 600 }}>{recentMonth ? monthKeyLabel(recentMonth) : "Comment le mettre à jour"}</h2>
                {recentMonth ? recent.map((e) => (
                  <div key={e.id} style={{ display: "flex", alignItems: "baseline", gap: 12, padding: "10px 0", borderBottom: "1px solid var(--rule)" }}>
                    <span style={{ width: 46, flexShrink: 0, fontFamily: "var(--font-mono)", fontSize: 12, color: "var(--ink-soft)" }}>{e.date.slice(8, 10)}/{e.date.slice(5, 7)}</span>
                    <span style={{ flexGrow: 1, minWidth: 0, fontSize: 14 }}>{e.label.split(" — ")[0]}{e.label.includes(" — ") && <em style={{ color: "var(--ink-soft)" }}> — {e.label.split(" — ").slice(1).join(" — ")}</em>}</span>
                    <span style={{ fontFamily: "var(--font-mono)", fontSize: 14, fontWeight: 600, whiteSpace: "nowrap", color: e.amount >= 0 ? "var(--green)" : "var(--red)" }}>{e.amount >= 0 ? "+" : "−"}{fmt(Math.abs(e.amount))}</span>
                  </div>
                )) : (
                  <div className="import-hint" style={{ fontSize: 13, lineHeight: 1.6 }}>
                    Tapez le solde de fin de mois dans le tableau ci-dessous, ou importez le relevé PDF / CSV du compte : les opérations et le solde seront lus automatiquement.
                  </div>
                )}
              </div>
            </div>
            <div className="panel">
              <div className="panel-title">Mois par mois</div>
              <div style={{ overflowX: "auto", padding: "8px 16px 12px" }}>
                {acc.manual ? (
                  <table style={{ width: "100%" }}>
                    <thead><tr><th>Mois</th><th className="num">Solde fin de mois</th><th className="num">Variation</th></tr></thead>
                    <tbody>
                      {rows.map((r) => (
                        <tr key={r.key}>
                          <td>{r.label}</td>
                          <td className="num">
                            <input type="number" step="0.01" className="sav-balance-input" placeholder="—" aria-label={`Solde ${r.label}`}
                              value={acc.balances[r.key] ?? ""}
                              onChange={(e) => setManualBalance(key, r.key, e.target.value === "" ? "" : parseFloat(e.target.value))} />
                          </td>
                          <td className={"num " + (r.change === null ? "" : r.change >= 0 ? "diff-pos" : "diff-neg")}>{r.change === null ? "—" : (r.change >= 0 ? "+" : "") + fmt(r.change)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                ) : (
                  <table style={{ width: "100%" }}>
                    <thead><tr><th>Mois</th><th className="num">Entrées</th><th className="num">Sorties</th><th className="num">dont intérêts</th><th className="num">Solde fin de mois</th><th className="num">Variation</th></tr></thead>
                    <tbody>
                      {rows.map((r) => (
                        <tr key={r.key}>
                          <td>{r.label}</td>
                          <td className="num" style={{ color: r.in ? "var(--green)" : "var(--ink-soft)" }}>{r.in ? "+" + fmt(r.in) : "—"}</td>
                          <td className="num" style={{ color: r.out ? "var(--red)" : "var(--ink-soft)" }}>{r.out ? "−" + fmt(r.out) : "—"}</td>
                          <td className="num">{r.interest ? fmt(r.interest) : "—"}</td>
                          <td className="num"><strong>{r.balance !== null ? fmt(r.balance) : "—"}</strong></td>
                          <td className={"num " + (r.change === null ? "" : r.change >= 0 ? "diff-pos" : "diff-neg")}>{r.change === null ? "—" : (r.change >= 0 ? "+" : "") + fmt(r.change)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

              <div className="import-hint" style={{ padding: "0 16px 12px" }}>
                {acc.manual
                  ? "Saisissez le solde à la fin de chaque mois. Les mois sont ceux de « Suivi des dépenses mensuelles » : ajouter un mois là-bas l'ajoute ici."
                  : fromBank
                    ? "Pour mettre à jour ce compte, importez un relevé plus récent : seules les nouvelles opérations sont ajoutées."
                    : "Le fichier ne contient pas de colonne de solde : le solde est calculé en additionnant les opérations à partir de 0."}

      {view === "depenses" && (<React.Fragment>
      <div className="month-bar">
        <button className="month-nav" title="Mois précédent" disabled={curIdx <= 0} onClick={() => setSelectedMonth(sortedMonths[curIdx - 1].id)}>‹</button>
        <select aria-label="Choisir le mois" value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)}>
          {sortedMonths.map((m) => (<option key={m.id} value={m.id}>{m.label}</option>))}
        </select>
        <button className="month-nav" title="Mois suivant" disabled={curIdx >= sortedMonths.length - 1} onClick={() => setSelectedMonth(sortedMonths[curIdx + 1].id)}>›</button>
        <button className="month-action" onClick={addMonth}>+ Ajouter un mois</button>
        <button className="month-action" onClick={() => renameMonth(selectedMonth)}>✎ Renommer</button>
        <button className="month-action danger" disabled={months.length <= 1} onClick={() => removeMonth(selectedMonth)}>✕ Supprimer</button>
        <button className="month-action primary" style={{ marginLeft: "auto" }} onClick={() => csvInputRef.current && csvInputRef.current.click()} title={`Importer un relevé CSV du compte courant (les lignes vont dans le mois de leur date)`}>
          ↑ Importer un relevé
        </button>
      </div>

      <section className="hero" aria-label={`Résumé de ${curMonthLabel}`}>

                date_asc: (a, b) => day(a) - day(b),
                amount_desc: (a, b) => (Number(b.amount) || 0) - (Number(a.amount) || 0),
                amount_asc: (a, b) => (Number(a.amount) || 0) - (Number(b.amount) || 0),

                    {counts.check > 0 && chip("__check__", "À vérifier", counts.check)}
                    {chip("__none__", "Sans catégorie", counts.none)}
                    {counts.rec > 0 && chip("__rec__", "Récurrentes", counts.rec)}
                    <select className={"tx-select" + (isCatFilter ? " active" : "")} aria-label="Filtrer par catégorie" value={isCatFilter ? txCatFilter : ""} onChange={(e) => setTxCatFilter(e.target.value)}>
                      <option value="">Catégorie…</option>
                      {categories.map((c) => (<option key={c.id} value={c.id}>{c.name}</option>))}
                    </select>
                    <select className="tx-select" aria-label="Trier" value={txSort} onChange={(e) => setTxSort(e.target.value)}>
                      <option value="default">Tri : date (récent)</option>
                      <option value="date_asc">Date (ancien)</option>
                      <option value="amount_desc">Montant (plus grand)</option>
                      <option value="amount_asc">Montant (plus petit)</option>
                      <option value="category">Catégorie (A→Z)</option>
                      <option value="label">Libellé (A→Z)</option>
                    </select>
                    {(filtering || txSort !== "default") && (
                      <button className="btn-link" style={{ marginTop: 0 }} onClick={() => { setTxQuery(""); setTxCatFilter(""); setTxSort("default"); }}>Réinitialiser</button>
                    )}
                  </div>
                  {filtering && all.length > 0 && (
                    <div className="tx-result">{all.length} transaction(s) sur {everything.length} · total {fmt(filteredTotal)}</div>
                  )}
                  {everything.length === 0 ? (
                    <div className="import-hint" style={{ padding: "16px 0" }}>Aucune dépense enregistrée ce mois-ci pour l'instant.</div>
                  ) : all.length === 0 ? (
                    <div className="import-hint" style={{ padding: "16px 0" }}>Aucune transaction ne correspond.</div>
                  ) : (
                    groups.map((g) => (
                      <div key={g.key} className="tx-group">
                        {g.title && <div className="tx-day">{g.title}</div>}
                        {g.items.map(renderRow)}
                      </div>
                    ))
                  )}
                  {limited && (
                    <button type="button" className="tx-more" onClick={() => setTxShowAll(true)}>Voir les {all.length} transactions</button>
                  )}
                </React.Fragment>
              );
            })()}
            <button className="add-line" onClick={() => addManualTransaction(selectedMonth)}>+ Ajouter une dépense</button>
          </div>
        )}
      </div>

      <div className="panel">
        <div className="panel-title" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }} onClick={() => setShowImportFiles((v) => !v)}>
          <span>Relevés CSV importés ({importFiles.length})</span>
          <span style={{ fontSize: 12, color: "var(--gold)" }}>{showImportFiles ? "Masquer ▲" : "Voir ▼"}</span>
        </div>
        {showImportFiles && (
          importFiles.length === 0 ? (
            <div className="import-hint" style={{ padding: 16 }}>Aucun relevé importé pour l'instant. Chaque fichier importé est conservé ici et peut être re-téléchargé.</div>
          ) : (
            importFiles.map((f) => (
              <div key={f.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 16px", borderBottom: "1px solid var(--rule)", fontSize: 12, flexWrap: "wrap" }}>
                <span style={{ flex: "1 1 200px", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }} title={f.file_name}>{f.file_name}</span>
                <span style={{ color: "var(--ink-soft)" }}>
                  {new Date(f.created_at).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" })}
                  {" · "}{months.find((m) => m.id === f.month_id)?.label || "—"}
                  {" · "}{f.imported_count} importée(s){f.skipped_count > 0 ? `, ${f.skipped_count} déjà présente(s)` : ""}
                </span>
                <button className="reset-btn" onClick={() => downloadImportFile(f)}>↓ Télécharger</button>
                <button className="icon-btn" title="Supprimer ce fichier de l'archive" onClick={() => deleteImportFile(f)}>✕</button>
              </div>
            ))
          )
        )}
      </div>


      <div className="charts">
        <div className="chart-box"><p className="chart-title">Budget vs. réel par catégorie</p><BarChartCanvas data={barData} /></div>
        <div className="chart-box"><p className="chart-title">Dépenses par mois (hors épargne)</p><MonthlySpendChart data={spendData} budget={monthBudgetTotal} selectedName={curMonthLabel} /></div>
      </div>
      </React.Fragment>)}
    </div>
  );
}

// ---------- Top-level app: auth -> household -> tracker ----------
function App() {
  const [session, setSession] = useState(null);
  const [loadingSession, setLoadingSession] = useState(true);
  const [household, setHousehold] = useState(null);
  const [checkingHousehold, setCheckingHousehold] = useState(false);
  const [recovering, setRecovering] = useState(ARRIVED_FROM_RECOVERY_LINK);
  const [passwordChanged, setPasswordChanged] = useState(false);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setLoadingSession(false); });
    const { data: listener } = sb.auth.onAuthStateChange((event, s) => {
      if (event === "PASSWORD_RECOVERY") setRecovering(true);
      setSession(s);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  const lastCheckedUserId = useRef(null);
  useEffect(() => {
    const userId = session?.user?.id || null;
    if (!session) { setHousehold(null); lastCheckedUserId.current = null; return; }
    // Supabase silently refreshes the session token whenever the browser tab
    // regains focus — that fires this effect again with a *new* session object
    // for the *same* user. Without this guard, that was force-reloading the
    // whole app (and wiping any unsaved edits) just from switching tabs.
    if (userId === lastCheckedUserId.current) return;
    lastCheckedUserId.current = userId;
    (async () => {
      setCheckingHousehold(true);
      const { data } = await sb.from("household_members")
        .select("household_id, households(id, name, invite_code)")
        .eq("user_id", session.user.id).limit(1).maybeSingle();
      if (data && data.households) setHousehold(data.households);
      setCheckingHousehold(false);
    })();
  }, [session]);

  const logout = async () => { await sb.auth.signOut(); setHousehold(null); };

  const renameHousehold = async (newName) => {
    const { error } = await sb.from("households").update({ name: newName }).eq("id", household.id);
    if (error) {
      window.alert("Impossible de renommer le foyer : " + error.message);
      return;
    }
    setHousehold((h) => ({ ...h, name: newName }));
  };

  if (loadingSession) return <div style={{ padding: 40 }}>Chargement…</div>;
  if (!session) return <AuthScreen />;
  if (recovering) return (
    <NewPasswordScreen onDone={() => {
      setRecovering(false); setPasswordChanged(true);
      window.history.replaceState(null, "", window.location.pathname);
      setTimeout(() => setPasswordChanged(false), 6000);
    }} />
  );
  if (checkingHousehold) return <div style={{ padding: 40 }}>Chargement…</div>;
  return (
    <React.Fragment>
      {passwordChanged && <div className="toast">✓ Mot de passe modifié.</div>}
      {household
        ? <BudgetTracker household={household} onLogout={logout} onRename={renameHousehold} />
        : <HouseholdSetup session={session} onReady={setHousehold} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  // Manually compile the app source with the CLASSIC JSX runtime.
  // (Babel's default "automatic" runtime injects an ES `import` statement,
  // which fails in a plain, non-module <script> tag.)
  (function () {
    var src = document.getElementById("app-source").textContent;
    var compiled = Babel.transform(src, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    var s = document.createElement("script");
    s.textContent = compiled;
    document.body.appendChild(s);
  })();
</script>
</body>
